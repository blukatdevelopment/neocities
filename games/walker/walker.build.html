WORLD.Grid = {};
WORLD.Grid.new = function(){
    let grid = {
        columns: 40,
        rows: 40,
        terrainMap: [],
        heightMap: [],
        humidityMap: [],
        heatMap: []
    };
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap.push(null);
        grid.heightMap.push(null);
        grid.humidityMap.push(null);
        grid.heatMap.push(null);
    }
    grid.coordsToIndex = function(coords){
        return coords.x + (coords.y * grid.rows);
    };
    grid.indexToCoords = function(index){
        return VECTOR2.new(index % grid.columns, Math.trunc(index / grid.rows));
    };
    grid.coordsValid = function(coords){
        return coords.x > -1 && coords.x < grid.columns
                && coords.y > -1 && coords.y < grid.rows;
    };
    // All coords within a given radius, including the center
    grid.coordsInRadius = function(center, radius){
        let retList = [];
        let adjacencies = [];
        for(let i = (radius * -1); i < radius + 1; i++){
            for(let j = (radius * -1); j < radius + 1; j++){
                let coords = VECTOR2.new(center.x + i, center.y + j);
                if(grid.coordsValid(coords)){
                    retList.push(coords);
                }
            }
        }
        return retList;
    };
    return grid;
};

WORLD.Generate = {};
WORLD.Generate.HeatMap = function(grid){
    let equator = Math.trunc(grid.rows/2);
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            let distance = Math.abs(y - equator);
            let heat = equator - distance;
            grid.heatMap[index] = heat;
        }
    }
};

// 0 is sea level
WORLD.Generate.ElevationMap = function(grid){
    for(let i = 0; i < 10; i++){
        let peakCoords = VECTOR2.new(UTILITY.randRange(0, grid.columns-1), UTILITY.randRange(0, grid.rows-1));
        let peakIndex = grid.coordsToIndex(peakCoords);
        for(let j = 0; j < 5; j++){
            WORLD.Generate.SlopeAroundPeak(grid, peakCoords, j);
        }
    }
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            if(grid.heightMap[index] == null){
                grid.heightMap[index] = -1;
            }
        }
    }
};

WORLD.Generate.SlopeAroundPeak = function(grid, peak, radius){
    let height = 5 - radius; // Reduces by distance
    let coordsList = grid.coordsInRadius(peak, radius);
    for(let coords of coordsList){
        let index = grid.coordsToIndex(coords);
        if(grid.heightMap[index] == null){
            grid.heightMap[index] = height;
        }
    }
};


WORLD.Generate.HumidityMap = function(grid){
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            let isWater = grid.heightMap[index] == -1;
            if(isWater){
                // Humidity on the water is 5
                grid.humidityMap[index] = 5;
            }
            else if(WORLD.Generate.isWaterAdjacent(grid, coords)){
                // Adjacent to water is 4
                grid.humidityMap[index] = 4;
            }
            else if(WORLD.Generate.isWaterNear(grid, coords)){
                grid.humidityMap[index] = 3;
            }
            else{
                grid.humidityMap[index] = 2;
            }
            WORLD.Generate.applySlopeHumidityModifiers(grid, coords, index);
        }
    }
};

WORLD.Generate.isWaterAdjacent = function(grid, coords){
    let neighbors = grid.coordsInRadius(coords, 1);
    for(let neighbor of neighbors){
        if(!neighbor.equals(coords)){
            let neighborIndex = grid.coordsToIndex(neighbor);
            if(grid.heightMap[neighborIndex] == -1){
                return true;
            }
        }
    }
    return false;
};

WORLD.Generate.isWaterNear = function(grid, coords){
    let neighbors = grid.coordsInRadius(coords, 2);
    for(let neighbor of neighbors){
        if(!neighbor.equals(coords)){
            let neighborIndex = grid.coordsToIndex(neighbor);
            if(grid.heightMap[neighborIndex] == -1){
                return true;
            }
        }
    }
    return false;
};

WORLD.Generate.applySlopeHumidityModifiers = function(grid, coords, index){
    if(grid.humidityMap[index] > 3){
        // coastal cells immune from modifier
        return;
    }
    let elevation = grid.heightMap[index];
    let eastNeighbor = VECTOR2.new(coords.x+1, coords.y);
    let eastValid = grid.coordsValid(eastNeighbor);
    let westNeighbor = VECTOR2.new(coords.x-1, coords.y);
    let westValid = grid.coordsValid(westNeighbor);
    if(westValid && grid.heightMap[grid.coordsToIndex(westNeighbor)] > elevation){
        // If cut off from humid winds, penalty
        grid.humidityMap[index] -= 2;
    }
    else if(eastValid && grid.heightMap[grid.coordsToIndex(eastNeighbor)] > elevation){
       // If humids winds are trapped by eastern elevation, bonus
       grid.humidityMap[index] += 2;
    }
};

WORLD.Generate.TerrainMap = function(grid){
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            grid.terrainMap[index] = WORLD.Generate.calculateTerrain(grid, coords, index);
        }
    }
};

WORLD.Generate.calculateTerrain = function(grid, coords, index){
    let elevation = grid.heightMap[index];
    let humidity = grid.humidityMap[index];
    let heat = grid.heatMap[index];

    if(elevation < 0){
        // You're below sea level
        return WORLD.Terrain.Water;
    }
    if(elevation == 1){
        // You're on a beach
        return WORLD.Terrain.Sand;
    }
    if(elevation == 4){
        // You're too high up for vegetation
        return WORLD.Terrain.Rock;
    }
    if(elevation == 5){
        // You're so high up it snows
        return WORLD.Terrain.Snow;
    }
    // By this point elevation is 2 or 3, mainland
    if(heat < 5){
        // It's very cold this far from the equator
        return WORLD.Terrain.Snow;
    }
    if(humidity < 2){
        // You're in a non-frozen desert
        return WORLD.Terrain.Sand;
    }
    if(humidity > 3){
        // You've got a humidity bonus, have some trees
        return WORLD.Terrain.Forest;
    }
    // Humidity must be 3 by this point
    if(heat > 17){
        // Much too hot to retain water
        // Adjust this if you change elevation range
        return WORLD.Terrain.Steppe;
    }
    // By process of elimination, you're in-land.
    // You're at elevation 3, humidity 3,
    // neither close nor far from the equator,
    // and slope is not effecting your humidity
    return WORLD.Terrain.Grass;
};

// Dry land's a myth
WORLD.Generate.WaterWorld = function(){
    let grid = WORLD.Grid.new();
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap[i] = WORLD.Terrain.Water;
    }
    return grid;
};

// Good for exploring on foot
WORLD.Generate.GrassWorld = function(){
    let grid = WORLD.Grid.new();
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap[i] = WORLD.Terrain.Grass;
    }
    return grid;
};

WORLD.Generate.DetailedWorld = function(){
    let grid = WORLD.Grid.new();
    WORLD.Generate.HeatMap(grid);
    WORLD.Generate.ElevationMap(grid);
    WORLD.Generate.HumidityMap(grid);
    WORLD.Generate.TerrainMap(grid);
    return grid;
};

// Configure which keys will be used for ondown
var KEYS_USED = [

];

// Configure keys to check for presses
var KEY_PRESSES_USED = [

];

// Key state
INPUT.activeKeys = {};
INPUT.activeKeyPresses = {};


INPUT.getMousePosition = function(){
  if(INPUT._mousePos){
    return VECTOR2.new(INPUT._mousePos.x, INPUT._mousePos.y);  
  }
  return null;
};

INPUT.getDownScaledMousePosition = function(){
  if(INPUT._mousePos){
    return VECTOR2.new(GRAPHICS.downScale(INPUT._mousePos.x), GRAPHICS.downScale(INPUT._mousePos.y));
  }
  return null;
};


INPUT.mouseClick = function(mouseButton){
  if(mouseButton > -1 && mouseButton < 3){
    return INPUT._mouseClick[mouseButton];
  }
};

INPUT.isMouseDragging = function(mouseButton){
  return INPUT._mouseDown[mouseButton] && !INPUT._mouseClick[mouseButton];
};

INPUT.fullClick = function(){
  return INPUT._fullClick;
};

INPUT.key = function(which){
  if(!(which in INPUT.activeKeys)){
    return false;
  }
  return INPUT.activeKeys[which];
};

INPUT.keyPress = function(which){
  if(!(which in INPUT.activeKeyPresses)){
    return false;
  }
  return INPUT.activeKeyPresses[which];
};

// Triggers when you left click and then release
// Differentiates between click and drag
INPUT.onMouseFullClick = function(evt){
  INPUT._fullClick = true;
};

INPUT.onMouseDown = function(evt){
  let which = evt.button;
  if(which > -1 && which < 3){
    let previousDown = INPUT._mouseDown[which];
    INPUT._mouseDown[which] = true;
    if(!previousDown){
      INPUT._mouseClick[which] = true;
    }
  }
};

INPUT.onMouseUp = function(evt){
  let which = evt.button;
  if(which > -1 && which < 3){
    INPUT._mouseDown[which] = false;
  }
};

INPUT.onMouseMove = function(evt){
  var rect = GRAPHICS.getCanvas().getBoundingClientRect();
  INPUT._mousePos = VECTOR2.new(evt.clientX - rect.left, evt.clientY - rect.top);
};

INPUT.onMouseOut = function(evt){};

INPUT.onKeyDown = function(evt){
  // Suppress Tab Key
  if(evt.which == 9){
    evt.preventDefault();
    evt.stopPropagation();
  }

  if(evt.which in INPUT.activeKeys){
    let previousDown = INPUT.activeKeys[evt.which];
    INPUT.activeKeys[evt.which] = true;
    if(evt.which in INPUT.activeKeyPresses){
      INPUT.activeKeyPresses[evt.which] = false;
      if(!previousDown){
        INPUT.activeKeyPresses[evt.which] = true;
      }
    }
  }
};

INPUT.onKeyUp = function(evt){
  if(evt.which in INPUT.activeKeys){
    INPUT.activeKeys[evt.which] = false;
  }
  if(evt.which in INPUT.activeKeyPresses){
    INPUT.activeKeyPresses[evt.which] = false;
  }
};

INPUT.cancelSpacebarScroll = function(evt){
  if(evt.keyCode == INPUT.KEYS.K_SPACE && evt.target == document.body) {
    evt.preventDefault();
  }
};

INPUT.handleMouseWheel = function(evt){
  event.preventDefault();
  if(event.deltaY != 0){
    INPUT._mouseWheelInput = event.deltaY;
  }
};

// Only allow presses to appear for a single frame
INPUT.clearPresses = function(){
    for(let i in KEY_PRESSES_USED){
      let key = KEY_PRESSES_USED[i];
      INPUT.activeKeyPresses[key] = false;
    }
    INPUT._mouseWheelInput = 0;
    INPUT._mouseClick[0] = false;
    INPUT._mouseClick[1] = false;
    INPUT._mouseClick[2] = false;
    INPUT._fullClick = false;
};

INPUT.getMouseWheel = function(){
  return INPUT._mouseWheelInput;
};

INPUT.initInput = function(){
  for(let key of Object.keys(INPUT.KEYS)){
    KEYS_USED.push(INPUT.KEYS[key]);
    KEY_PRESSES_USED.push(INPUT.KEYS[key]);
  }
  for(let i in KEYS_USED){
    let key = KEYS_USED[i];
    INPUT.activeKeys[key] = false;
  }
  for(let i in KEY_PRESSES_USED){
    let key = KEY_PRESSES_USED[i];
    INPUT.activeKeyPresses[key] = false;
  }
  var canvas = GRAPHICS.getCanvas();
  canvas.addEventListener("click", INPUT.onMouseFullClick);
  canvas.addEventListener("mousedown", INPUT.onMouseDown);
  canvas.addEventListener("mouseup", INPUT.onMouseUp);
  canvas.addEventListener("mousemove", INPUT.onMouseMove);
  canvas.addEventListener("mouseout", INPUT.onMouseOut);
  window.addEventListener('keydown', INPUT.onKeyDown, false);
  window.addEventListener('keyup', INPUT.onKeyUp, false);
  window.addEventListener('keydown', INPUT.cancelSpacebarScroll, false);
  window.addEventListener("wheel", INPUT.handleMouseWheel, { passive:false });
};
/*##############################################################################
# Has an item that can be harvested by interacting
##############################################################################*/
ENTITY.Harvestable = {};
ENTITY.Harvestable.new = function(name, items, emptySprite, fullSprite, rect, isRigid){
    let h = ENTITY.baseEntity.new();
    h.name = name;
    h.items = [];
    h.harvested = false;
    h.emptySprite = emptySprite;
    h.fullSprite = fullSprite;
    h.collider.rect = rect;
    h.collider.isRigid = isRigid;
    h.getSprite = function(){
        if(h.harvested){
            return h.emptySprite;
        }
        return h.fullSprite;
    };
    h.draw = function(){
        if(!GRAPHICS.isOnScreen(h.getSpriteRect())){
            // Don't render if the entity is offscreen.
            return;
        }
        let sprite = h.getSprite();
        if(sprite == null || h.renderer == null){
            return;
        }
        h.renderer.setSprite(sprite);
        console.log("Rendering with sprite " + sprite.toJs());
        h.renderer.draw();
        
        if(h.getLabel() != ""){
            GRAPHICS.drawTextRelative(h.getLabel(), h.position.x, h.position.y);
        }
    };
    h.canHarvest = function(actor){
        for(let item of h.items){
            if(!actor.canStoreItem(item)){
                return false;
            }
        }
        return true;
    };
    h.onInteract = function(interaction){
        if(interaction.initiator == null){
            return;
        }
        if(h.harvested || h.items.length == 0){
            return;
        }
        if(!h.canHarvest(interaction.initiator)){
            UTILITY.notification("You have no space for this item.");
            return;
        }
        for(let item of h.items){
            interaction.initiator.pickUp(item.clone());
            let message = "Harvested " + item.name;
            if(item.quantity > 1){
                message += "(" + item.quantity + ")";
            }
            UTILITY.notification(message);    
        }
        
        h.harvested = true;
    };
    h.getSpriteRect = function(){
        h.renderer.setSprite(h.getSprite());
        return h.renderer.getRect();
    };
    return h;
};
/*##############################################################################
# An entity containing one stack of items, which can be picked up
##############################################################################*/
ENTITY.ItemStack = {};
ENTITY.ItemStack.new = function(item){
    let pue = ENTITY.baseEntity.new();
    pue.entityType = ENTITY.TYPES.ItemStack;
    pue.setCollider(PHYSICS.BoxCollider.new());
    pue.collider.rigid = false;
    pue.item = item;
    pue.name = item.name;
    pue.sprite = item.sprite;
    pue.renderer.setSprite(item.sprite);
    let size = VECTOR2.new(0, 0);
    size.x = item.sprite.sheet.cellResolutionX;
    size.y = item.sprite.sheet.cellResolutionY;
    pue.collider.rect.size = size;
    pue.onCollide = function(collision){};
    pue.onInteract = function(interaction){
        if(interaction.initiator){
            let prevQuant = pue.item.quantity;
            pue.item.quantity = interaction.initiator.pickUp(pue.item);
            let delta = prevQuant - pue.item.quantity;
            let message = "Picked up " + pue.item.name;
            if(delta > 1){
                message += "(" + delta + ")";
            }
            UTILITY.notification(message);
            if(pue.item.quantity == 0){
                SCENE.destroyEntity(pue);
            }
        }
    };
    pue.onAttacked = function(attack){};
    return pue;
};

ENTITYFACTORY.Load = function(data){
    let entity = ENTITYFACTORY.Create(data.entityName);
    if(entity == null){
        console.log("Could not load entity data: " + JSON.stringify(data));
        return;
    }
    if(data.position){
        entity.position = data.position;
    }
    //console.log("Loaded entity " + JSON.stringify(data));
    return entity;
};

ENTITYFACTORY.Create = function(entityName){
    if(ENTITY.ENTITIES[entityName] && ENTITYFACTORY[entityName]){
        let constructor = ENTITYFACTORY[entityName];
        return constructor();
    }
    return null;
};

ENTITYFACTORY.getEntityNames = function(){
    return Object.keys(ENTITY.ENTITIES);
};


ENTITYFACTORY.registerItem = function(itemName){
    // Add an item stack for this item
    let stackName = itemName + "Stack";
    ENTITY.ENTITIES[stackName] = stackName;
    ENTITYFACTORY[stackName] = function(){
        let item = ITEMS.create(itemName, 1, 0);
        let ret = ENTITY.ItemStack.new(item);
        ret.name = stackName;
        return ret;
    };
};

ENTITY.baseEntity = {};
ENTITY.baseEntity.new = function(){
    let be = {
        entityType: ENTITY.TYPES.Scenery,
        name: "",
        entityId: UTILITY.getNextEntityId(),
        position: VECTOR2.new(0, 0),
        collider: PHYSICS.BoxCollider.new(),
        renderer: SPRITES.SpriteRenderer.new(),
        label: ""
    };
    be.renderer.parent = be;
    be.collider.parent = be;
    be.getName = function(){ return be.name; };
    be.getEntityId = function(){
        return be.entityId;
    }
    be.update = function(){};
    be.draw = function(){
        if(!GRAPHICS.isOnScreen(be.getSpriteRect())){
            // Don't render if the entity is offscreen.
            return;
        }
        if(be.renderer){
            be.renderer.draw();
        }
        if(be.getLabel() != ""){
            GRAPHICS.drawTextRelative(be.getLabel(), be.position.x, be.position.y);
        }
    };
    be.getPosition = function(){ return be.position; };
    be.setPosition = function(newPosition){
        be.position = newPosition;
    };
    be.getCollider = function(){ return be.collider; };
    be.setCollider = function(newCollider){
        be.collider = newCollider;
        be.collider.parent = be;
    };
    be.toString = function(){
        let ret = "[";
        ret += be.name + " ID: " + be.entityId;
        ret += ", pos: " + be.position.toString();
        return ret;
    };
    be.centeredPosition = function(){
        return be.collider.absoluteRect().center();
    };
    be.onCollide = function(collision){};
    be.onInteract = function(interaction){};
    be.onAttacked = function(attackData){};
    be.onKnockback = function(direction, magnitude){
        if(be.collider){
            let dest = be.position.move(direction, magnitude);
            be.collider.moveAndCollideShort(dest, true);
        }
    };
    be.die = function(){
        SCENE.destroyEntity(be);
    };
    be.pickUp = function(item){ return item.quantity; };
    be.getData = function(){
        let data = ENTITY.Data.new(be.name, be.position);
        return data;
    };
    be.getSpriteRect = function(){
        return be.renderer.getRect();
    };
    be.recenter = function(position){
        let rect = be.getSpriteRect();
        rect.recenter(position);
        be.position = rect.position;
    };
    be.getLabel = function(){ return ""; };
    return be;
};

UI.COMPONENTS.PlayerUIManager = {};


UI.COMPONENTS.PlayerUIManager.new = function(){
    let cm = {};
    cm.hotbar = UI.COMPONENTS.Hotbar.new(cm);
    cm.inventory = UI.COMPONENTS.Inventory.new(cm);
    cm.statusbar = UI.COMPONENTS.StatusBar.new(cm);
    cm.notificationsBar = UI.COMPONENTS.NotificationBar.new();
    cm.foodbar = UI.COMPONENTS.FoodBar.new(cm);
    cm.paperdoll = UI.COMPONENTS.PaperDoll.new(cm);
    cm.navBar = UI.COMPONENTS.MenuNavBar.new(cm);
    cm.craftingMenu = UI.COMPONENTS.CraftingMenu.new(cm);
    cm.dragged = null;
    cm.activeMenu = MENUS.None;

    cm.update = function(){
        // Always update notifications
        cm.notificationsBar.update();


        if(INPUT.keyPress(INPUT.KEYS.K_TAB)){
            if(cm.activeMenu == MENUS.None){
                cm.activeMenu = MENUS.Equip;
                SCENE.setGameState(GAMESTATES.playerMenus);
            }
            else if(cm.activeMenu == MENUS.Equip){
                cm.activeMenu = MENUS.None;
                SCENE.setGameState(GAMESTATES.play);
            }
            else if(cm.activeMenu == MENUS.Craft){
                cm.activeMenu = MENUS.Equip;
            }
        }

        if(SCENE.getGameState() == GAMESTATES.play){
            cm.hotbar.update();
            return;
        }
        cm.navBar.update();
        if(cm.activeMenu == MENUS.Craft){
            cm.craftingMenu.update();
        }
        if(cm.activeMenu == MENUS.Equip){
            cm.handleDrag();    
        }
    };

    cm.handleDrag = function(){
        if(INPUT.mouseClick(INPUT.LEFT_MOUSE)){
            let draggedComponent = cm.getDraggedComponent();
            if(draggedComponent){
                cm.dragged = {
                    component: draggedComponent,
                    slot: draggedComponent.getHoveredSlot()
                };
            }
        }
        if(INPUT.fullClick()){
            // Deposit dropped item if possible
            let destComponent = cm.getHoveredComponent();
            if(destComponent && cm.dragged){
                let destSlot = destComponent.getHoveredSlot();
                let draggedItem = cm.dragged.component.getItem(cm.dragged.slot);
                let displacedItem = destComponent.getItem(destSlot);
                let nullCheck = draggedItem != null && displacedItem != null;
                if(nullCheck && draggedItem.name == displacedItem.name){
                    // Try to stack like items. Do not swap places.
                    let space = displacedItem.stackSpace();
                    if(space >= draggedItem.quantity){
                        displacedItem.stack(draggedItem.quantity);
                        cm.dragged.component.setItem(cm.dragged.slot, null)
                    }
                    else{
                        let overflow = draggedItem.quantity - space;
                        displacedItem.stack(space);
                        draggedItem.quantity = overflow;
                    }
                }
                else if(destComponent.canSetItem(destSlot, draggedItem) && cm.dragged.component.canSetItem(cm.dragged.slot, displacedItem)){
                    // Swap contents of slots
                    destComponent.setItem(destSlot, draggedItem);
                    cm.dragged.component.setItem(cm.dragged.slot, displacedItem);
                }
            }
            else if(cm.dragged){
                // Drop item
                let player = SCENE.getPlayerOne();
                let draggedItem = cm.dragged.component.getItem(cm.dragged.slot);
                player.dropItem(draggedItem);
                cm.dragged.component.setItem(cm.dragged.slot, null);
            }
            // Stop dragging
            cm.dragged = null;
        }
    };
    cm.draw = function(){
        // Always draw notifications bar
        cm.notificationsBar.draw();

        if(cm.activeMenu == MENUS.None){
            cm.statusbar.draw();
            cm.foodbar.draw();
            cm.hotbar.draw();
        }
        else if(cm.activeMenu == MENUS.Equip){
            cm.hotbar.draw();
            cm.inventory.draw();
            cm.paperdoll.draw();
            cm.statusbar.draw();
            cm.foodbar.draw();
            cm.navBar.draw();
        }
        else if(cm.activeMenu == MENUS.Craft){
            cm.craftingMenu.draw();
            cm.navBar.draw();
            cm.hotbar.draw();
            cm.inventory.draw();
        }
        
        if(cm.dragged == null){
            return;
        }

        let slot = cm.dragged.slot;
        let item = cm.dragged.component.linkedInv.getItem(slot);

        if(item == null){
            return;
        }
        let pos = INPUT.getDownScaledMousePosition();
        let size = VECTOR2.new(item.sprite.sheet.cellResolutionX, item.sprite.sheet.cellResolutionY);
        //pos.x += size.x/2;
        //pos.y += size.y/2;
        SPRITES.renderSprite(pos.x, pos.y, item.sprite.index, item.sprite.sheet, DISPLAY_MODES.static);
    };
    // Component who's item is being clicked and dragged
    cm.getDraggedComponent = function(){
        if(cm.hotbar.getHoveredSlot() != -1 && cm.hotbar.getItem(cm.hotbar.getHoveredSlot()) != null){
            return cm.hotbar;
        }
        if(cm.inventory.getHoveredSlot() != -1 && cm.inventory.getItem(cm.inventory.getHoveredSlot()) != null){
            return cm.inventory;
        }
        if(cm.paperdoll.getHoveredSlot() != null && cm.paperdoll.getHoveredItem() != null){
            return cm.paperdoll;
        }
        return null;
    };
    // Component whose slot is hovered over
    cm.getHoveredComponent = function(){
        if(cm.hotbar.getHoveredSlot() != -1){
            return cm.hotbar;
        }
        if(cm.inventory.getHoveredSlot() != -1){
            return cm.inventory;
        }
        if(cm.paperdoll.getHoveredSlot() != null){
            return cm.paperdoll;
        }
        return null;
    };
    cm.linkActor = function(actor){
        cm.hotbar.linkedInv = actor.hotbar;
        cm.inventory.linkedInv = actor.inventory;
        cm.statusbar.linkActor(actor);
        cm.paperdoll.linkedInv = actor.paperdoll;
    };
    return cm;
};
UTILITY.PagedArray = {};
UTILITY.PagedArray.new = function(array, pageSize){
    let pa = {
        array: array,
        pageSize: pageSize,
        currentPage: 0
    };
    pa.totalPages = function(){
        let length = pa.array.length;
        if(length == 0){
            return 0;
        }
        return length / pa.pageSize;
    };
    pa.nextPage = function(){
        if(pa.currentPage + 1 < pa.totalPages()){
            pa.currentPage++;
        }
    };
    pa.previousPage = function(){
        if(pa.currentPage > 0){
            pa.currentPage--;
        }
    };
    pa.getPageElements = function(){
        let elements = [];
        let pageStart = pa.currentPage * pa.pageSize;
        let pageEnd = pageStart + pa.pageSize;
        for(let i = pageStart; i < pageEnd; i++){
            if(i < pa.array.length){
                elements.push(pa.array[i]);
            }
        }
        return elements;
    };
    return pa;
};

UTILITY.formatHealth = function(health){
    return Math.trunc(health/4);
}

UTILITY.formatDamage = function(damage){
    let sign = "-";
    let wholeNumber = Math.trunc(damage/4);
    if(wholeNumber < 0){
        wholeNumber *= -1;
    }
    let prefix = "" + wholeNumber;

    let remainder = damage % 4;
    if(remainder < 0){
        remainder *= -1;
    }
    
    let suffix = "";
    if(remainder == 1){
        suffix = ".25";
    }
    if(remainder == 2){
        suffix = ".5";
    }
    if(remainder == 3){
        suffix = ".75";
    }
    return sign + "" + prefix + "" + suffix;
}

		return;
	}
	else if(SETTINGS._logLevel == 1){
		// Level 1: basic info
		console.log(`${sender}, ${message}`);
	}
	else{
		// Level 2+: include context
		let contextString = JSON.stringify(context);
		console.log(`${sender}, ${message}, ${contextString}`);
	}
}

UTILITY.download = function(data, fileName){
    let cType = "text/plain";
    const blob = new Blob([data], { type: cType });

    const url = URL.createObjectURL(blob);

    const l = document.createElement('a');
    l.href = url;
    l.download = fileName;
    l.style.display = 'none';

    document.body.appendChild(l);
    l.click();

    document.body.removeChild(l);
    URL.revokeObjectURL(url);
};

LEVEL.TileMap = {};
LEVEL.TileMap.new = function(sprites, tiles, size){
    let tm = {
        tileSprites: sprites,
        tiles: tiles,
        size: size, // Assumed to be square
    };
    tm.getRect = function(){
        let pos = VECTOR2.new(0,0);
        let tileSize = SETTINGS.DefaultLevelTileSize;
        let levelSize = tileSize * tm.size; 
        return SHAPES.RECT.new(pos, VECTOR2.new(levelSize, levelSize));
    };
    tm.getPositionByIndex = function(index){
        let coords = VECTOR2.new(index % tm.size, Math.trunc(index / tm.size));
        coords.x *= SETTINGS.DefaultLevelTileSize;
        coords.y *= SETTINGS.DefaultLevelTileSize;
        return coords;
    };
    tm.getSpriteByIndex = function(index){
        return tm.tileSprites[tm.tiles[index]];
    };
    tm.getSpriteIndexByCoords = function(coords){
        let index = coords.y * tm.size + coords.x;
        console.log("getSpriteBycoords " + coords.toString() + ", index " + index);
        return tm.tiles[index];
    };
    return tm;
};

LEVEL.Renderer = {};
LEVEL.Renderer.new = function(){
    let lr = {
        player: null,
        entities: [],
        scenery: [], // excluded from collisions
        ui: null,
        lighting: GRAPHICS.LightingController.new(),
        tileMap: null
    };
    lr.init = function(){
        GRAPHICS.setDisplayMode(DISPLAY_MODES.camera);
        lr.physics = PHYSICS.Controller.new();
        lr.player = ACTORFACTORY.PlayerOne();
        lr.addEntity(lr.player);
        lr.ui = UI.COMPONENTS.PlayerUIManager.new();
        lr.ui.linkActor(lr.player);
    };
    lr.loadData = function(data){
        let levelSize = SETTINGS.DefaultLevelTileSize * SETTINGS.DefaultLevelSize;
        let levelRect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(levelSize, levelSize));
        SCENE.setLevelRect(levelRect);
        if(data.tileMap){
            lr.tileMap = data.tileMap;
            let tileMap = data.tileMap;
            for(let i = 0; i < tileMap.tiles.length; i++){
                let sprite = tileMap.getSpriteByIndex(i);
                let pos = tileMap.getPositionByIndex(i);
                let tile = ENTITY.Scenery.new("Tile", sprite, pos);
                lr.scenery.push(tile);
            }
        }
        for(let entityData of data.entityData){
            lr.addEntity(ENTITYFACTORY.Load(entityData));
        }
        if(data.playerPosition && lr.player){
            lr.player.setPosition(data.playerPosition);
        }
    };
    lr.getData = function(){
        let data = LEVEL.Data.new();
        data.tileMap = lr.tileMap;
        for(let entity of lr.entities){
            data.entityData.push(entity.getData());
        }
        return data;
    };
    lr.update = function(){
        lr.physics.update();
        if(SCENE.getGameState() === GAMESTATES.play){
            for(let entity of lr.entities){
                if(entity){
                  entity.update();
                }
            }
        }
        if(lr.ui){
            lr.ui.update();
        }
        lr.updateCursor();
        lr.drawLevel();
        if(INPUT.keyPress(INPUT.KEYS.K_F)){
            // TODO: Remove this debug code
            lr.lighting.darkness = 100;    
        }
    };
    lr.cursorInRange = function(){
        let pos = GRAPHICS.getWorldCursor();
        let walkerPos = lr.player.centeredPosition();
        let distance = pos.distance(walkerPos);
        return distance < SETTINGS.interactionRange;
    };
    lr.updateCursor = function(){
        if(lr.cursorInRange()){
            SCENE.updateCursor(SPRITES.static.cursors.roundBlack);
          }
          else{
            SCENE.updateCursor(SPRITES.static.cursors.roundRed);
          }
    };
    lr.drawLevel = function(){
        GRAPHICS.clearCanvas();

        for(let renderer of lr.scenery){
            renderer.draw();
        }
        for(let ent of lr.getRenderSortedEntities()){
            ent.draw();
        }
        lr.lighting.draw();
        if(lr.ui){
            lr.ui.draw();    
        }
        
    }
    lr.getRenderSortedEntities = function(){
        let onScreen = [];
        for(let ent of lr.entities){
            if(GRAPHICS.isOnScreen(ent.getSpriteRect())){
                onScreen.push(ent);
            }
        }
        onScreen.sort((a, b) => {
            let aY = a.position.y + a.getSpriteRect().size.y;
            let bY = b.position.y + b.getSpriteRect().size.y;
            if(aY < bY){
                return -1;
            }
            if(aY > bY){
                return 1;
            }
            return 0;
        });
        return onScreen;
    };
    lr.addEntity = function(entity){
        if(entity == null){
            return;
        }
        if(entity.name == "BerryBush"){
            console.log( "BerryBush:" + entity.toString());
        }
        lr.entities.push(entity);
        lr.physics.registerCollider(entity.getCollider());
    };
    lr.destroyEntity = function(entity){
      if(entity == lr.player){
        console.log("Game over!");
      }
      // Removes entity after update loop completes.
      UTILITY.delayExecute(0, () => { lr.removeEntity(entity); });
    };
    lr.removeEntity = function(entity){
      lr.entities = lr.entities.filter((ent) => ent !== entity);
      lr.physics.unregisterCollider(entity.getCollider());
    };
    lr.notification = function(message){
        if(lr.ui){
            lr.ui.notificationsBar.notification(message);
        }
    };
    lr.emitLight = function(light){
        if(lr.lighting){
            lr.lighting.emitLight(light);
        }
    }
    return lr;
};

LEVEL.Generate.Cell = {};
LEVEL.Generate.Cell.new = function(data, rect){
    let cg = {
        data: data,
        rect: rect,
        entities: []
    };
    cg.generate = function(){
        cg.generateEntities();
    };
    cg.getRandomPosition = function(){
        let minX = cg.rect.position.x;
        let minY = cg.rect.position.y;
        let maxX = minX + cg.rect.size.x;
        let maxY = minY + cg.rect.size.y;
        return VECTOR2.new(
            UTILITY.randRange(minX, maxX),
            UTILITY.randRange(minY, maxY)
        );
    };
    cg.placeEntityRandomly = function(entity){
        let iterations = 0;

        while(iterations < 5000){
            iterations++;
            entity.position = cg.getRandomPosition();
            if(cg.canPlace(entity)){
                iterations = 5000;
            }
        }

        cg.addEntity(entity);
    };
    cg.canPlace = function(_entity){
        for(let entity of cg.entities){
            if(_entity.collider.overlaps(entity.collider)){
                return false;
            }
        }
        return true;
    };
    cg.addEntity = function(entity){
        cg.data.entityData.push(entity.getData());
        cg.entities.push(entity);
    };
    cg.generateEntities = function(){};
    return cg;
};

SPRITES.SpriteRenderer = {};
SPRITES.SpriteRenderer.new = function(sprite, position){
  let sr = {
    sprite: sprite,
    position: VECTOR2.new(0, 0),
    parent: null // inherent position from an object
  };
  if(position){
    sr.position = position;
  }
  sr.update = function(){
    sr.draw();
  };
  sr.draw = function(){
    if(sr.sprite == null){
      return;
    }
    let pos = sr.position;
    if(sr.parent){
      pos = sr.parent.getPosition();
    }
    SPRITES.renderSprite(pos.x, pos.y, sr.sprite.index, sr.sprite.sheet);
  };
  sr.setSprite = function(newSprite){
    sr.sprite = newSprite;
  };
  sr.getRect = function(){
    if(sr.sprite == null){
      return SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(0,0));
    }
    let position = VECTOR2.new(0,0);
    if(sr.parent){
      position = sr.parent.position;
    }
    return SHAPES.RECT.new(
      position,
      VECTOR2.new(sr.sprite.sheet.cellResolutionX,sr.sprite.sheet.cellResolutionY)
    );
  };
  sr.toString = function(){
    let ret = "Renderer[";
    ret += "sprite: " + sr.sprite.name;
    ret += ", position: " + sr.position.toString();
    ret += ", parent: " + parent;
    ret += "]";
    return ret;
  };
  return sr;
};

GRAPHICS.LightingController = {};
GRAPHICS.LightingController.new = function(){
    let lm = {
        lights: [],
        darkness: 0
    };
    lm.rect = SHAPES.RECT.new(
        VECTOR2.new(SETTINGS.viewportMin, SETTINGS.viewportMin),
        VECTOR2.new(SETTINGS.viewportMax, SETTINGS.viewportMax)
    );
    lm.canvas = GRAPHICS.Canvas.new();
    lm.canvas2 = GRAPHICS.Canvas.new();
    lm.draw = function(){
        if(lm.darkness != 0){
            lm.drawShadow();
            lm.drawLights();
        }
        lm.lights = []
        lm.canvas.render();        
        lm.canvas.clear();
        lm.canvas2.render();
        lm.canvas2.clear();
    };
    lm.drawShadow = function(){
        let x = lm.rect.position.x;
        let y = lm.rect.position.y;
        let w = lm.rect.size.x;
        let h = lm.rect.size.y;
        let effectiveDarkness = Math.trunc(lm.darkness/1.25);
        let c = "rgb(0 0 0 / " + effectiveDarkness + "%)";
        lm.canvas.fillBox(x, y, w, h, c);
        lm.canvas2.fillBox(x, y, w, h, c);
    };
    lm.drawLights = function(){
        for(let light of lm.lights){
            let pos = light.rect.center();
            pos = GRAPHICS.relativeToCamera(pos);
            lm.canvas.clearCircle(pos.x, pos.y, light.radius);
            lm.canvas.drawCircle(pos.x, pos.y, light.radius, light.color);
            let rect = light.rect;
            lm.canvas2.clearCircle(pos.x, pos.y, light.radius * 2);
        }
    };
    lm.emitLight = function(light){
        lm.lights.push(light);
    };
    return lm;
};
// Basic rectangular camera that can be panned
GRAPHICS.Camera = {};
GRAPHICS.Camera.new = function(position, size){
  let cam = {
    rect: SHAPES.RECT.new(position, size)
  };
  cam.move = function(destination){
    if(cam.boundsCheck(destination)){
      // Valid destination
      cam.rect.position = destination;
      return;
    }
    let pos = cam.rect.position;
    let destX = VECTOR2.new(destination.x, pos.y);
    if(cam.boundsCheck(destX)){
      // Move only on x axis if possible
      cam.rect.position = destX;
      return;
    }
    let destY = VECTOR2.new(pos.x, destination.y);
    if(cam.boundsCheck(destY)){
      // Move only on y axis if possible
      cam.rect.position = destY;
      return;
    }
  };
  cam.boundsCheck = function(destination){
    let levelRect = SCENE.getLevelRect();
    if(levelRect == null){
      return true;
    }
    let rect = cam.rect.clone();
    rect.position = destination;
    return rect.isInside(levelRect);
  };
  return cam;
};

SPRITES.renderSprite = function(posX, posY, index, sheet, forceDisplayMode){
  // Assumes one horizontal strip of cells
  let offX = index * sheet.cellResolutionX;
  let offY = 0;
  let displayMode = GRAPHICS.getDisplayMode();
  if(forceDisplayMode){
    displayMode = forceDisplayMode;
  }

  // Make relative to camera
  if( displayMode == DISPLAY_MODES.camera){
    let relative = GRAPHICS.relativeToCamera(VECTOR2.new(posX, posY));
    posX = relative.x;
    posY = relative.y;
  }
  posX = GRAPHICS.scale(posX);
  posY = GRAPHICS.scale(posY);
  GRAPHICS.drawImageToImage(
      sheet.element, // Image
      offX, // X offset into image
      offY, // Y offset into image
      sheet.cellResolutionX, // sprite width
      sheet.cellResolutionY, // sprite height
      posX, // X offset drawing to canvas
      posY, // Y offset drawing to canvas
      GRAPHICS.scale(sheet.cellResolutionX), 
      GRAPHICS.scale(sheet.cellResolutionY) 
   );
};

// Draws a sprite directly onto the screen without scaling

SPRITES.staticRenderSprite = function(posX, posY, index, sheet){

  let offX = index * sheet.cellResolutionX;
  let offY = 0;

  GRAPHICS.drawImageToImage(
      sheet.element, // Image
      offX, // X offset into image
      offY, // Y offset into image
      sheet.cellResolutionX, // sprite width
      sheet.cellResolutionY, // sprite height
      posX, // X offset drawing to canvas
      posY, // Y offset drawing to canvas
      sheet.cellResolutionX, 
      sheet.cellResolutionY 
   );
};


/*##############################################################################
# Wrapper for the OffScreenCanvas element to draw to the screen
# Takes viewport units and draws canvas at screen resolution
##############################################################################*/
GRAPHICS.Canvas = {};
GRAPHICS.Canvas.new = function(){
    let c = {};
    c.canvas = new OffscreenCanvas(SETTINGS.canvasMax, SETTINGS.canvasMax);
    c.context = c.canvas.getContext("2d");

    c.fillBox = function(x, y, width, height, color){
        let ctx = c.context;
        if(color){
            ctx.fillStyle = color;
        }
        x = GRAPHICS.scale(x);
        y = GRAPHICS.scale(y);
        width = GRAPHICS.scale(width);
        height = GRAPHICS.scale(height);
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = SETTINGS.defaultColor;
    };
    c.clearCircle = function(x, y, radius){
        let ctx = c.context;
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        x = GRAPHICS.scale(x);
        y = GRAPHICS.scale(y);
        radius = GRAPHICS.scale(radius);
        let startAngle = 0;
        let endAngle = Math.PI * 2
        ctx.arc(x, y, radius, startAngle, endAngle);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    };
    c.drawCircle = function(x, y, radius, color){
        let ctx = c.context;
        ctx.beginPath();
        if(color){
            ctx.fillStyle = color;
        }
        x = GRAPHICS.scale(x);
        y = GRAPHICS.scale(y);
        radius = GRAPHICS.scale(radius);
        let startAngle = 0;
        let endAngle = Math.PI * 2
        ctx.arc(x, y, radius, startAngle, endAngle);
        ctx.fill();
        ctx.fillStyle = SETTINGS.defaultColor;
    };
    c.clear = function(){
        let ctx = c.context;
        ctx.clearRect(0,0, c.canvas.width, c.canvas.height);
        ctx.beginPath();
    };
    // Copy contents to main canvas
    c.render = function(){
        let ctx = GRAPHICS.getContext();
        ctx.drawImage(c.canvas, 0, 0);
    };
    return c;
};

// Increments over the animation's cells using the animation clock
SPRITES.Animator = {};
SPRITES.Animator.new = function(){
  let anr = {
    animation: null,
    index: 0,
    nextAnimation: null
  };
  anr.setAnimation = function(animation){
    if(anr.animation.name != animation.name){
      anr.animation = animation;
      anr.index = animation.startIndex;
    }
    
  };
  // Plays first animation, loops next
  anr.playAnimationOnce = function(animation, nextAnimation){
    anr.nextAnimation = nextAnimation;
    anr.setAnimation(animation);
  };
  anr.activeAnimation = function(){
    if(anr.animation){
      return anr.animation.name;
    }
    return null;
  };
  anr.update = function(posX, posY){
    for(let i = 0; i < UTILITY.framesAdvanced(); i++){
      anr.step();
    }
    if(anr.animation){
      SPRITES.renderSprite(posX, posY, anr.index, anr.animation.sheet);
    }
    else{
      UTILITY.log("SPRITES", "Invalid animation", JSON.stringify(anr.animation));
    }
  }
  anr.step = function(){
    if(SCENE.getGameState() && SCENE.getGameState() !== GAMESTATES.play){
      return;
    }
    if(anr.animation){
      anr.index++;
      if(anr.index > anr.animation.endIndex){
        if(anr.nextAnimation){
          // Switch to next animation if one's configured
          anr.setAnimation(anr.nextAnimation);
          anr.nextAnimation = null;
        }
        else{
          // Loop current animation
          anr.index = anr.animation.startIndex;
        }
      }
    }
    else{
      UTILITY.log("SPRITES", "Animator has no animation", + JSON.stringify(anr));
    }
  };
  anr.getSize = function(){
    return VECTOR2.new(anr.animation.sheet.cellResolutionX, anr.animation.sheet.cellResolutionY);
  };
  return anr;
};

GRAPHICS.isOnScreen = function(rect){
  let cr = GRAPHICS._camera.rect;
  return cr.overlaps(rect);
};

GRAPHICS.getDisplayMode = function(){
  return GRAPHICS._displayMode;
};


GRAPHICS.setDisplayMode = function(mode){
  //UTILITY.log("GRAPHICS", "Ssrng display mode", {mode: mode});
  GRAPHICS._displayMode = mode;
};

// Returns global camera instance
GRAPHICS.getCamera = function(){
  return GRAPHICS._camera;
};

GRAPHICS.centerCamera = function(point){
  let size = GRAPHICS._camera.rect.size;
  let centered = VECTOR2.new(point.x - (size.x/2), point.y - (size.y/2));
  GRAPHICS._camera.move(centered);
};

GRAPHICS.getCameraCenter = function(){
  return GRAPHICS._camera.rect.center();
};

GRAPHICS.panCamera = function(vector){
  let cam = GRAPHICS._camera;
  let dest = vector.add(cam.rect.center());
  GRAPHICS.centerCamera(dest);
};

// Returns position relative to camera VECTOR2
GRAPHICS.relativeToCamera = function(point){
  //console.log("From " + point.toString() + " to " + GRAPHICS._camera.rect.position.toString());
  let pos = GRAPHICS._camera.rect.position;
  return VECTOR2.new(point.x - pos.x, point.y - pos.y);
};

// Scales up from viewport to screen
GRAPHICS.scale = function(viewport_units){
  return viewport_units * GRAPHICS._scale;
};

// Scales down from screen down to viewport
GRAPHICS.downScale = function(pixels){
  return pixels / GRAPHICS._scale;
};

// returns point in worldspace where mouse is pointing
GRAPHICS.getWorldCursor = function(){
  let pos = INPUT.getMousePosition();
  if(pos){
    pos.x = GRAPHICS.downScale(pos.x);
    pos.y = GRAPHICS.downScale(pos.y);
    pos = GRAPHICS.getWorldPoint(pos);
  }
  return pos;
};

// Converts from point relative to viewport to point in absolute space
GRAPHICS.getWorldPoint = function(viewPortPoint){
  let pos = GRAPHICS._camera.rect.position;
  return pos.add(viewPortPoint);
};

GRAPHICS.getCanvas = function(){
  return GRAPHICS._canvas;
};

GRAPHICS.getContext = function(){
  return GRAPHICS._context;
};

GRAPHICS.drawCircle = function(x, y, radius){
  GRAPHICS._context.imageSmoothingEnabled = false;
  let context = GRAPHICS.getContext();
  context.beginPath();
  context.arc(x, y, radius, 0, 2 * Math.PI);
  context.fill();
  GRAPHICS._context.imageSmoothingEnabled = false;
};

GRAPHICS.drawLine = function(x1, y1, x2, y2){
  GRAPHICS._context.imageSmoothingEnabled = false;
  x1 = GRAPHICS.scale(x1);
  y1 = GRAPHICS.scale(y1);
  x2 = GRAPHICS.scale(x2);
  y2 = GRAPHICS.scale(y2);

  let context = GRAPHICS.getContext();
  context.moveTo(x1, y1);
  context.lineTo(x2, y2);
  context.stroke();
  GRAPHICS._context.imageSmoothingEnabled = false;
};

GRAPHICS.clearCanvas = function(){
  GRAPHICS._context.imageSmoothingEnabled = false;
  let context = GRAPHICS.getContext();
  let canvas = GRAPHICS.getCanvas();
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.beginPath();
  GRAPHICS._context.imageSmoothingEnabled = false;
};

// XY is for top left corner.
GRAPHICS.drawBox = function(x, y, width, height, color){
  let ctx = GRAPHICS.getContext();
  ctx.imageSmoothingEnabled = false;
  if(color){
    ctx.strokeStyle = color;
  }
  ctx.lineWidth = 2;
  let scaledX = GRAPHICS.scale(x);
  let scaledY = GRAPHICS.scale(y);
  let scaledWidth = GRAPHICS.scale(width);
  let scaledHeight = GRAPHICS.scale(height);

  ctx.strokeRect(scaledX, scaledY, scaledWidth, scaledHeight);
  ctx.strokeStyle = SETTINGS.defaultColor;
  ctx.imageSmoothingEnabled = false;
};

// Renders text with a background right next to the cursor
GRAPHICS.drawTooltip = function(text){
  if(text == null){
    return;
  }
  let pos = INPUT.getMousePosition();
  let cs = SETTINGS.CursorSize;
  pos.x = GRAPHICS.downScale(pos.x);
  pos.y = GRAPHICS.downScale(pos.y);
  let textSize = GRAPHICS.getTextSize(text);
  let height = textSize.y;
  let width = textSize.x;
  GRAPHICS.fillBox(pos.x+cs, pos.y, width, height, GRAPHICS.Colors.Beige);
  GRAPHICS.drawText(text, pos.x+cs, pos.y+cs, 20);
};

// XY is for the top left corner.
GRAPHICS.fillBox = function(x, y, width, height, color){
  let ctx = GRAPHICS._context;
  ctx.imageSmoothingEnabled = false;
  if(color){
    ctx.fillStyle = color;
  }
  x = GRAPHICS.scale(x);
  y = GRAPHICS.scale(y);
  width = GRAPHICS.scale(width);
  height = GRAPHICS.scale(height);
  ctx.fillRect(x, y, width, height);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = SETTINGS.defaultColor;
};

GRAPHICS.drawImageToImage = function(image, x1, y1, width1, height1, x2, y2, width2, height2){
  GRAPHICS._context.imageSmoothingEnabled = false;
  x2 = x2;
  y2 = y2;

  let context = GRAPHICS.getContext();
  context.drawImage(image, x1, y1, width1, height1, x2, y2, width2, height2);
  GRAPHICS._context.imageSmoothingEnabled = false;
};

GRAPHICS.drawImage = function(image, x, y, width, height){
  GRAPHICS._context.imageSmoothingEnabled = false;
  x = GRAPHICS.scale(x);
  y = GRAPHICS.scale(y);
  width = GRAPHICS.scale(width);
  height = GRAPHICS.scale(height);

  let context = GRAPHICS.getContext();
  context.drawImage(image, x, y, width, height);
  GRAPHICS._context.imageSmoothingEnabled = false;
};



// Draw text at static point
GRAPHICS.drawText = function(text, x, y, _textSize, color){
  let ctx = GRAPHICS.getContext();
  ctx.imageSmoothingEnabled = false;
  let textSize = GRAPHICS.scale(SETTINGS.defaultFontSize);
  if(_textSize){
    textSize = _textSize;
  }
  if(color){
    ctx.fillStyle = color;
  }
  x = GRAPHICS.scale(x);
  y = GRAPHICS.scale(y);
  ctx.font = "" + textSize + "px Arial";
  ctx.fillText(text, x, y);
  ctx.fillStyle = SETTINGS.defaultColor;
  ctx.imageSmoothingEnabled = false;
};


GRAPHICS.getTextSize = function(text, textSize){
  let ctx = GRAPHICS.getContext();
  ctx.font = "" + textSize + "px Arial";
  let measurement = ctx.measureText(text, );
  return VECTOR2.new(measurement.width, measurement.height);
};

// Draw text relative to viewport
GRAPHICS.drawTextRelative = function(text, x, y, color){
  let ctx = GRAPHICS.getContext();
  ctx.imageSmoothingEnabled = false;
  if(color){
    ctx.fillStyle = color;
  }
  let relative = GRAPHICS.relativeToCamera(VECTOR2.new(x, y));
  GRAPHICS.drawText(text, relative.x, relative.y);
  ctx.fillStyle = SETTINGS.defaultColor;
};

GRAPHICS.loadImage = function(fileName){
  let element = new Image();
  element.addEventListener('error', function handleError() {
    UTILITY.log("GRAPHICS", "Invalid URL", {url: element.src});
  });
  element.src = SETTINGS.assetsUrl + fileName;
  return element;
};



// Applies async validation before actually adding to object
GRAPHICS.addImageAsync = function(fileName, object, key){
  GRAPHICS.isValidImage(fileName)
  .then(isValid => {
    if (isValid) {
      UTILITY.log("GRAPHICS", "Image URL valid. Loading.", { name: fileName });
      const img = new Image();
      img.src = fileName;
      object[key] = img;
    }
    else {
      UTILITY.log("GRAPHICS", "Image URL invalid.", { name: fileName });
    }
  });
};

GRAPHICS.isValidImage = function(src) {
  return new Promise((resolve) => {
    const img = new Image();

    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);

    img.src = src;
  });
};
STATS.Resource = {};
STATS.Resource.new = function(name, value, maxAttribute, color, transparentColor){
  let st = {
    name: name,
    value: value,
    maxAttribute: maxAttribute,
    min: 0,
    damageCooldown: null,
    lastChangeTime: null,
    lastChangeDelta: null,
    color: color,
    transparentColor: transparentColor,
    controller: null // The stats controller containing this resource
  };
  st.update = function(){
    if(st.value > st.max()){
      st.value = st.max();
    }
  };
  st.reset = function(){
    st.value = st.max();
  };
  st.clear = function(){
    st.value = st.min;
  };
  st.change = function(delta){
    if(delta > 0 && st.value == st.max()){
      // Already full
      return;
    }
    if(delta < 0 && st.value == st.min){
      // Already empty
      return;
    }
    st.value += delta;
    st.value = UTILITY.clamp(st.value);
    st.lastChangeDelta = delta;
    st.lastChangeTime = Date.now();
  };
  st.changeDelta = function(){
    return st.lastChangeDelta;
  };
  st.changeAgeSeconds = function(){
    if(st.lastChangeTime == null){
      return null;
    }
    return Math.trunc(st.changeAgeMilliseconds()/1000);
  };
  st.changeAgeMilliseconds = function(){
    if(st.lastChangeTime == null){
      return null;
    }
    let last = st.lastChangeTime;
    let now = Date.now();
    let elapsed = now - last;
    return elapsed;
  };
  st.max = function(){
    if(st.controller == null){
      UTILITY.log("STATS.Resource.max","Controller not set",{name: st.name});
      return -1;
    }
    return st.controller.getAttribute(st.maxAttribute);
  };
  st.toString = function(){
    let ret = "Stat[";
    ret += "name: " + st.name;
    ret += ", value: " + st.value;
    ret += ", max: " + st.max();
    ret += ", min: " + st.min;
    ret += ", damageCooldown: " + st.damageCooldown;
    ret += "]";
    return ret;
  };
  return st;
};

// A change over time applied to a status, such as regen or drain.
STATS.Effect.ResourceEffect.new = function(name, source, resource, delta, interval, duration){
  let se = {
    effectType: STATS.Effect.Types.Resource,
    name: name,
    source: source,
    resource: resource,
    delta: delta,
    interval: interval,
    duration: duration,
    expiration: null,
    lastApplied: null,
    blockedByEffect: null
  };
  return se;
};

##############################################################################*/
STATS.Attack = {};
STATS.Attack.new = function(){
  let atk = {
    upAnimation: null,
    downAnimation: null,
    leftAnimation: null,
    rightAnimation: null,
    damage: null,
    frames: null,
    damageFrames: [],
    damageDice: [],
    cost: null
  };
  atk.getDamage = function(){
    let dmg = 0;
    if(atk.damage != null){
      dmg += atk.damage;
    }
    for(let die of atk.damageDice){
      dmg += die.roll();
    }
    dmg *= -1;
    dmg *= SETTINGS.PiecesPerHeart;
    return dmg;
  };
  return atk;
};
STATS.StatsController = {};
STATS.StatsController.new = function(){
  let stc = {
    attributes: STATS.getDefaultAttributes(),
    resources: STATS.getDefaultResources(),
    effects: []
  };
  stc.resources[STATS.Resources.health].controller = stc;
  stc.resources[STATS.Resources.energy].controller = stc;
  stc.resources[STATS.Resources.magic].controller = stc;
  stc.getStat = function(name){
    if(stc.attributes[name]){
      return stc.attributes[name];
    }
    if(stc.resources[name]){
      return stc.resources[name];
    }
    return null;
  };
  stc.getResourceValue = function(resource){
    if(stc.resources[resource]){
      return stc.resources[resource].value;
    }
  };
  stc.changeResource = function(resource, delta){
    if(stc.resources[resource]){
      stc.resources[resource].change(delta);
    }    
  };
  stc.getAttribute = function(attribute){
    if(stc.attributes[attribute]){
      let atr = stc.attributes[attribute];
      return atr.value + atr.modifier;
    }
  };
  stc.setAttributeValue = function(attribute, newValue){
    if(stc.attributes[attribute]){
      stc.attributes[attribute].value = newValue;
    }
  };
  stc.changeAttributeModifier = function(attribute, modifier){
    if(stc.attributes[attribute]){
      let prev = stc.attributes[attribute].modifier;
      stc.attributes[attribute].modifier += modifier;      
    }
  };
  stc.getEffect = function(name, source){
    for(let effect of stc.effects){
      if(effect.name === name && effect.source === source){
        return effect;
      }
    }
    return null;
  };
  stc.addEffects = function(effects){
    if(effects == null){
      return;
    }
    for(let _effect of effects){
      stc.addEffect(_effect);
    }
  };
  stc.addEffect = function(_effect){
    if(_effect == null){
      return;
    }
    if(_effect.duration){
      _effect.expiration = _effect.duration + Date.now();
    }
    // Re-adding the same effect just updates it
    let existing = null;
    for(let effect of stc.effects){
      if(effect.name === _effect.name && effect.source === _effect.source){
        existing = effect;
      }
    }
    if(existing){
      existing = _effect;
      return;
    }
    if(_effect.effectType === STATS.Effect.Types.Attribute){
      // Apply the attribute
      stc.changeAttributeModifier(_effect.attribute, _effect.modifier);
    }
    stc.effects.push(_effect);
  };
  stc.removeEffect = function(name, source){
    let effect = stc.getEffect(name, source);
    stc.effects = stc.effects.filter((ef) => !(ef.name === name && ef.source === source));
    if(effect.effectType === STATS.Effect.Types.Attribute){
      let inverseDelta = effect.modifier * -1;
      stc.changeAttributeModifier(effect.attribute, inverseDelta);
    }
    stc.resources[STATS.Resources.health].update();
    stc.resources[STATS.Resources.energy].update();
    stc.resources[STATS.Resources.magic].update();
  };
  stc.update = function(){
    stc.updateEffects();
  };
  stc.updateEffects = function(){
    for(let effect of stc.effects){
      if(effect.effectType === STATS.Effect.Types.Resource){
        stc.updateResourceEffect(effect);
      }
      if(effect.effectType === STATS.Effect.Types.Attribute){
        stc.updateAttributeEffect(effect);
      }
    }
  };
  stc.isBlockerPresent = function(effectName){
    for(let effect of stc.effects){
      if(effectName === effect.name){
        return true;
      }
    }
    return false;
  };
  stc.getActiveFoods = function(){
    let foodEffects = {};
    for(let effect of stc.effects){
      if(effect.source.includes(SETTINGS.foodPrefix)){
        // De-dupes by adding to object this way
        foodEffects[effect.source] = effect;
      }
    }
    let foods = [];
    let now = Date.now();
    for(let source of Object.keys(foodEffects)){
      let effect = foodEffects[source];
      let foodName = source.replace(SETTINGS.foodPrefix, "");
      let foodItem = ITEMS.getByName(foodName);
      let remainingTime = effect.expiration - now;
      let food = STATS.FoodStatus.new(foodName, foodItem.sprite, remainingTime);
      foods.push(food);
    }
    foods.sort((a, b) => {
            if(a.remaining < b.remaining){
                return -1;
            }
            if(a.remaining > b.remaining){
                return 1;
            }
            return 0;
    });
    return foods;
  }
  stc.updateResourceEffect = function(effect){
    // Effects apply their delta only after the interval passes
    if(effect.lastApplied == null){
      effect.lastApplied = Date.now();
      return;
    }
    let now = Date.now();
    if(effect.expiration != null && now > effect.expiration){
      stc.removeEffect(effect.name, effect.source);
    }

    let elapsed = now - effect.lastApplied;
    if(elapsed >= effect.interval){
      effect.lastApplied = Date.now();
      if(effect.blockedByEffect && stc.isBlockerPresent(effect.blockedByEffect)){
        // Effect is blocked. Do not apply changes.
        return;
      }
      stc.changeResource(effect.resource, effect.delta);

      return;
    }
  };
  stc.updateAttributeEffect = function(effect){
    if(effect.duration == null){
      return;
    }
    let now = Date.now();
    if(now > effect.expiration){
      stc.removeEffect(effect.name, effect.source);
    }
  };
  stc.fullRestore = function(){
    for(let resourceName of Object.keys(stc.resources)){
      stc.resources[resourceName].reset();
    }
  };
 
  stc.receiveAttack = function(attackData){
    let damage = attackData.damage;
    let armor = stc.getAttribute(STATS.Attributes.armorValue);
    if(armor == null){
      armor = 0;
    }
    // Damage is negative, so add to reduce it
    let damageDealt = damage + armor;
    if(damageDealt > -1){
      return 0;
    }
    let health = stc.getStat(STATS.Resources.health);
    health.change(damageDealt);
    return damageDealt;
  };
  return stc;
};

  resources[STATS.Resources.health] = STATS.Resource.new(

    STATS.Attributes.healthMax,  // defaultmax
    GRAPHICS.Colors.Red, // color
   GRAPHICS.Colors.Red50); // transparent color
  
  resources[STATS.Resources.energy] = STATS.Resource.new(
    STATS.Resources.energy, // name
    10,
    STATS.Attributes.energyMax,  // defaultmax
    GRAPHICS.Colors.Green, // color
   GRAPHICS.Colors.Green50); // transparent color
  
  resources[STATS.Resources.magic] = STATS.Resource.new(
    STATS.Resources.magic, // name
    0,

/*##############################################################################
# An inventory with slots, each containing stacks of items
##############################################################################*/
ITEMS.Inventory = {};
ITEMS.Inventory.new = function(size){
    let inv = {
        slots: [],
        size: size,
        activeSlot: 0,
    };
    for(let i = 0; i < size; i++){
        inv.slots.push(null);
    };
    inv.removeItem = function(item){
        for(let i = 0; i < inv.slots.length; i++){
            let slotItem = inv.slots[i];
            if(item == slotItem){
                inv.slots[i] = null;
            }
        }
    };
    inv.getActiveItem = function(){
        if(inv.activeSlot == -1){
            return null;
        }
        return inv.slots[inv.activeSlot];
    };
    inv.getItem = function(slot){
        if(slot > -1 && slot < inv.size){
            let item = inv.slots[slot];
            if(item){
                return item;
            }
        }
        return null;
    };
    inv.setItem = function(slot, item){
        if(slot > -1 && slot < inv.size){
            inv.slots[slot] = item;
        }
    };
    // Returns overflow quantity
    inv.pickUp = function(_item){
        let quantityLeft = _item.quantity;
        let item = _item.clone();
        if(item.stackSize > 0){
            quantityLeft = inv.stackItem(item);
        }
        if(quantityLeft == 0){
            return 0;
        }

        item = _item.clone();
        item.quantity = quantityLeft;

        for(let i = 0; i < inv.slots.length; i++){
            if(inv.slots[i] == null){
                inv.slots[i] = item;
                return 0
            }
        }
        
        return quantityLeft;
    };
    // Returns quantity overflow after adding item stacks to existing stacks
    inv.stackItem = function(_item){
        let quantityLeft = _item.quantity;
        for(let i = 0; i< inv.slots.length; i++){
            if(inv.slots[i] && _item.name == inv.slots[i].name){
                quantityLeft = inv.slots[i].stack(quantityLeft);
            }
            if(quantityLeft == 0){
                return 0;
            }
        }
        return quantityLeft;
    };
    inv.findEmptySlot = function(){
        for(let i = 0; i< inv.slots.length; i++){
            if(inv.slots[i] == null){
                return i;
            }
        }
        return -1;
    };
    inv.canSetItem = function(slot, item){
        return true;
    };
    inv.getAvailableSpaceForItem = function(item){
        if(inv.findEmptySlot() > -1){
            return item.stackSize;
        }
        let stacks = [];
        for(let i = 0; i< inv.slots.length; i++){
            if(inv.slots[i] && inv.slots[i].name === item.name && inv.slots[i].stackSpace() > 0){
                stacks.push(inv.slots[i]);
            }
        }
        if(stacks.length == 0){
            return 0;
        }
        let space = 0;
        for(let _item of stacks){
            space += _item.stackSize - _item.quantity;
        }
        return space;
    };
    inv.queryItemQuantity = function(itemName){
        let quantity = 0;
        for(let item of inv.slots){
            if(item && item.name === itemName){
                quantity += item.quantity;
            }
        }
        return quantity;
    };
    inv.removeItemQuantity = function(itemName, quantity){
        if(quantity == null){
            return 0;
        }
        let quantityLeft = quantity + 0;
        for(let i = 0; i < inv.slots.length; i++){
            if(quantityLeft < 1){
                return quantityLeft;
            }
            let item = inv.slots[i];
            if(item != null && itemName == item.name){
                if(quantityLeft < item.quantity){
                    item.quantity -= quantityLeft;   
                    return 0;
                }
                quantityLeft -= item.quantity;
                inv.slots[i] = null;
            }
        }
        return quantityLeft;
    };
    return inv;
};
/*##############################################################################
# Generates loot by RNG
##############################################################################*/

ITEMS.LootTable = {};
ITEMS.LootTable.new = function(){
    let lp = {
        items: [],
        chances: [],
        maximums: []
    };
    lp.addItem = function(item, chance, max){
        lp.items.push(item);
        lp.chances.push(chance);
        lp.maximums.push(max);
    };
    lp.getLoot = function(){
        let loot = [];
        for(let i = 0; i< lp.items.length; i++){
            let lootPool = lp.generateItemLoot(lp.items[i], lp.chances[i], lp.maximums[i]);
            loot.push(...lootPool);
        }
        return loot;
    };
    lp.generateItemLoot = function(item, chance, max){
        let loot = [];
        if(!RANDOM.chance(chance)){
            // You get nothing! You lose! Good day, sir!
            return loot;
        }

        let quantity = RANDOM.roll(max);

        // Add the quantity to the stack
        if(item.stackSize <= quantity){
            let _item = item.clone();
            _item.quantity = quantity;
            loot.push(_item);
            return loot;
        }

        // It won't stack, so just spam the items out.
        if(item.stackSize == 0){
            for(let j = 0; j < quantity; j++){
                loot.push(item.clone());    
            }
            return loot;
        }

        // Break it up into multiple stacks
        let itemsToDrop = Math.ceil(quantity/item.stackSize);
        let remainder = quantity % item.stackSize;
        for(let i = 0; i < itemsToDrop; i++){
            let _item = item.clone();
            _item.quantity = item.stackSize;
            // If it doesn't divide evenly, assign remainder
            // To last item stack
            if(i+1 == itemsToDrop && remainder != 0){
                _item.quantity = remainder;
            }
            loot.push(_item);
        }
        return loot;
    };
    return lp;
};

// inherits base entity
ACTOR.new = function(){
  let atr = ENTITY.baseEntity.new();

  atr.direction = DIRECTIONS.east;
  atr.prevDirection = DIRECTIONS.east;

  atr.activeAttack = null;
  atr.cooldown = true;
  atr.stats = null;
  atr.hotbar = ITEMS.Inventory.new(9);
  atr.inventory = ITEMS.Inventory.new(27);
  atr.paperdoll = ITEMS.EquipInventory.new(9, atr);
  atr.damageLabel = null;
  atr.damageLabelFrames = 0;
  atr.itemsDrawn = false;
  atr.lootTable = false;
  atr.update = function(){
    atr.stateMachine.update();
    atr.agent.update();
    if(atr.lockCamera && GRAPHICS.getDisplayMode() == DISPLAY_MODES.camera){
      GRAPHICS.centerCamera(VECTOR2.new(atr.position.x, atr.position.y));
    }
    if(atr.stats){
      atr.stats.update();
    }
  };
  atr.emitLight = function(radius){
    let rect = SHAPES.RECT.new(
      VECTOR2.new(0,0),
      VECTOR2.new(radius*2, radius*2)
    );
    let centeredPos = atr.centeredPosition();
    rect.recenter(centeredPos);
    let color = GRAPHICS.Colors.Yellow15;
    let light = GRAPHICS.LightSource.new(rect, radius, color);
    SCENE.emitLight(light);
  };
  atr.move = function(direction){
    // No moving while attacking
    if(!atr.cooldown){
      return;
    }
    atr.moving = true;
    let speed = atr.stats.getAttribute(STATS.Attributes.speed);
    let dest = VECTOR2.new(atr.position.x, atr.position.y);
    
    switch(direction){
      case DIRECTIONS.north:
        dest.y -= speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.south:
        dest.y += speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.east:
        dest.x += speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.west:
        dest.x -= speed;
        atr.direction = direction;
      break;
    }
    if(atr.collider.moveAndCollideShort(dest)){
      return;
    }
  };
  atr.destroyItem = function(item){
    atr.hotbar.removeItem(item);
    atr.inventory.removeItem(item);
  };
  atr.draw = function(){
    if(!GRAPHICS.isOnScreen(atr.getSpriteRect())){
      // Don't render when off screen
      return;
    }
    atr.animator.update(atr.position.x, atr.position.y);
    if(atr.label != ""){
      GRAPHICS.drawTextRelative(atr.label, atr.position.x, atr.position.y + atr.size + SETTINGS.defaultFontSize);
    }
    if(atr.damageLabel && atr.damageLabel != "" && atr.damageLabelFrames > 0){
      GRAPHICS.drawTextRelative(atr.damageLabel, atr.position.x, atr.position.y + SETTINGS.defaultFontSize, "red");
    }
    if(atr.damageLabelFrames > 0){
      atr.damageLabelFrames -= 1;
    }
    if(atr.stats == null){
      return;
    }
    let lightRadius = atr.stats.getAttribute(STATS.Attributes.lightRadius);
    if(lightRadius > 0){
      atr.emitLight(lightRadius);
    }
  };
  atr.toggleItemsDrawn = function(){
    if(atr.itemsDrawn){
      atr.itemsDrawn = false;
      UTILITY.notification("Items are now stashed");
    }
    else{
      let handItem = atr.paperdoll.slots[GEAR.slotIndices.hand];
      let offHandItem = atr.paperdoll.slots[GEAR.slotIndices.offHand];
      // Only draw your items if you have items to draw    
      if(handItem || offHandItem){
        atr.itemsDrawn = true;
        UTILITY.notification("Items are now drawn");  
      }
      
    }
  };
  // Left click
  atr.primaryAction = function(){
    let inRange = atr.cursorInRange();
    if(atr.itemsDrawn){
      atr.useHandItem();
    }
    else{
      // Melee Attack
      atr.attack(atr.activeAttack);
    }
  };
  // Right click
  atr.secondaryAction = function(){
    let inRange = atr.cursorInRange();
    if(atr.itemsDrawn){
      atr.useOffhandItem();
    }
    else if(inRange){
        let point = INPUT.getMousePosition();
        point.x = GRAPHICS.downScale(point.x);
        point.y = GRAPHICS.downScale(point.y);
        let worldPoint = GRAPHICS.getWorldPoint(point);
        atr.interactAtPoint(worldPoint);
    }
  };
  atr.useHandItem = function(){
    let handItem = atr.paperdoll.slots[GEAR.slotIndices.hand];
    if(handItem){
      handItem.primaryUse(handItem, atr);
    }
  };
  atr.useOffhandItem = function(){
    let handItem = atr.paperdoll.slots[GEAR.slotIndices.hand];
    let offHandItem = atr.paperdoll.slots[GEAR.slotIndices.offHand];
    if(handItem == null && offHandItem == null){
      return; // Nothing to do
    }
    if(offHandItem == null){
      handItem.secondaryUse(handItem, atr);
    }
    else{
      offHandItem.primaryUse(offHandItem, atr);
    }
  };
  atr.attack = function(attack){
    if(!atr.cooldown){
      return;
    }
    let atk = attack;

    // Execute immediately
    atr.cooldown = false;
    atr.stateMachine.startAttack(atk);

    // Execute attack hitscans at specific timing.
    for(let damageFrame of atk.damageFrames){
      if(damageFrame == 0){
        // Deal damage now
        atr.attackHitscan(atk);
      }
      else{
        // Deal damage later
        UTILITY.delayExecute(damageFrame, () => {
          atr.attackHitscan(atk);
        });
      }
    }
    
    // Execute at end of attack
    UTILITY.delayExecute(atk.frames, () => {
      atr.cooldown = true;
    });
    
  };
  atr.canSprint = function(){
    if(atr.stats == null){
      // No stats, no problems!
      return true;
    }
    if(atr.stats.getEffect(STATS.Effect.Names.Sprinting, STATS.Effect.Sources.Body)){
      // You're already sprinting.
      return false;
    }
    let energy = atr.stats.getResourceValue(STATS.Resources.energy);
    if(energy > 0){
      // You can afford to sprint
      return true;
    }
    // You can't afford it
    return false;
  };
  // Call this each frame before moving
  atr.sprint = function(){
    if(!atr.canSprint()){
      return;
    }
    let cost = STATS.Effect.SprintCost();
    let buff = STATS.Effect.SprintBuff();
    atr.stats.addEffect(cost);
    atr.stats.addEffect(buff);
  };
  atr.attackHitscan = function(atk){

    let dest = atr.centeredPosition().move(atr.direction, atr.size);
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(atr.size, atr.size));
    rect.recenter(dest);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    let attackData = STATS.AttackData.new(atr.direction, atk.getDamage(), atr, { knockback: 10 });
    for(let cl of colliders){
      cl.parent.onAttacked(attackData);
    }
  };
  atr.interact = function(){
    let dest = atr.centeredPosition().move(atr.direction, atr.size);
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(atr.size, atr.size));
    rect.recenter(dest);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    for(let cl of colliders){
      cl.parent.onInteract(UTILITY.Interaction.new(atr));
    }
  };
  atr.interactAtPoint = function(point){
    let halfSize = atr.size/2;
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(halfSize, halfSize));
    rect.recenter(point);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    for(let cl of colliders){
      cl.parent.onInteract(UTILITY.Interaction.new(atr));
    }
  };
  atr.onCollide = function(collision){};
  atr.onAttacked = function(attackData){
    if(atr.stats == null){
      return;
    }

    if(atr.stats.damageCooldown == null || atr.stats.damageCooldown < Date.now()){
      atr.stats.damageCooldown = Date.now() + SETTINGS.damageCooldown;
    }
    else{
      //console.log("Ignoring attack until cooldown finishes");
      return;
    }
    let damageDealt = atr.stats.receiveAttack(attackData);
    
    atr.damageLabel = UTILITY.formatDamage(damageDealt);
    atr.damageLabelFrames = 12;

    let health = atr.stats.getStat(STATS.Resources.health);
    if(health.value < 1){
      atr.die();
    }
    if(attackData.knockback > 0){
      //console.log("Being knocked back in direction" + attackData.direction);
      atr.onKnockback(attackData.direction, attackData.knockback);
    }
  };
  atr.onInteract = function(interaction){};
  atr.cursorInRange = function(){
    let pos = GRAPHICS.getWorldCursor();
    let actorPos = atr.centeredPosition();
    let distance = pos.distance(actorPos);
    return distance < SETTINGS.interactionRange;
  };
  atr.pickUp = function(_item){
    let quantityLeft = _item.quantity;
    let item = _item.clone();
    //console.log("stashing " + item.quantity + " into hotbar");
    quantityLeft = atr.hotbar.pickUp(item);

    if(quantityLeft > 0){
      item = _item.clone();
      item.quantity = quantityLeft;
      quantityLeft = atr.inventory.pickUp(item);

    }
    return quantityLeft;
  };
  atr.useItem = function(){
    let item = atr.hotbar.getActiveItem();
    if(item == null){
      return;
    }
    item.use(atr);
  };
  atr.eat = function(item){

  atr.canCraft = function(recipe){

      }

    let product = ITEMS.getByName(recipe.product.itemName);

  atr.craft = function(recipe){

      return;
    }
    for(let ingredient of recipe.ingredients){
      atr.removeItemQuantity(ingredient.itemName, ingredient.quantity);
    }
    let product = ITEMS.getByName(recipe.product.itemName);
    product.quantity = recipe.product.quantity;
    atr.pickUp(product);
    let text = "Crafted " + product.name;
    if(product.quantity > 1){

  atr.queryItemQuantity = function(itemName){

  atr.removeItemQuantity = function(itemName, quantity){

  };
  atr.die = function(){

    if(atr.lootTable){

      for(let item of loot){
        atr.dropItem(item);
      }
    }
    SCENE.destroyEntity(atr);
  };
  atr.dropItem = function(item){
    // Create an item stack within short range of body
    console.log("Dropping item "+ item.toString());

    let itemStack = ENTITY.ItemStack.new(item);
    let position = atr.position.clone();
    let drift = 32;
    position.x += UTILITY.randRange(-drift, drift);
    position.y += UTILITY.randRange(-drift, drift);
    itemStack.position = position;
    SCENE.createEntity(itemStack);
  };
  return atr;
};
