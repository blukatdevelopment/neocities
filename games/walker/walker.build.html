ACTOR.AnimationStateMachine = {};
ACTOR.AnimationStateMachine.new = function(name, animations, animator){
  let asm = {
    entityId: -1,
    name: name,
    currentAnimation: null,
    animations: animations,
    animator: animator,
    moving: false,
    direction: DIRECTIONS.north,
    attack: null
  };

  asm.linkToActor = function(actor){
    asm.actor = actor;
  };

  asm.getNextAnimationName = function(){
    let nextAnimation = null;
    if(asm.attack){
      let atk = asm.attack;
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = atk.upAnimation;
          break;
        case DIRECTIONS.south:
          nextAnimation = atk.downAnimation;
          break;
        case DIRECTIONS.east:
          nextAnimation = atk.rightAnimation;
          break;
        case DIRECTIONS.west:
          nextAnimation = atk.leftAnimation;
          break;
      }
    }
    else if(asm.actor.moving){
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = ACTOR_ANIMATIONS.walkUp;
          break;
        case DIRECTIONS.south:
          nextAnimation = ACTOR_ANIMATIONS.walkDown;
          break;
        case DIRECTIONS.east:
          nextAnimation = ACTOR_ANIMATIONS.walkRight;
          break;
        case DIRECTIONS.west:
          nextAnimation = ACTOR_ANIMATIONS.walkLeft;
          break;
      }
    }
    else{
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = ACTOR_ANIMATIONS.idleUp;
          break;
        case DIRECTIONS.south:
          nextAnimation = ACTOR_ANIMATIONS.idleDown;
          break;
        case DIRECTIONS.east:
          nextAnimation = ACTOR_ANIMATIONS.idleRight;
          break;
        case DIRECTIONS.west:
          nextAnimation = ACTOR_ANIMATIONS.idleLeft;
          break;
      }
    }
    return nextAnimation;
  };

  asm.update = function(){
    let nextAnimation = asm.getNextAnimationName();
    if(nextAnimation && asm.animations[nextAnimation]){
      asm.animator.setAnimation(asm.animations[nextAnimation]);
    }
    else{
      let obj = {
        nextAnimation: nextAnimation,
        ref: asm.animations[nextAnimation]
      };
      UTILITY.log("ACTOR" + "nextanimation invalid" + JSON.stringify(obj));
    }
  };

  asm.startAttack = function(attack, frames){
    asm.attack = attack;
    UTILITY.delayExecute(attack.frames, () => { asm.attack = null; });
  };
  return asm;
};
SHAPES.RECT = {};
SHAPES.RECT.new = function(position, size){
    let rect = {
        position: position, // Top left corner
        size: size
    };
    rect.center = function(){
        return VECTOR2.new(
            rect.position.x + rect.size.x/2,
            rect.position.y + rect.size.y/2
        );
    };
    rect.extents = function(){
        return VECTOR2.new(
            rect.position.x+rect.size.x,
            rect.position.y+rect.size.y
        );
    };
    rect.topRight = function(){
        return VECTOR2.new(
            rect.position.x+rect.size.x,
            rect.position.y
        );
    };
    rect.topLeft = function(){
        return rect.position;
    };
    rect.bottomRight = function(){
        return rect.extents();
    };
    rect.bottomLeft = function(){
        return VECTOR2.new(
            rect.position.x,
            rect.position.y+rect.size.y
        );
    };
    rect.rightEdge = function(){
        return SHAPES.Line.new(rect.topRight(), rect.bottomRight());
    };
    rect.leftEdge = function(){
        return SHAPES.Line.new(rect.topLeft(), rect.bottomLeft());
    };
    rect.topEdge = function(){
        return SHAPES.Line.new(rect.topLeft(), rect.topRight());
    };
    rect.bottomEdge = function(){
        return SHAPES.Line.new(rect.bottomLeft(), rect.bottomRight());
    };
    rect.getEdges = function(){
        let edges = [];
        edges.push(rect.rightEdge());
        edges.push(rect.leftEdge());
        edges.push(rect.topEdge());
        edges.push(rect.bottomEdge());
        return edges;
    };
    // Returns polygonal points
    rect.getPoints = function(){
        let points = [
            rect.topLeft(),
            rect.topRight(),
            rect.bottomLeft(),
            rect.bottomRight()
        ];
        return points;
    };
    rect.contains = function(point){
        let tl = rect.topLeft();
        let br = rect.bottomRight();
        if(point.x >= tl.x && point.x <= br.x){
            if(point.y >= tl.y  && point.y <= br.y){
                return true;
            }
        }
        return false;
    };
    rect.isInside = function(otherRect){
        return otherRect.contains(rect.topLeft()) &&
            otherRect.contains(rect.topRight()) &&
            otherRect.contains(rect.bottomLeft()) &&
            otherRect.contains(rect.bottomRight());
    };
    rect.overlaps = function(otherRect){
        let tl1 = rect.topLeft();
        let br1 = rect.bottomRight();
        let tl2 = otherRect.topLeft();
        let br2 = otherRect.bottomRight();

        let above = tl1.y > br2.y;
        let below = tl2.y > br1.y;
        let toRight = tl1.x > br2.x;
        let toLeft = tl2.x > br1.x;
        if(above || below || toRight || toLeft){
            return false;
        }
        return true;
    };
    rect.recenter = function(point){
        let halfSize = VECTOR2.new(rect.size.x/2, rect.size.y/2);
        rect.position = VECTOR2.new(point.x-halfSize.x, point.y-halfSize.y);
    };
    rect.toString = function(){
        let ret = "Rect[";
        ret += rect.position.toString();
        ret += ", " + rect.size.toString();
        ret += "]";
        return ret;
    };
    rect.clone = function(){
        return SHAPES.RECT.new(rect.position.clone(), rect.size.clone());
    };

    return rect;
};
// Assuming only box colliders will exist.
PHYSICS.BoxCollider = {};
PHYSICS.BoxCollider.new = function(){
    let bc = {
        parent: null,
        rigid: true,
        // rect is relative to parent entity
        rect: SHAPES.RECT.new(VECTOR2.new(0, 0), VECTOR2.new(0, 0)),
        controller: null
    };
    // Account for parent position
    bc.absoluteRect = function(){
        let pos = bc.rect.position;
        if(bc.parent){
            let ppos = bc.parent.getPosition();
            pos = VECTOR2.new(ppos.x+pos.x, ppos.y+pos.y);
        }
        let size = bc.rect.size;
        let rect = SHAPES.RECT.new(pos, size);
        return rect;
    };
    bc.contains = function(point){
        let rect = bc.absoluteRect();
        return rect.contains(point);
    };
    bc.isInside = function(otherRect){
        let rect = bc.absoluteRect();
        return rect.isInside(otherRect);
    };
    // Assumes another box collider
    bc.overlaps = function(otherCollider){
        let rect = bc.absoluteRect();
        let otherRect = otherCollider.absoluteRect();
        return otherRect.overlaps(rect);    
    };
    // Check if collider would remain within the level if moved
    bc.boundsCheck = function(destination){
        let levelRect = SCENE.getLevelRect();
        if(levelRect == null){
            return true;
        }
        let rect = bc.absoluteRect();
        rect.position = destination;
        return rect.isInside(levelRect);
    };
    // Makes one check, assuming distance is less than scale
    bc.moveAndCollideShort = function(destination, suppressCollisionEvents){
        if(bc.controller == null || bc.parent == null){
            UTILITY.log("BoxCollider.moveAndCollide()", "BoxCollider not assigned to physics controller.", { controller: bc.controller == null, parent: bc.parent == null});
            return null;
        }
        if(!bc.boundsCheck(destination)){
            // Don't move out of bounds.
            return null;
        }
        let previous = bc.parent.getPosition();
        bc.parent.setPosition(VECTOR2.new(destination.x, destination.y));
        let excludeList = [];
        excludeList.push(bc.parent.getEntityId());
        let ret = bc.controller.checkForCollision(excludeList, bc);
        if(suppressCollisionEvents){
            return ret;
        }
        if(ret){
            if(ret.second.rigid){
                //revert upon collision with rigid collider
                bc.parent.setPosition(previous);
                
            }
            // Emit collision events
            bc.parent.onCollide(ret);
            if(ret.second && ret.second.parent){
                ret.second.parent.onCollide(ret);
            }
            return ret;
        }
        return null;
    };
    bc.resize = function(updatedSize){
        bc.rect.size = updatedSize.clone();
    };
    bc.reposition = function(updatedPosition){
        bc.rect.position = updatedPosition.clone();
    };
    bc.toString = function(){
        let parent = "null";
        if(bc.parent){
            parent = bc.parent.getName();
        }
        let ret = "BoxCollider[Parent: " + parent;
        ret += ", " + bc.absoluteRect().toString() + "]";
        return ret;
    };
    return bc;
};
PHYSICS.Collision = {};
PHYSICS.Collision.new = function(first, second){
    let col = {
        first: first, // Collider initiating collision
        second: second // Collider
    };
    col.toString = function(){

PHYSICS.Controller = {};
PHYSICS.Controller.new = function(){
    let ctl = {
        colliders: [],
        rigidColliders: [],
        collisionGrid: null
    };
    ctl.registerCollider = function(collider){
        ctl.colliders.push(collider);
        collider.controller = ctl;
    };
    ctl.unregisterCollider = function(collider){
        ctl.colliders = ctl.colliders.filter((cl) => cl !== collider);
    };
    ctl.checkForCollision = function(excludeList, collider){
        // Used by BoxCollider.moveAndCollideShort()
        let colliders = ctl.getLocalColliders(collider.absoluteRect().position);
        for(let cl of colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                if(cl.parent.getEntityId() == 1){
                    let str = cl.toString() + ", " + collider.toString() + ", " + collider.overlaps(cl);
                };
                if(collider.overlaps(cl)){
                    let col = PHYSICS.Collision.new(collider, cl);
                    return col;
                }
            }         
        }
        return null;
    };
    ctl.getLocalColliders = function(point){
        if(ctl.collisionGrid){
            return ctl.collisionGrid.getLocalColliders(point);
        }
        return ctl.rigidColliders;
    };
    ctl.getCollidersByPoint = function(excludeList, point){
        let cols = [];
        for(let cl of ctl.colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                if(cl.contains(point)){
                    cols.push(cl);
                }
            }
        }
        return cols;
    };
    ctl.rectHitScan = function(excludeList, rect){
        let cols = [];
        for(let cl of ctl.colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                let otherRect = cl.absoluteRect();
                if(otherRect.overlaps(rect)){
                    cols.push(cl);
                }
                else{
                    //console.log(rect.toString() + " does not overlap " + cl.parent.name + " " + otherRect.toString());
                }
            }
        }
        return cols;
    };
    // Call this each frame before collision checks are made
    ctl.update = function(){
        ctl.refreshRigidCollidersList();
        ctl.refreshCollisionGrid();
    };
    ctl.refreshRigidCollidersList = function(){
        ctl.rigidColliders = [];
        for(let collider of ctl.colliders){
            if(collider.rigid){
                ctl.rigidColliders.push(collider);
            }
        }
    };
    ctl.refreshCollisionGrid = function(){
        let size = Math.ceil((SETTINGS.DefaultLevelTileSize * SETTINGS.DefaultLevelSize) / PHYSICS.CollisionCellSize);
        ctl.collisionGrid = PHYSICS.CellGrid.new(ctl.rigidColliders, size);
    };
    return ctl;
};
var VECTOR2 = {};
VECTOR2.new = function(x, y){
    let v2 = {
        x: x,
        y: y
    };
    v2.equals = function(other){
        return v2.x == other.x && v2.y == other.y;
    };
    v2.distance = function(point){
        var a = v2.x - point.x;
        var b = v2.y - point.y;

        return Math.sqrt( a*a + b*b );
    }
    v2.add = function(otherVector){
        return VECTOR2.new(v2.x + otherVector.x, v2.y + otherVector.y);
    };
    v2.subtract = function(otherVector){
        return VECTOR2.new(v2.x - otherVector.x, v2.y - otherVector.y);
    };
    v2.multiply = function(otherVector){
        return VECTOR2.new(v2.x * otherVector.x, v2.y * otherVector.y);
    }
    v2.toString = function(){
        return "{" + v2.x + ", " + v2.y + "}";
    };
    v2.move = function(direction, magnitude){
        let ret = VECTOR2.new(v2.x, v2.y);
        switch(direction){
          case DIRECTIONS.north:
            ret.y -= magnitude;
          break;
          case DIRECTIONS.south:
            ret.y += magnitude;
          break;
          case DIRECTIONS.east:
            ret.x += magnitude;
          break;
          case DIRECTIONS.west:
            ret.x -= magnitude;
          break;
        }
        return ret;
    };
    v2.clone = function(){
        return VECTOR2.new(v2.x, v2.y);
    };
    v2.toJs = function(){
        return "VECTOR2.new(" + v2.x + "," + v2.y + ")";
    };
    return v2;
};
VECTOR2.vectorFromDirection = function(direction){
    switch(direction){
        case DIRECTIONS.none:
            return VECTOR2.new(0, 0);
        break;
        case DIRECTIONS.north:
            return VECTOR2.north();
        break;
        case DIRECTIONS.south:
            return VECTOR2.south();
        break;
        case DIRECTIONS.east:
            return VECTOR2.east();
        break;
        case DIRECTIONS.west:
            return VECTOR2.west();
        break;
    }
};

UTILITY.isInsideBox = function(topLeft, bottomRight, point){
  var inX = point.x < bottomRight.x && point.x > topLeft.x;
  var inY = point.y < bottomRight.y && point.y > topLeft.y;
  return inX && inY;
};
SHAPES.Line = {};
SHAPES.Line.new = function(origin, terminus){
    let line = {
        origin: origin,
        terminus: terminus
    };
    line.intersection = function(other){
        let x1 = line.origin.x;
        let y1 = line.origin.y;
        let x2 = line.terminus.x;
        let y2 = line.terminus.y;
        let x3 = other.origin.x;
        let y3 = other.origin.y;
        let x4 = other.terminus.x;
        let y4 = other.terminus.y;

        let denominator = ((y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1));

        // If denominator is 0, the lines are parallel or collinear
    if (denominator === 0) {
        return null;
    }

    let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denominator;
    let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denominator;

    // Is the intersection point along both segments?
    if (ua < 0 || ua > 1 || ub < 0 || ub > 1) {
        return null;
    }

    // Calculate the absolute x and y coordinates of the intersection
    let x = x1 + ua * (x2 - x1);
    let y = y1 + ua * (y2 - y1);

    return VECTOR2.new(x, y);
    };
    return line;
};
// Divide the map up into cells for faster collision scans
PHYSICS.CellGrid = {};
PHYSICS.CollisionCellSize = 400;
PHYSICS.CellGrid.new = function(colliders, size){
    let grid = {
        size: size,
        cells: []
    };

    grid.init = function(){
        for(let i = 0; i< size*size; i++){
            grid.cells.push([]);
        }
        for(let collider of colliders){
            let cellIndex = grid.posToCellIndex(collider.absoluteRect().position);
            if(grid.cells[cellIndex] != null){
                grid.cells[cellIndex].push(collider);
            }
        }
    };
    grid.posToCellIndex = function(position){
        let cellSize = PHYSICS.CollisionCellSize;
        let gridX = Math.floor(position.x / cellSize);
        let gridY = Math.floor(position.y / cellSize);
        return gridX + (grid.size * gridY)
    };
    grid.getLocalColliders = function(point){
        let index = grid.posToCellIndex(point);
        return grid.cells[index];
    };
    grid.init();
    return grid;
};

AGENT.PLAYER_ONE = {};
AGENT.PLAYER_ONE.new = function(actor){
    var pone = {
        actor: actor,
        keyPresses: {}
    };
    for(let i in KEY_PRESSES_USED){
        let key = KEY_PRESSES_USED[i];
        pone.keyPresses[key] = false;
    }

    pone.update = function (){
        // TODO: move code currently in GAME.mouseDown here to break tight coupling
        let atr = pone.actor;
        let aId = atr.entityId;
        if(INPUT.key(INPUT.KEYS.K_LEFT_SHIFT)){
            atr.sprint();
        }
        let x_movement = 0;
        let y_movement = 0;
        let k_w = INPUT.key(INPUT.KEYS.K_W) ? 1 : 0;
        let k_s = INPUT.key(INPUT.KEYS.K_S) ? 1 : 0;
        let k_a = INPUT.key(INPUT.KEYS.K_A) ? 1 : 0;
        let k_d = INPUT.key(INPUT.KEYS.K_D) ? 1 : 0;

        // Net inputs
        let x = k_d - k_a;
        let z = k_w - k_s; // Invert

        if(x == 0 && z == 0){
            if(atr.moving){
                atr.moving = false; 
            }
        }
        else{
            if(x < 0){
                atr.move(DIRECTIONS.west);
            }
            else if(x > 0){
                atr.move(DIRECTIONS.east);
            }
            if(z < 0){
                atr.move(DIRECTIONS.south);
            }
            else if(z > 0){
                atr.move(DIRECTIONS.north);
            }
        }
        if(INPUT.keyPress(INPUT.KEYS.K_M)){
            SCENE.setActiveScene(SCENE.SCENES.WorldMap());
        }
        if(INPUT.keyPress(INPUT.KEYS.K_SPACE) || INPUT.mouseClick(INPUT.LEFT_MOUSE)){
            atr.primaryAction();         
        }
        if(INPUT.keyPress(INPUT.KEYS.K_E)){
            atr.interact();
        }
        if(INPUT.keyPress(INPUT.KEYS.K_F)){
            atr.useItem();
        }
        if(INPUT.keyPress(INPUT.KEYS.K_R)){
            atr.toggleItemsDrawn();
        }
        if(INPUT.mouseClick(INPUT.RIGHT_MOUSE)){
            atr.secondaryAction();            
        }

  let config = UTILITY.getActorConfig("slime");
  let se = ACTOR.new();
  se.entityType = ENTITY.TYPES.NPC;
  let anm = SPRITES.Animator.new();
  anm.animation = SPRITES.animations[config.name][ACTOR_ANIMATIONS.idleLeft]
  let asm = ACTOR.AnimationStateMachine.new(name, SPRITES.animations[config.name], anm);
  asm.linkToActor(se);
  se.stateMachine = asm;
  let agent = AGENT.SIMPLE_ENEMY.new(se);
  se.agent = agent;
  se.animator = anm;
  se.lockCamera = false;

  se.setCollider(PHYSICS.BoxCollider.new());
  se.getCollider().rect.position = VECTOR2.new(13, 0);
  se.getCollider().rect.size = VECTOR2.new(11, 32);
  se.name = ACTOR.Names.Slime;
  se.label = se.name;

  se.attacks.push(STATS.AttackFactory.Unarmed());
  se.activeAttack = se.attacks[0];

  // Deal damage and knock target away
  se.onCollide = function(collision){
    let target = collision.second.parent == se ? collision.first.parent : collision.second.parent;
    if(target == se){
      return;
    }
    let pos = se.centeredPosition();
    let targetPos = target.centeredPosition();
    let dir = pos.x < targetPos.x ? DIRECTIONS.east : DIRECTIONS.west;
    let attackData = STATS.AttackData.new(dir, -se.activeAttack.damage, se, { knockback: 10 });
    target.onAttacked(attackData);
  };

  se.stats = STATS.StatsController.new();
  se.stats.setAttributeValue(STATS.Attributes.healthMax, 3);
  se.stats.setAttributeValue(STATS.Attributes.speed, 1.5);

  let lootTable = ITEMS.LootTable.new();
  lootTable.addItem(ITEMS.getByName(ITEMS.Names.Apple), 2, 1);
  lootTable.addItem(ITEMS.getByName(ITEMS.Names.RedBerry), 1, 3);
  lootTable.addItem(ITEMS.getByName(ITEMS.Names.BlueBerry), 2, 3);
  lootTable.addItem(ITEMS.getByName(ITEMS.Names.GreenBerry), 3, 50);
  se.lootTable = lootTable;
  return se;
};

    let r = {
        name: name,
        ingredients: ingredients,
        product: product
    };
    r.toString = function(){
        let text = "Recipe:";
        for(let i = 0; i< r.ingredients.length; i++){

            if(i != r.ingredients.length-1){

        }
        text += "=" + product.toString();

};

/*##############################################################################
# Base Item object
##############################################################################*/
ITEMS.BaseItem = {};
ITEMS.BaseItem.new = function(){
    let item = {
        type: ITEMS.Types.Base,
        name: "",
        description: "",
        sprite: null,
        quantity: 0,
        stackSize: 0, // Leave 0 to disable stacking
        durability: 0,
        durabilityMax: 0, // Leave 0 for infinite durability
        inventory: null // The inventory this item is inside
    };
    // quantity left in this stack
    item.stackSpace = function(){
        if(item.stackSize == 0 || item.quantity == item.stackSize){
            return 0;
        }
        else{
            return item.stackSize - item.quantity;
        }
    };
    item.stack = function(quantity){
        let space = item.stackSize - item.quantity;
        let quantityStored = space;
        if(space > quantity){
            quantityStored = quantity;
        }
        let overflow = quantity - quantityStored;
        console.log("Storing " + quantityStored + ", overflow " + overflow);
        item.quantity += quantityStored;
        return overflow;
    };
    item.use = function(){};
    item.clone = function(){
        let clone = ITEMS.BaseItem.new();
        clone.name = item.name;
        clone.sprite = item.sprite;
        clone.quantity = item.quantity;
        clone.stackSize = item.stackSize;
        clone.durability = item.durability;
        clone.description = item.description;
        clone.durabilityMax = item.durabilityMax;
        return clone;
    };
    item.toString = function(){
        let ret = item.name;
        if(item.stackSize > 0){
            ret += "(" + item.quantity + "/" + item.stackSize + ")";
        }
        else{
            ret += "(" + item.quantity + ")"
        }
        return ret;
    };
    return item;
};

ITEMS.loadBaseItem = function(config){
    let item = ITEMS.BaseItem.new();
    item.name = config.name;
    item.description = config.description;
    item.sprite = config.sprite;
    if(Object.hasOwn(config, "stackSize") && config.stackSize > 0){
        item.quantity = 1;
        item.stackSize = config.stackSize;
    }
    if(Object.hasOwn(config, "durabilityMax") && config.durability > 0){
        item.durability = config.durabilityMax;
        item.durability = config.durabilityMax;
    }
    return item;
};

        actor.attack(gear.attacks[0]);
    }
};

    if(gear.attacks && gear.attacks.length > 1){
        actor.attack(gear.attacks[1]);
    }
};

ITEMS.loadGear = function(config){
    let item = ITEMS.Gear.new();
    item.name = config.name;
    item.description = config.description;
    item.sprite = config.sprite;
    item.quantity = 1;
    for(let property of ITEMS.Gear.Properties){
        UTILITY.copyProperty(config, item, property);
    }

    if(Object.hasOwn(config, "gearType") && config.gearType != null){
        if(config.gearType == ITEMS.Gear.Types.Weapon){
            ITEMS.Gear.loadWeapon(config, item);
        }
    }
    return item;
};

    if(item.attacks.length > 0){
        // Default to primary attack
        item.primaryUse = ITEMS.Gear.Uses.PrimaryAttack;
    }

    if(item.attacks.length > 1){
        // Default to a secondary attack
        item.secondaryUse = ITEMS.Gear.Uses.SecondaryAttack;
    }

};

    f.type = ITEMS.Types.Food;

    f.use = function(actor){
        if(!actor.canEat(f)){

        actor.eat(f);
        f.quantity--;
        if(f.quantity < 1){
            actor.destroyItem(f);

        clone.durability = f.durability;
        clone.durabilityMax = f.durabilityMax;
        clone.effects = f.effects;
        return clone;
    };
    return f;
};

        }

    };

# Handles most input for level editor
##############################################################################*/
LEVEL.Editor.EditorInputController = {};
LEVEL.Editor.EditorInputController.new = function(parent){
    let ic = {
        parent: parent,
        mouseDragOrigin: null,
        camDragOrigin: null
    };
    ic.update = function(){
        ic.handleSelectEntity();
        ic.handleDragEntity();
        ic.handleDragCamera();
        ic.handleCameraControls();
        if(INPUT.keyPress(INPUT.KEYS.K_P)){
            ic.parent.export();
        }
        if(INPUT.keyPress(INPUT.KEYS.K_SPACE) && ic.parent.selected){
            SCENE.destroyEntity(ic.parent.selected);
            ic.parent.selected = null;
        }
    };
    ic.handleSelectEntity = function(){
        if(ic.parent.ui.isHovered()){
            return;
        }
        let worldPoint = GRAPHICS.getWorldCursor();
        //ic.parent.tooltip = worldPoint.toString();
        if(!INPUT.mouseClick(INPUT.LEFT_MOUSE)){
            return;
        }
        let size = 10;
        let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(size, size));
        rect.recenter(worldPoint);
        //console.log(rect.toString());
        let colliders = ic.parent.physics.rectHitScan([], rect);
        if(colliders.length > 0){
            ic.parent.selected = colliders[0].parent;
        }
        else{
            ic.parent.selected = null;
        }
    };
    ic.handleDragEntity = function(){
        if(!INPUT.isMouseDragging(INPUT.LEFT_MOUSE)){
            return;
        }
        if(ic.parent.ui.isHovered()){
            return;
        }
        if(ic.parent.selected == null){
            return;
        }
        let mPos = GRAPHICS.getWorldCursor();
        ic.parent.selected.recenter(mPos);
    };
    ic.handleDragCamera = function(){
        if(!INPUT.isMouseDragging(INPUT.RIGHT_MOUSE)){
            ic.camDragOrigin = null;
            ic.mouseDragOrigin = null;
            return;
        }
        if(ic.parent.ui.isHovered()){
            return;
        }
        if(ic.camDragOrigin == null){
            ic.camDragOrigin = GRAPHICS.getCameraCenter();
            ic.mouseDragOrigin = INPUT.getMousePosition();
            return;
        }
        let old = ic.mouseDragOrigin;
        let current = INPUT.getMousePosition();
        let mouseDelta = old.subtract(current);
        
        let oldCamPos = ic.camDragOrigin;
        let updated = oldCamPos.add(mouseDelta);
        GRAPHICS.centerCamera(updated);
    }
    ic.handleCameraControls = function(){
        let vector = VECTOR2.new(0,0);
        let speed = 5;
        if(INPUT.key(INPUT.KEYS.K_LEFT_SHIFT)){
            speed *= 3;
        }
        // Prioritize keyboard keys
        if(INPUT.key(INPUT.KEYS.K_W)){
            vector.y -= speed;
        }
        else if(INPUT.key(INPUT.KEYS.K_S)){
            vector.y += speed;
        }
        if(INPUT.key(INPUT.KEYS.K_A)){
            vector.x -= speed;
        }
        else if(INPUT.key(INPUT.KEYS.K_D)){
            vector.x += speed;
        }
        if(vector.x != 0 || vector.y != 0){
            GRAPHICS.panCamera(vector);
            return;
        }
        // pan with mouse only if not panning with keyboard
        let mPos = INPUT.getMousePosition();
        let margin = 20;
        if(mPos.x < margin){
            vector.x -= speed;
        }
        else if(mPos.x > SETTINGS.canvasMax - margin){
            vector.x += speed;
        }
        if(mPos.y < margin){
            vector.y -= speed;
        }
        else if(mPos.y > SETTINGS.canvasMax - margin){
            vector.y += speed;
        }
        if(vector.x != 0 || vector.y != 0){
            GRAPHICS.panCamera(vector);
        }
    };
    return ic;
};

UI.COMPONENTS.SpriteButton = {};
UI.COMPONENTS.SpriteButton.new = function(rect, sprite, onClick, toolTip){
    let btn = {
        rect: rect,
        sprite: sprite,
        onClick: onClick,
        toolTip: toolTip
    };
    btn.update = function(){
        if(!INPUT.mouseClick(INPUT.LEFT_MOUSE)){
            return;
        }
        
        if(btn.isHovered() && btn.onClick != null){
            btn.onClick();
        }
    };

        return btn.rect.contains(mPos);
    };
    btn.draw = function(){
        let pos = btn.rect.position;
        let size = btn.rect.size
        let color = GRAPHICS.Colors.Beige
        if(btn.isHovered()){
            color = GRAPHICS.Colors.LightBrown;
        }
        // Draw background
        GRAPHICS.fillBox(
            pos.x, pos.y,
            size.x, size.y,
            color
        );

        // Draw outer border
        let offset = 0;
        color = GRAPHICS.Colors.DarkBrown;
        GRAPHICS.drawBox(
            pos.x+offset, pos.y+offset,
            size.x-offset, size.y-offset,
            color
        );
        // Draw inner border
        offset = 1;
        color = GRAPHICS.Colors.LightBrown;
        GRAPHICS.drawBox(
            pos.x+offset, pos.y+offset,
            size.x-offset, size.y-offset,
            color
        );
        if(btn.isHovered() && btn.toolTip != null){
            GRAPHICS.drawTooltip(btn.toolTip);
        }
        if(btn.sprite == null){
            return;
        }
        SPRITES.renderSprite(pos.x, pos.y, btn.sprite.index, btn.sprite.sheet, DISPLAY_MODES.static);
    };

/*##############################################################################
# Select from a list of string labels that you can scroll through
##############################################################################*/
UI.COMPONENTS.ScrollSelect = {};
UI.COMPONENTS.ScrollSelect.new = function(rect, options, displayCount){
    let ss = {
        rect: rect,
        options: options,
        displayCount: displayCount,
        labels: null,
        selected: 0,
        index: 0,
        textHeight: 8
    };
    ss.init = function(){
        ss.updateOptions();
        let buttonX = ss.rect.position.x + 72;
        let topY = ss.rect.position.y;
        ss.upButton = UI.COMPONENTS.SpriteButton.new(
            SHAPES.RECT.new(
                VECTOR2.new(buttonX, topY),
                VECTOR2.new(8,8)
            ),
            SPRITES.static.cursors.arrowBlack,
            () => { ss.scrollUp(); },
            "Scroll Up"
        );
        let bottomY = ss.rect.position.y + ss.rect.size.y;
        ss.downButton = UI.COMPONENTS.SpriteButton.new(
            SHAPES.RECT.new(
                VECTOR2.new(buttonX, bottomY),
                VECTOR2.new(8,8)
            ),
            SPRITES.static.cursors.arrowBlackDown,
            () => { ss.scrollDown(); },
            "Scroll Down"
        );
    };

    ss.scrollUp = function(){
        ss.index -= ss.displayCount;
        if(ss.index < 0){
            ss.index = 0;
        }
    };
    ss.scrollDown = function(){
        if(ss.index < ss.options.length && ss.index + ss.displayCount < ss.options.length){
            ss.index += ss.displayCount;
        }
    };
    ss.updateOptions = function(){
        ss.labels = [];
        for(let i = 0; i < ss.options.length; i++){
            let option = ss.options[i];
            let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(ss.rect.size.x-ss.textHeight, ss.textHeight));
            let label = UI.COMPONENTS.TextLabel.new(
                rect,
                option,
                option,
                () => { ss.select(i); }
            );
            ss.labels.push(label);
        }
    };
    ss.update = function(){
        let start = ss.index;
        let end = ss.index + ss.displayCount;
        for(let i = start; i<end; i++){
            if(i < ss.labels.length){
                let label = ss.labels[i];
                let yOff =  (i - start) * ss.textHeight + ss.textHeight;
                label.rect.position = ss.rect.position.clone();
                label.rect.position.y += yOff;
                label.rect.position.x += ss.textHeight;
                label.update();
            }
        }
        ss.upButton.update();
        ss.downButton.update();
    };
    ss.draw = function(){
        // Draw a border
        let x = ss.rect.position.x;
        let y = ss.rect.position.y;
        let w = ss.rect.size.x;
        let h = ss.rect.size.height;
        let c = GRAPHICS.Colors.Black;
        GRAPHICS.drawBox(x, y, w, h, c);

        let start = ss.index;
        let end = ss.index + ss.displayCount;
        for(let i = start; i<end; i++){
            if(i < ss.labels.length){
                let label = ss.labels[i];
                label.draw();
            }
        }
        ss.upButton.draw();
        ss.downButton.draw();
    };
    ss.select = function(index){
        ss.selected = index;
    };
    ss.getSelected = function(){
        return ss.options[ss.selected];
    };
    ss.isHovered = function(){
        let mPos = INPUT.getDownScaledMousePosition();
        return ss.rect.contains(mPos);
    };
    ss.init();
    return ss;
};

        onClick: onClick
    };
    btn.update = function(){
        if(!INPUT.mouseClick(INPUT.LEFT_MOUSE)){
            return;
        }
        let mPos = INPUT.getDownScaledMousePosition();
        if(btn.rect.contains(mPos) && btn.onClick != null){
            btn.onClick();
        }
    };
    btn.isHovered = function(){
        let mPos = INPUT.getDownScaledMousePosition();
        return btn.rect.contains(mPos);
    };
    btn.draw = function(){
        let pos = btn.rect.position;
        let size = btn.rect.size
        let color = GRAPHICS.Colors.Beige
        if(btn.isHovered()){
            color = GRAPHICS.Colors.LightBrown;
        }
        // Draw background
        GRAPHICS.fillBox(
            pos.x, pos.y,
            size.x, size.y,
            color
        );

        // Draw outer border
        let offset = 0;
        color = GRAPHICS.Colors.DarkBrown;
        GRAPHICS.drawBox(
            pos.x+offset, pos.y+offset,
            size.x-offset, size.y-offset,
            color
        );
        // Draw inner border
        offset = 1;
        color = GRAPHICS.Colors.LightBrown;
        let xOff = 3;
        let center = btn.rect.center();
        let textSize = 10;
        GRAPHICS.drawBox(
            pos.x+offset, pos.y+offset,
            size.x-offset, size.y-offset,
            color
        );
        GRAPHICS.drawText(btn.text, pos.x+xOff, center.y, textSize, GRAPHICS.Colors.Black);
    };
    return btn;
};

UI.COMPONENTS.NotificationBar = {};
UI.COMPONENTS.NotificationBar.new = function(){
    let nbRect = SHAPES.RECT.new(
        VECTOR2.new(0, 0),
        VECTOR2.new(40, 40)
    );
    let nb = UI.COMPONENTS.BaseComponent.new(nbRect, null);
    nb.notifications = [];
    nb.expireTime = null;
    nb.rows = 3;
    nb.draw = function(){
        if(nb.notifications.length == 0){
            return;
        }
        let now = Date.now();
        if(nb.expireTime != null && now > nb.expireTime){
            nb.expireTime = null;
            nb.notifications.shift();
            return;
        }
        if(nb.expireTime == null){
            nb.expireTime = now + nb.notificationDuration();
        }
        let textHeight = 10;
        for(let i = 0; i < nb.rows; i++){
            let yOff = i * textHeight;
            if(nb.notifications.length > i){
                GRAPHICS.drawText(nb.notifications[i], 0, 20+yOff, 20, GRAPHICS.Colors.White);
            }
        }
    };
    nb.notificationDuration = function(){
        let base = SETTINGS.NotificationDuration;
        if(nb.notifications.length == 0){
            return base;
        }
        return Math.trunc(base/nb.notifications.length);
    };
    nb.updateDuration = function(){
        if(nb.expireTime == null){
            return;
        }
        let now = Date.now();
        let current = nb.expireTime - now;
        let updated = nb.notificationDuration();
        if(current > updated){
            nb.expireTime = now + updated;
        }
    };
    nb.notification = function(message){
        nb.notifications.push(message);
        nb.updateDuration();
    };
    return nb;
};

UI.COMPONENTS.StatusBar = {};
UI.COMPONENTS.StatusBar.new = function(manager){
    let sbRect = SHAPES.RECT.new(
        VECTOR2.new(320, 320),
        VECTOR2.new(80, 80)
    );
    let sprite = SPRITES.static.statusbar.statusbar;    
    let sb = UI.COMPONENTS.BaseComponent.new(sbRect, sprite);
    sb.manager = manager;
    sb.stats = null;
    sb.recentThreshold = 3;
    sb.blinkDuration = 250;
    sb.healthRect = SHAPES.RECT.new(
        VECTOR2.new(6, 6),
        VECTOR2.new(20, 50)
    );
    sb.energyRect = SHAPES.RECT.new(
        VECTOR2.new(30, 6),
        VECTOR2.new(20, 50)
    );
    sb.magicRect = SHAPES.RECT.new(
        VECTOR2.new(53, 6),
        VECTOR2.new(21, 50)
    );
    sb.linkActor = function(actor){
        sb.stats = actor.stats;
    };
    sb.draw = function(){
        if(sb.stats == null){
            return;
        }
        if(!sb.isChangedRecently() && SCENE.getGameState() == GAMESTATES.play){
            // Hide unless the inventory menu's already up
            // or something's changing during play
            return;
        }
        let health = sb.stats.getStat(STATS.Resources.health);
        let energy = sb.stats.getStat(STATS.Resources.energy);
        let magic = sb.stats.getStat(STATS.Resources.magic);
        let pos = sb.rect.position;
        SPRITES.renderSprite(pos.x, pos.y, sb.sprite.index, sb.sprite.sheet, DISPLAY_MODES.static);
        sb.shroudStat(health, sb.healthRect);
        sb.shroudStat(energy, sb.energyRect);
        sb.shroudStat(magic, sb.magicRect);
        sb.renderStatText(sb.healthRect, health);
        sb.renderStatText(sb.energyRect, energy);
        sb.renderStatText(sb.magicRect, magic);
        sb.highlightDelta(sb.healthRect, health);
        sb.highlightDelta(sb.energyRect, energy);
        sb.highlightDelta(sb.magicRect, magic);
    };
    sb.highlightDelta = function(barRect, stat){
        if(stat.changeDelta() == null || stat.changeDelta() == 0 || stat.changeAgeSeconds() > sb.recentThreshold){
            return;
        }
        // Blink the highlight
        let blinks = Math.trunc(stat.changeAgeMilliseconds() / sb.blinkDuration);
        let blinkOff = blinks % 2 == 0; 
        if(blinkOff){
            // Highlighting blinks on and off.
            return;
        }
        if(stat.changeDelta() > 0){
            sb.highlightGain(barRect, stat);
        }
        else if(stat.changeDelta() < 0){
            sb.highlightLoss(barRect, stat);
        }
    };
    sb.highlightGain = function(barRect, stat){
        // TODO
    };
    sb.highlightLoss = function(barRect, stat){
        let delta = stat.changeDelta() * -1;
        let deltaPercentage = delta / stat.max();
        let deltaHeight = deltaPercentage * barRect.size.y;
        let shroudHeight = sb.getShroudHeight(stat.value, stat.max(), barRect.size.y);

        let x = barRect.position.x + sb.rect.position.x;
        let y = barRect.position.y + sb.rect.position.y + shroudHeight - deltaHeight ;
        let width = barRect.size.x;
        let height = deltaHeight;
        GRAPHICS.fillBox(x, y, width, height, stat.transparentColor);
    };
    sb.shroudStat = function(stat, rect){
        let barHeight = rect.size.y;
        let shroudHeight = sb.getShroudHeight(stat.value, stat.max(), barHeight);
        let shroudPos = rect.position.add(sb.rect.position);
        let x = shroudPos.x;
        let y = shroudPos.y;
        let width = rect.size.x;
        let height = shroudHeight;
        let color = GRAPHICS.Colors.Black;
        if(stat.max() == 0){
            color = GRAPHICS.Colors.Beige;
        }
        GRAPHICS.fillBox(shroudPos.x, shroudPos.y, rect.size.x, shroudHeight, color);
    };
    sb.getShroudHeight = function(value, max, barHeight){
        if(max == 0){
            return barHeight;
        }
        let barPercentage = value / max; // how full is the bar
        let shroudPercentage = 1 - barPercentage;
        let shroudHeight = barHeight * shroudPercentage;
        return shroudHeight;
    };
    sb.renderStatText = function(barRect, stat){
        if(stat.max() == 0){
            return;
        }
        let color = stat.color;
        let textSize = SETTINGS.defaultFontSize;
        let x = sb.rect.position.x + barRect.position.x;
        let y = sb.rect.position.y + barRect.position.y + barRect.size.y + textSize;
        let text = stat.name;
        GRAPHICS.drawText(text, x, y, textSize, color);
        y += textSize;
        text = stat.value + "/" + stat.max();
        if(stat.name == STATS.Resources.health){
            text = UTILITY.formatHealth(stat.value) + "/" + UTILITY.formatHealth(stat.max());
        }
        GRAPHICS.drawText(text, x, y, textSize, color);
    };
    sb.isChangedRecently = function(){
        let health = sb.stats.getStat(STATS.Resources.health);
        if(health.changeAgeSeconds() != null && health.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        let energy = sb.stats.getStat(STATS.Resources.energy);
        if(energy.changeAgeSeconds() != null && energy.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        let magic = sb.stats.getStat(STATS.Resources.magic);
        if(magic.changeAgeSeconds() != null && magic.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        return false;
    };
    return sb;
};

UI.COMPONENTS.PaperDoll = {};
UI.COMPONENTS.PaperDoll.new = function(manager){
    let rect = SHAPES.RECT.new(VECTOR2.new(123, 246), VECTOR2.new(89, 80));
    let sprite = SPRITES.static.paperdoll.paperdoll;
    let pd = UI.COMPONENTS.BaseComponent.new(rect, sprite);
    pd.name = "Paperdoll";
    pd.manager = manager;
    pd.linkedInv = null;
    pd.slotPositions = {};
    pd.slotPositions[GEAR.slots.head] = VECTOR2.new(21,2);
    pd.slotPositions[GEAR.slots.hand] = VECTOR2.new(2,21);
    pd.slotPositions[GEAR.slots.offHand] = VECTOR2.new(40,21);
    pd.slotPositions[GEAR.slots.torso] = VECTOR2.new(21,21);
    pd.slotPositions[GEAR.slots.legs] = VECTOR2.new(21,40);
    pd.slotPositions[GEAR.slots.feet] = VECTOR2.new(21,59);
    pd.slotPositions[GEAR.slots.special1] = VECTOR2.new(67,13);
    pd.slotPositions[GEAR.slots.special2] = VECTOR2.new(67,32);
    pd.slotPositions[GEAR.slots.special3] = VECTOR2.new(67,51);
    pd.slotIndexToName = function(slotIndex){
        if(slotIndex < 0){
            return null;
        }
        let keys = Object.keys(pd.slotPositions);
        if(slotIndex >= keys.length){
            return null;
        }
        return keys[slotIndex];
    };
    pd.draw = function(){
        let pos = pd.rect.position;
        SPRITES.renderSprite(pos.x, pos.y, pd.sprite.index, pd.sprite.sheet, DISPLAY_MODES.static);
        for(let slot of Object.keys(pd.slotPositions)){
            let slotRect = pd.getSlotRect(slot);
            let item = pd.getItemBySlotName(slot);
            if(item != null){
                SPRITES.renderSprite(slotRect.position.x, slotRect.position.y, item.sprite.index, item.sprite.sheet, DISPLAY_MODES.static);
            }
        }
        let hoveredSlot = pd.getHoveredSlotName();
        if(hoveredSlot){
            let rect = pd.getSlotRect(hoveredSlot);
            GRAPHICS.drawBox(rect.position.x, rect.position.y, rect.size.x, rect.size.y);
            let hoveredItem = pd.getItemBySlotName(hoveredSlot);
            if(hoveredItem){
                GRAPHICS.drawTooltip(hoveredItem.name);
            }
        }
    };
    pd.getItemBySlotName = function(slot){
        if(pd.linkedInv == null){
            return null;
        }
        let slotIndex = GEAR.slotIndices[slot];
        return pd.linkedInv.getItem(slotIndex);
    };
    pd.getItem = function(slotIndex){
        if(pd.linkedInv == null){
            return null;
        }
        return pd.linkedInv.getItem(slotIndex);
    };
    pd.setItem = function(slotIndex, item){
        if(pd.linkedInv == null){
            return;
        }
        pd.linkedInv.setItem(slotIndex, item);
    };
    pd.canSetItem = function(slotIndex, item){
        if(item == null){
            // Can always clear slot
            return true;
        }
        let slotName = pd.slotIndexToName(slotIndex);
        if(slotName == null){
            return false;
        }
        if(item.type != ITEMS.Types.Gear){
            UTILITY.notification("Cannot equip that");
            return false;
        }
        if(item.slots && item.slots.includes(slotName)){
            return true;
        }
        UTILITY.notification("Cannot equip that there");
        return false;
    };
    pd.getHoveredSlot = function(){
        let mousePos = INPUT.getDownScaledMousePosition();
        for(let slot of Object.keys(pd.slotPositions)){
            let rect = pd.getSlotRect(slot);
            if(rect && rect.contains(mousePos)){
                return GEAR.slotIndices[slot];
            }
        }
        return null;
    };
    pd.getHoveredSlotName = function(){
        let mousePos = INPUT.getDownScaledMousePosition();
        for(let slot of Object.keys(pd.slotPositions)){
            let rect = pd.getSlotRect(slot);
            if(rect && rect.contains(mousePos)){
                return slot;
            }
        }
        return null;
    };
    pd.getSlotRect = function(slot){
        if(pd.slotPositions[slot] == null){
            return null;
        }
        let slotOffset = pd.slotPositions[slot];
        let pos = pd.rect.position.add(slotOffset);
        let size = VECTOR2.new(16,16);
        return SHAPES.RECT.new(pos, size)
    };
    pd.getHoveredItem = function(){
        let slot = pd.getHoveredSlotName();
        if(slot == null){
            return null;
        }
        return pd.getItemBySlotName(slot);
    };
    return pd;
};

            hb.setActiveSlot(3);
        }
        else if(INPUT.keyPress(INPUT.KEYS.K_5)){
            hb.setActiveSlot(4);
        }
        else if(INPUT.keyPress(INPUT.KEYS.K_6)){
            hb.setActiveSlot(5);
        }
        else if(INPUT.keyPress(INPUT.KEYS.K_7)){
            hb.setActiveSlot(6);
        }
        else if(INPUT.keyPress(INPUT.KEYS.K_8)){
            hb.setActiveSlot(7);
        }
        else if(INPUT.keyPress(INPUT.KEYS.K_9)){
            hb.setActiveSlot(8);
        }
        // change slot based on mouse wheel
        let wheelInput = INPUT.getMouseWheel();
        if(wheelInput > 0){
            hb.nextSlot();
        }
        else if(wheelInput < 0){
            hb.prevSlot();
        }
    };
    hb.draw = function(){
        let pos = hb.rect.position;
        SPRITES.renderSprite(pos.x, pos.y, hb.sprite.index, hb.sprite.sheet, DISPLAY_MODES.static);
        if(hb.linkedInv){
            for(let i = 0; i < hb.linkedInv.size; i++){
                hb.drawSlot(i);
            }
        }

        let rect = null;
        if(SCENE.getGameState() === GAMESTATES.play){
            // Highlight active slot
            rect = hb.getSlotRect(hb.activeSlot);
            GRAPHICS.drawBox(rect.position.x, rect.position.y, rect.size.x, rect.size.y, GRAPHICS.Colors.Black);
            let hoveredItem = hb.getHoveredItem();
            if(hoveredItem){
                GRAPHICS.drawTooltip(hoveredItem.toString());
            }
        }
        else if(SCENE.getGameState() === GAMESTATES.playerMenus){
            // Highlight slot that's hovered over
            let hoveredSlot = hb.getHoveredSlot();
            if(hoveredSlot > -1){
                rect = hb.getSlotRect(hoveredSlot);
                GRAPHICS.drawBox(rect.position.x, rect.position.y, rect.size.x, rect.size.y);
                let hoveredItem = hb.getHoveredItem();
                if(hoveredItem){
                    GRAPHICS.drawTooltip(hoveredItem.toString());
                }
            }
        }
    };
    hb.drawSlot = function(slot){
        if(hb.manager.dragged && hb.manager.dragged.component == hb && hb.manager.dragged.slot == slot){
            return;
        }
        let item = hb.linkedInv.getItem(slot);
        if(item){
            let rect = hb.getSlotRect(slot);
            SPRITES.renderSprite(rect.position.x, rect.position.y, item.sprite.index, item.sprite.sheet, DISPLAY_MODES.static);
            let quant = item.quantity;
            let xOff = 10;
            let yOff = 15;
            let label = item.quantity;
            // Maybe try again later.
            GRAPHICS.drawText(label, rect.position.x+xOff, rect.position.y+yOff, 20, GRAPHICS.Colors.Black);
            GRAPHICS.drawText(label, rect.position.x+xOff, rect.position.y+yOff, 15, GRAPHICS.Colors.White);
        }
    };
    // Returns the rect for one inventory slot
    hb.getSlotRect = function(index){
        let slotSize = 16;
        let offsetX = (index * slotSize) + index + 1;
        let offsetY = 1;
        let x = hb.rect.position.x;
        let y = hb.rect.position.y;
        return SHAPES.RECT.new(VECTOR2.new(x+offsetX, y+offsetY), VECTOR2.new(slotSize, slotSize));
    };
    hb.getItem = function(slot){
        if(hb.linkedInv == null){
            return null;
        }
        return hb.linkedInv.getItem(slot);
    };
    hb.setItem = function(slot, item){
        if(hb.linkedInv){
            hb.linkedInv.setItem(slot, item);
        }
    };
    hb.canSetItem = function(slot, item){
        return true;
    };
    hb.nextSlot = function(){
        hb.activeSlot += 1;
        if(hb.activeSlot >= hb.slotCount){
            hb.activeSlot = 0;
        }
        if(SCENE.getPlayerOne()){
            SCENE.getPlayerOne().hotbar.activeSlot = hb.activeSlot;
        }
    };
    hb.prevSlot = function(){
        hb.activeSlot -= 1;
        if(hb.activeSlot < 0){
            hb.activeSlot = hb.slotCount-1;
        }
        if(SCENE.getPlayerOne()){
            SCENE.getPlayerOne().hotbar.activeSlot = hb.activeSlot;
        }
    };
    hb.setActiveSlot = function(index){
        hb.activeSlot = index;
        if(SCENE.getPlayerOne()){
            SCENE.getPlayerOne().hotbar.activeSlot = index;
        }
    };
    hb.getHoveredSlot = function(){
        let mousePos = INPUT.getDownScaledMousePosition();

        let ret = -1;
        for(let i = 0; i < 9; i++){
            let rect = hb.getSlotRect(i);
            if(rect.contains(mousePos)){
                return i;
            }
        }
        return ret;
    };
    hb.getHoveredItem = function(){
        let hoveredSlot = hb.getHoveredSlot();
        return hb.linkedInv.getItem(hoveredSlot);
    };
    return hb;
};

/*##############################################################################
# Main
# One script to rule them all.
# God object/singleton. Runs before all other scripts, runs main game loop
##############################################################################*/
MAIN.START_TIME = Date.now();
MAIN.LAG = 0;
MAIN.ANIM_START_TIME = Date.now();
MAIN.ANIM_LAG = 0;
MAIN.FRAMES_TO_ADVANCE = 0;
MAIN.nextEntityId = 0;
MAIN.DISPLAY_MODE = 0;
MAIN.DELAYED_EXECUTIONS = [];

MAIN.GameLoop = function(){
  requestAnimationFrame(MAIN.GameLoop, GRAPHICS.getCanvas());
  // Handle FPS for game loop
  let current_time = Date.now();
  let elapsed = current_time - MAIN.START_TIME;
  MAIN.START_TIME = current_time;
  MAIN.LAG += elapsed;
  let iterations = 0;
  let maxIterations = 3;

  while(MAIN.LAG >= SETTINGS.frameDuration && iterations < maxIterations){
    iterations++;
    SCENE.update();
    INPUT.clearPresses();
    MAIN.LAG -= SETTINGS.frameDuration;
    
    // Handle FPS timer for animations
    current_time = Date.now();
    elapsed = current_time - MAIN.ANIM_START_TIME;
    MAIN.ANIM_START_TIME = current_time;
    MAIN.ANIM_LAG += elapsed;
    MAIN.FRAMES_TO_ADVANCE = Math.trunc(MAIN.ANIM_LAG / SETTINGS.animationFrameDuration);
    if(MAIN.FRAMES_TO_ADVANCE >= 1){
      MAIN.ANIM_LAG = 0;
      MAIN.updateDelayedExecutions();
    }
  }
  if(iterations == maxIterations){
    MAIN.LAG = 0;
  }
}

MAIN.init = function(){
  SETTINGS.init();
  GRAPHICS.init();
  INPUT.initInput();
  SCENE.init();
}

MAIN.main = function(){
  this.init();
  this.GameLoop();
}

MAIN.updateDelayedExecutions = function(){
  for(let execution of MAIN.DELAYED_EXECUTIONS){
    execution.frames -= 1;
    if(execution.frames < 1){
      execution.onExecute();
    }
  }
  MAIN.DELAYED_EXECUTIONS = MAIN.DELAYED_EXECUTIONS.filter((ex) => ex.frames > 0);  
};

document.addEventListener('DOMContentLoaded', function() {
  MAIN.main();
});</script>
