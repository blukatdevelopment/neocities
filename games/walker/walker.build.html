WORLD.Grid = {};
WORLD.Grid.new = function(){
    let grid = {
        columns: 40,
        rows: 40,
        terrainMap: [],
        heightMap: [],
        humidityMap: [],
        heatMap: []
    };
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap.push(null);
        grid.heightMap.push(null);
        grid.humidityMap.push(null);
        grid.heatMap.push(null);
    }
    grid.coordsToIndex = function(coords){
        return coords.x + (coords.y * grid.rows);
    };
    grid.indexToCoords = function(index){
        return VECTOR2.new(index % grid.columns, Math.trunc(index / grid.rows));
    };
    grid.coordsValid = function(coords){
        return coords.x > -1 && coords.x < grid.columns
                && coords.y > -1 && coords.y < grid.rows;
    };
    // All coords within a given radius, including the center
    grid.coordsInRadius = function(center, radius){
        let retList = [];
        let adjacencies = [];
        for(let i = (radius * -1); i < radius + 1; i++){
            for(let j = (radius * -1); j < radius + 1; j++){
                let coords = VECTOR2.new(center.x + i, center.y + j);
                if(grid.coordsValid(coords)){
                    retList.push(coords);
                }
            }
        }
        return retList;
    };
    return grid;
};

WORLD.Generate = {};
WORLD.Generate.HeatMap = function(grid){
    let equator = Math.trunc(grid.rows/2);
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            let distance = Math.abs(y - equator);
            let heat = equator - distance;
            grid.heatMap[index] = heat;
        }
    }
};

// 0 is sea level
WORLD.Generate.ElevationMap = function(grid){
    for(let i = 0; i < 10; i++){
        let peakCoords = VECTOR2.new(UTILITY.randRange(0, grid.columns-1), UTILITY.randRange(0, grid.rows-1));
        let peakIndex = grid.coordsToIndex(peakCoords);
        for(let j = 0; j < 5; j++){
            WORLD.Generate.SlopeAroundPeak(grid, peakCoords, j);
        }
    }
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            if(grid.heightMap[index] == null){
                grid.heightMap[index] = -1;
            }
        }
    }
};

WORLD.Generate.SlopeAroundPeak = function(grid, peak, radius){
    let height = 5 - radius; // Reduces by distance
    let coordsList = grid.coordsInRadius(peak, radius);
    for(let coords of coordsList){
        let index = grid.coordsToIndex(coords);
        if(grid.heightMap[index] == null){
            grid.heightMap[index] = height;
        }
    }
};


WORLD.Generate.HumidityMap = function(grid){
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            let isWater = grid.heightMap[index] == -1;
            if(isWater){
                // Humidity on the water is 5
                grid.humidityMap[index] = 5;
            }
            else if(WORLD.Generate.isWaterAdjacent(grid, coords)){
                // Adjacent to water is 4
                grid.humidityMap[index] = 4;
            }
            else if(WORLD.Generate.isWaterNear(grid, coords)){
                grid.humidityMap[index] = 3;
            }
            else{
                grid.humidityMap[index] = 2;
            }
            WORLD.Generate.applySlopeHumidityModifiers(grid, coords, index);
        }
    }
};

WORLD.Generate.isWaterAdjacent = function(grid, coords){
    let neighbors = grid.coordsInRadius(coords, 1);
    for(let neighbor of neighbors){
        if(!neighbor.equals(coords)){
            let neighborIndex = grid.coordsToIndex(neighbor);
            if(grid.heightMap[neighborIndex] == -1){
                return true;
            }
        }
    }
    return false;
};

WORLD.Generate.isWaterNear = function(grid, coords){
    let neighbors = grid.coordsInRadius(coords, 2);
    for(let neighbor of neighbors){
        if(!neighbor.equals(coords)){
            let neighborIndex = grid.coordsToIndex(neighbor);
            if(grid.heightMap[neighborIndex] == -1){
                return true;
            }
        }
    }
    return false;
};

WORLD.Generate.applySlopeHumidityModifiers = function(grid, coords, index){
    if(grid.humidityMap[index] > 3){
        // coastal cells immune from modifier
        return;
    }
    let elevation = grid.heightMap[index];
    let eastNeighbor = VECTOR2.new(coords.x+1, coords.y);
    let eastValid = grid.coordsValid(eastNeighbor);
    let westNeighbor = VECTOR2.new(coords.x-1, coords.y);
    let westValid = grid.coordsValid(westNeighbor);
    if(westValid && grid.heightMap[grid.coordsToIndex(westNeighbor)] > elevation){
        // If cut off from humid winds, penalty
        grid.humidityMap[index] -= 2;
    }
    else if(eastValid && grid.heightMap[grid.coordsToIndex(eastNeighbor)] > elevation){
       // If humids winds are trapped by eastern elevation, bonus
       grid.humidityMap[index] += 2;
    }
};

WORLD.Generate.TerrainMap = function(grid){
    for(let x = 0; x < grid.columns; x++){
        for(let y = 0; y < grid.rows; y++){
            let coords = VECTOR2.new(x, y);
            let index = grid.coordsToIndex(coords);
            grid.terrainMap[index] = WORLD.Generate.calculateTerrain(grid, coords, index);
        }
    }
};

WORLD.Generate.calculateTerrain = function(grid, coords, index){
    let elevation = grid.heightMap[index];
    let humidity = grid.humidityMap[index];
    let heat = grid.heatMap[index];

    if(elevation < 0){
        // You're below sea level
        return WORLD.Terrain.Water;
    }
    if(elevation == 1){
        // You're on a beach
        return WORLD.Terrain.Sand;
    }
    if(elevation == 4){
        // You're too high up for vegetation
        return WORLD.Terrain.Rock;
    }
    if(elevation == 5){
        // You're so high up it snows
        return WORLD.Terrain.Snow;
    }
    // By this point elevation is 2 or 3, mainland
    if(heat < 5){
        // It's very cold this far from the equator
        return WORLD.Terrain.Snow;
    }
    if(humidity < 2){
        // You're in a non-frozen desert
        return WORLD.Terrain.Sand;
    }
    if(humidity > 3){
        // You've got a humidity bonus, have some trees
        return WORLD.Terrain.Forest;
    }
    // Humidity must be 3 by this point
    if(heat > 17){
        // Much too hot to retain water
        // Adjust this if you change elevation range
        return WORLD.Terrain.Steppe;
    }
    // By process of elimination, you're in-land.
    // You're at elevation 3, humidity 3,
    // neither close nor far from the equator,
    // and slope is not effecting your humidity
    return WORLD.Terrain.Grass;
};

// Dry land's a myth
WORLD.Generate.WaterWorld = function(){
    let grid = WORLD.Grid.new();
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap[i] = WORLD.Terrain.Water;
    }
    return grid;
};

// Good for exploring on foot
WORLD.Generate.GrassWorld = function(){
    let grid = WORLD.Grid.new();
    let gridSize = grid.columns * grid.rows;
    for(let i = 0; i < gridSize; i++){
        grid.terrainMap[i] = WORLD.Terrain.Grass;
    }
    return grid;
};

WORLD.Generate.DetailedWorld = function(){
    let grid = WORLD.Grid.new();
    WORLD.Generate.HeatMap(grid);
    WORLD.Generate.ElevationMap(grid);
    WORLD.Generate.HumidityMap(grid);
    WORLD.Generate.TerrainMap(grid);
    return grid;
};

// Key state
INPUT.activeKeys = {};
INPUT.activeKeyPresses = {};


INPUT.getMousePosition = function(){
  if(INPUT._mousePos){
    return VECTOR2.new(INPUT._mousePos.x, INPUT._mousePos.y);  
  }
  return null;
};

INPUT.getDownScaledMousePosition = function(){
  if(INPUT._mousePos){
    return VECTOR2.new(GRAPHICS.downScale(INPUT._mousePos.x), GRAPHICS.downScale(INPUT._mousePos.y));
  }
  return null;
};


INPUT.mouseClick = function(mouseButton){
  if(mouseButton > -1 && mouseButton < 3){
    return INPUT._mouseClick[mouseButton];
  }
};

INPUT.isMouseDragging = function(){
  return INPUT._mouseDown[0] && !INPUT._mouseClick[0];
};

INPUT.fullClick = function(){
  return INPUT._fullClick;
};

INPUT.key = function(which){
  if(!(which in INPUT.activeKeys)){
    return false;
  }
  return INPUT.activeKeys[which];
};

INPUT.keyPress = function(which){
  if(!(which in INPUT.activeKeyPresses)){
    return false;
  }
  return INPUT.activeKeyPresses[which];
};

// Triggers when you left click and then release
// Differentiates between click and drag
INPUT.onMouseFullClick = function(evt){
  INPUT._fullClick = true;
};

INPUT.onMouseDown = function(evt){
  let which = evt.button;
  if(which > -1 && which < 3){
    let previousDown = INPUT._mouseDown[which];
    INPUT._mouseDown[which] = true;
    if(!previousDown){
      INPUT._mouseClick[which] = true;
    }
  }
};

INPUT.onMouseUp = function(evt){
  let which = evt.button;
  if(which > -1 && which < 3){
    INPUT._mouseDown[which] = false;
  }
};

INPUT.onMouseMove = function(evt){
  var rect = GRAPHICS.getCanvas().getBoundingClientRect();
  INPUT._mousePos = VECTOR2.new(evt.clientX - rect.left, evt.clientY - rect.top);
};

INPUT.onMouseOut = function(evt){};

INPUT.onKeyDown = function(evt){
  // Suppress Tab Key
  if(evt.which == 9){
    evt.preventDefault();
    evt.stopPropagation();
  }

  if(evt.which in INPUT.activeKeys){
    let previousDown = INPUT.activeKeys[evt.which];
    INPUT.activeKeys[evt.which] = true;
    if(evt.which in INPUT.activeKeyPresses){
      INPUT.activeKeyPresses[evt.which] = false;
      if(!previousDown){
        INPUT.activeKeyPresses[evt.which] = true;
      }
    }
  }
};

INPUT.onKeyUp = function(evt){
  if(evt.which in INPUT.activeKeys){
    INPUT.activeKeys[evt.which] = false;
  }
  if(evt.which in INPUT.activeKeyPresses){
    INPUT.activeKeyPresses[evt.which] = false;
  }
};

INPUT.cancelSpacebarScroll = function(evt){
  if(evt.keyCode == INPUT.KEYS.K_SPACE && evt.target == document.body) {
    evt.preventDefault();
  }
};

INPUT.handleMouseWheel = function(evt){
  event.preventDefault();
  if(event.deltaY != 0){
    INPUT._mouseWheelInput = event.deltaY;
  }
};

// Only allow presses to appear for a single frame
INPUT.clearPresses = function(){
    for(let i in KEY_PRESSES_USED){
      let key = KEY_PRESSES_USED[i];
      INPUT.activeKeyPresses[key] = false;
    }
    INPUT._mouseWheelInput = 0;
    INPUT._mouseClick[0] = false;
    INPUT._mouseClick[1] = false;
    INPUT._mouseClick[2] = false;
    INPUT._fullClick = false;
};

INPUT.getMouseWheel = function(){
  return INPUT._mouseWheelInput;
};

INPUT.initInput = function(){
  for(let i in KEYS_USED){
    let key = KEYS_USED[i];
    INPUT.activeKeys[key] = false;
  }
  for(let i in KEY_PRESSES_USED){
    let key = KEY_PRESSES_USED[i];
    INPUT.activeKeyPresses[key] = false;
  }
  var canvas = GRAPHICS.getCanvas();
  canvas.addEventListener("click", INPUT.onMouseFullClick);
  canvas.addEventListener("mousedown", INPUT.onMouseDown);
  canvas.addEventListener("mouseup", INPUT.onMouseUp);
  canvas.addEventListener("mousemove", INPUT.onMouseMove);
  canvas.addEventListener("mouseout", INPUT.onMouseOut);
  window.addEventListener('keydown', INPUT.onKeyDown, false);
  window.addEventListener('keyup', INPUT.onKeyUp, false);
  window.addEventListener('keydown', INPUT.cancelSpacebarScroll, false);
  window.addEventListener("wheel", INPUT.handleMouseWheel, { passive:false });
};
/*##############################################################################
# An entity containing one stack of items, which can be picked up
##############################################################################*/
ENTITY.ItemStack = {};
ENTITY.ItemStack.new = function(item){
    let pue = ENTITY.baseEntity.new();
    pue.entityType = ENTITY.TYPES.ItemStack;
    pue.setCollider(PHYSICS.BoxCollider.new());
    pue.collider.rigid = false;
    pue.item = item;
    pue.name = item.name;
    pue.sprite = item.sprite;
    pue.renderer.setSprite(item.sprite);
    let size = VECTOR2.new(0, 0);
    size.x = item.sprite.sheet.cellResolutionX;
    size.y = item.sprite.sheet.cellResolutionY;
    pue.collider.rect.size = size;
    pue.onCollide = function(collision){};
    pue.onInteract = function(interaction){
        if(interaction.initiator){
            let prevQuant = pue.item.quantity;
            pue.item.quantity = interaction.initiator.pickUp(pue.item);
            let delta = prevQuant - pue.item.quantity;
            let message = "Picked up " + pue.item.name;
            if(delta > 1){
                message += "(" + delta + ")";
            }
            UTILITY.notification(message);
            if(pue.item.quantity == 0){
                SCENE.destroyEntity(pue);
            }
        }
    };
    pue.onAttacked = function(attack){};
    pue.getData = function(){
        let data = ENTITY.Data.new(pue.entityType, pue.position);
        data.item = pue.item.name;
        return data;
    };
    return pue;
};

// Is picked up by actors
ENTITYFACTORY.ItemStack = function(itemName, quantity, durability){
    let item = ITEMS.create(itemName, quantity, durability);
    if(item){
        let pu = ENTITY.ItemStack.new(item);
        return pu;
    }
    UTILITY.log("ENTITYFACTORY.ItemStack", "Could not create ItemStack", { name: itemName, quantity: quantity, durability: durability });
};


ENTITY.Data.ItemStack = function(itemName, position, quantity){
    let data = ENTITY.Data.new(ENTITY.TYPES.ItemStack, position);
    data.item = itemName;
    data.quantity = 1;
    if(quantity){
        data.quantity = quantity;
    }
    return data;
};
/*##############################################################################
# Factory for creating entities.
# Individual factory functins can be found alongside each entity definition
##############################################################################*/

ENTITY.TYPES = {};
ENTITY.TYPES.Scenery = "Scenery";
ENTITY.TYPES.ItemStack = "ItemStack";
ENTITY.TYPES.Enemy = "Enemy";
ENTITY.TYPES.Player = "Player";

ENTITYFACTORY.Load = function(data){
    let entity = null;
    
    if(data.entityType == ENTITY.TYPES.ItemStack){
        entity = ENTITYFACTORY.ItemStack(data.item, 1, 1);
        entity.setPosition(data.position);
    }
    if(data.entityType == ENTITY.TYPES.Enemy){
        entity = ACTORFACTORY.slime();
        entity.setPosition(data.position);
    }
    if(data.entityType == ENTITY.TYPES.Scenery){
        entity = ENTITYFACTORY.Scenery(data.sprite, data.position, data.rect);
    }
    return entity;
};

ENTITYFACTORY.Create = function(entityName){
    if(ENTITY.Entities[entityName] && ENTITYFACTORY[entityName]){
        let constructor = ENTITYFACTORY[entityName];
        return constructor();
    }
    return null;
};

// Static object with collision box
ENTITYFACTORY.Scenery = function(_sprite, position, rect){
    let sc = ENTITY.Scenery.new();
    if(rect){
        sc.collider.rect = rect;

UI.COMPONENTS.PlayerUIManager = {};
UI.COMPONENTS.PlayerUIManager.new = function(){
    let cm = {};
    cm.hotbar = UI.COMPONENTS.Hotbar.new(cm);
    cm.inventory = UI.COMPONENTS.Inventory.new(cm);
    cm.statusbar = UI.COMPONENTS.StatusBar.new();
    cm.notificationsBar = UI.COMPONENTS.NotificationBar.new();
    cm.foodbar = UI.COMPONENTS.FoodBar.new();
    cm.paperdoll = UI.COMPONENTS.PaperDoll.new();
    cm.dragged = null;

    cm.update = function(){
        cm.hotbar.update();
        cm.inventory.update();
        cm.statusbar.update();
        cm.foodbar.update();
        cm.paperdoll.update();
        if(SCENE.getGameState() !== GAMESTATES.inventory){
            return;
        }
        if(INPUT.mouseClick(INPUT.LEFT_CLICK)){
            let draggedComponent = cm.getDraggedComponent();
            if(draggedComponent){
                cm.dragged = {
                    component: draggedComponent,
                    slot: draggedComponent.getHoveredSlot()
                };
            }
        }
        if(INPUT.fullClick()){
            // Deposit dropped item if possible
            let destComponent = cm.getHoveredComponent();
            if(destComponent){
                let destSlot = destComponent.getHoveredSlot();
                let draggedItem = cm.dragged.component.getItem(cm.dragged.slot);
                let displacedItem = destComponent.getItem(destSlot);
                
                // Swap contents of slots
                destComponent.setItem(destSlot, draggedItem);
                cm.dragged.component.setItem(cm.dragged.slot, displacedItem);
            }
            // Stop dragging
            cm.dragged = null;
        }
    };
    cm.draw = function(){
        cm.hotbar.draw();
        cm.inventory.draw();
        cm.statusbar.draw();
        cm.notificationsBar.draw();
        cm.foodbar.draw();
        cm.paperdoll.draw();
        if(cm.dragged == null){
            return;
        }

        let slot = cm.dragged.slot;
        let item = cm.dragged.component.linkedInv.getItem(slot);

        if(item == null){
            return;
        }
        let pos = INPUT.getDownScaledMousePosition();
        let size = VECTOR2.new(item.sprite.sheet.cellResolutionX, item.sprite.sheet.cellResolutionY);
        //pos.x += size.x/2;
        //pos.y += size.y/2;
        SPRITES.renderSprite(pos.x, pos.y, item.sprite.index, item.sprite.sheet, DISPLAY_MODES.static);
    };
    // Component who's item is being clicked and dragged
    cm.getDraggedComponent = function(){
        if(cm.hotbar.getHoveredSlot() != -1 && cm.hotbar.getItem(cm.hotbar.getHoveredSlot()) != null){
            return cm.hotbar;
        }
        if(cm.inventory.getHoveredSlot() != -1 && cm.inventory.getItem(cm.inventory.getHoveredSlot()) != null){
            return cm.inventory;
        }
        return null;
    };
    // Component whose slot is hovered over
    cm.getHoveredComponent = function(){
        if(cm.hotbar.getHoveredSlot() != -1){
            return cm.hotbar;
        }
        if(cm.inventory.getHoveredSlot() != -1){
            return cm.inventory;
        }
        return null;
    };
    cm.linkActor = function(actor){
        cm.hotbar.linkedInv = actor.hotbar;
        cm.inventory.linkedInv = actor.inventory;
        cm.statusbar.linkActor(actor);

    };
    return cm;
};

LEVEL.Renderer = {};
LEVEL.Renderer.new = function(){
    let lr = {
        player: null,
        entities: [],
        scenery: [], // excluded from collisions
        ui: null
    };
    lr.init = function(){
        GRAPHICS.setDisplayMode(DISPLAY_MODES.camera);
        lr.physics = PHYSICS.Controller.new();
        lr.player = ACTORFACTORY.playerOne();
        lr.addEntity(lr.player);
        lr.ui = UI.COMPONENTS.PlayerUIManager.new();
        lr.ui.linkActor(lr.player);
    };
    lr.loadData = function(data){
        let levelSize = SETTINGS.DefaultLevelTileSize * SETTINGS.DefaultLevelSize;
        let levelRect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(levelSize, levelSize));
        SCENE.setLevelRect(levelRect);

        if(data.tileMap){
            let tileMap = data.tileMap;
            for(let i = 0; i < tileMap.tiles.length; i++){
                let sprite = tileMap.getSpriteByIndex(i);
                let pos = tileMap.getPositionByIndex(i);
                let tile = ENTITYFACTORY.Scenery(sprite, pos);
                lr.scenery.push(tile);
            }
        }
        for(let entityData of data.entityData){
            lr.addEntity(ENTITYFACTORY.Load(entityData));
        }
        if(data.playerPosition && lr.player){
            lr.player.setPosition(data.playerPosition);
        }
    };
    lr.update = function(){
        lr.physics.update();
        if(SCENE.getGameState() === GAMESTATES.play){
            for(let entity of lr.entities){
                if(entity){
                  entity.update();
                }
            }
        }
        lr.ui.update();
        lr.updateCursor();
        lr.drawLevel();
    };
    lr.cursorInRange = function(){
        let pos = GRAPHICS.getWorldCursor();
        let walkerPos = lr.player.centeredPosition();
        let distance = pos.distance(walkerPos);
        return distance < SETTINGS.interactionRange;
    };
    lr.updateCursor = function(){
        if(lr.cursorInRange()){
            SCENE.updateCursor(SPRITES.static.cursors.roundBlack);
          }
          else{
            SCENE.updateCursor(SPRITES.static.cursors.roundRed);
          }
    };
    lr.drawLevel = function(){
        GRAPHICS.clearCanvas();

        for(let renderer of lr.scenery){
            renderer.draw();
        }
        for(let ent of lr.getRenderSortedEntities()){
            ent.draw();
        }
        lr.ui.draw();
    }
    lr.getRenderSortedEntities = function(){
        let onScreen = [];
        for(let ent of lr.entities){
            if(GRAPHICS.isOnScreen(ent.getSpriteRect())){
                onScreen.push(ent);
            }
        }
        onScreen.sort((a, b) => {
            let aY = a.position.y + a.getSpriteRect().size.y;
            let bY = b.position.y + b.getSpriteRect().size.y;
            if(aY < bY){
                return -1;
            }
            if(aY > bY){
                return 1;
            }
            return 0;
        });
        return onScreen;
    };
    lr.addEntity = function(entity){
        if(entity == null){
            return;
        }
        lr.entities.push(entity);
        lr.physics.registerCollider(entity.getCollider());
    };
    lr.destroyEntity = function(entity){
      if(entity == lr.player){
        console.log("Game over!");
      }
      // Removes entity after update loop completes.
      UTILITY.delayExecute(0, () => { lr.removeEntity(entity); });
    };
    lr.removeEntity = function(entity){
      lr.entities = lr.entities.filter((ent) => ent !== entity);
      lr.physics.unregisterCollider(entity.getCollider());
    };
    lr.notification = function(message){
        if(lr.ui){
            lr.ui.notificationsBar.notification(message);
        }
    };
    return lr;
};

LEVEL.Generate.Cell = {};
LEVEL.Generate.Cell.new = function(data, rect){
    let cg = {
        data: data,
        rect: rect,
        entities: []
    };
    cg.generate = function(){
        cg.generateEntities();
    };
    cg.getRandomPosition = function(){
        let minX = cg.rect.position.x;
        let minY = cg.rect.position.y;
        let maxX = minX + cg.rect.size.x;
        let maxY = minY + cg.rect.size.y;
        return VECTOR2.new(
            UTILITY.randRange(minX, maxX),
            UTILITY.randRange(minY, maxY)
        );
    };
    cg.placeEntityRandomly = function(entity){
        let iterations = 0;

        while(iterations < 5000){
            iterations++;
            entity.position = cg.getRandomPosition();
            if(cg.canPlace(entity)){
                iterations = 5000;
            }
        }

        cg.addEntity(entity);
    };
    cg.canPlace = function(_entity){
        for(let entity of cg.entities){
            if(_entity.collider.overlaps(entity.collider)){
                return false;
            }
        }
        return true;
    };
    cg.addEntity = function(entity){
        cg.data.entityData.push(entity.getData());
        cg.entities.push(entity);
    };
    cg.generateEntities = function(){};
    return cg;
};

// Basic rectangular camera that can be panned
GRAPHICS.Camera = {};
GRAPHICS.Camera.new = function(position, size){
  let cam = {
    rect: SHAPES.RECT.new(position, size)
  };
  cam.move = function(destination){
    if(cam.boundsCheck(destination)){
      // Valid destination
      cam.rect.position = destination;
      return;
    }
    let pos = cam.rect.position;
    let destX = VECTOR2.new(destination.x, pos.y);
    if(cam.boundsCheck(destX)){
      // Move only on x axis if possible
      cam.rect.position = destX;
      return;
    }
    let destY = VECTOR2.new(pos.x, destination.y);
    if(cam.boundsCheck(destY)){
      // Move only on y axis if possible
      cam.rect.position = destY;
      return;
    }
  };
  cam.boundsCheck = function(destination){
    let levelRect = SCENE.getLevelRect();
    if(levelRect == null){
      return true;
    }
    let rect = cam.rect.clone();
    rect.position = destination;
    return rect.isInside(levelRect);
  };
  return cam;
};

SPRITES.renderSprite = function(posX, posY, index, sheet, forceDisplayMode){
  // Assumes one horizontal strip of cells
  let offX = index * sheet.cellResolutionX;
  let offY = 0;
  let displayMode = GRAPHICS.getDisplayMode();
  if(forceDisplayMode){
    displayMode = forceDisplayMode;
  }

  // Make relative to camera
  if( displayMode == DISPLAY_MODES.camera){
    let relative = GRAPHICS.relativeToCamera(VECTOR2.new(posX, posY));
    posX = relative.x;
    posY = relative.y;
  }
  posX = GRAPHICS.scale(posX);
  posY = GRAPHICS.scale(posY);
  GRAPHICS.drawImageToImage(
      sheet.element, // Image
      offX, // X offset into image
      offY, // Y offset into image
      sheet.cellResolutionX, // sprite width
      sheet.cellResolutionY, // sprite height
      posX, // X offset drawing to canvas
      posY, // Y offset drawing to canvas
      GRAPHICS.scale(sheet.cellResolutionX), 
      GRAPHICS.scale(sheet.cellResolutionY) 
   );
};

      offY, // Y offset into image
      sheet.cellResolutionX, // sprite width
      sheet.cellResolutionY, // sprite height
      posX, // X offset drawing to canvas
      posY, // Y offset drawing to canvas

   );
};

// Increments over the animation's cells using the animation clock
SPRITES.Animator = {};
SPRITES.Animator.new = function(){
  let anr = {
    animation: null,
    index: 0,
    nextAnimation: null
  };
  anr.setAnimation = function(animation){
    if(anr.animation.name != animation.name){
      anr.animation = animation;
      anr.index = animation.startIndex;
    }
    
  };
  // Plays first animation, loops next
  anr.playAnimationOnce = function(animation, nextAnimation){
    anr.nextAnimation = nextAnimation;
    anr.setAnimation(animation);
  };
  anr.activeAnimation = function(){
    if(anr.animation){
      return anr.animation.name;
    }
    return null;
  };
  anr.update = function(posX, posY){
    for(let i = 0; i < UTILITY.framesAdvanced(); i++){
      anr.step();
    }
    if(anr.animation){
      SPRITES.renderSprite(posX, posY, anr.index, anr.animation.sheet);
    }
    else{
      UTILITY.log("SPRITES", "Invalid animation", JSON.stringify(anr.animation));
    }
  }
  anr.step = function(){
    if(SCENE.getGameState() && SCENE.getGameState() !== GAMESTATES.play){
      return;
    }
    if(anr.animation){
      anr.index++;
      if(anr.index > anr.animation.endIndex){
        if(anr.nextAnimation){
          // Switch to next animation if one's configured
          anr.setAnimation(anr.nextAnimation);
          anr.nextAnimation = null;
        }
        else{
          // Loop current animation
          anr.index = anr.animation.startIndex;
        }
      }
    }
    else{
      UTILITY.log("SPRITES", "Animator has no animation", + JSON.stringify(anr));
    }
  };
  anr.getSize = function(){
    return VECTOR2.new(anr.animation.sheet.cellResolutionX, anr.animation.sheet.cellResolutionY);
  };
  return anr;
};

GRAPHICS.centerCamera = function(point){
  let size = GRAPHICS._camera.rect.size;
  let centered = VECTOR2.new(point.x - (size.x/2), point.y - (size.y/2));
  GRAPHICS._camera.move(centered);
};

// Returns position relative to camera VECTOR2
GRAPHICS.relativeToCamera = function(point){
  //console.log("From " + point.toString() + " to " + GRAPHICS._camera.rect.position.toString());
  let pos = GRAPHICS._camera.rect.position;
  return VECTOR2.new(point.x - pos.x, point.y - pos.y);
};

GRAPHICS.scale = function(viewport_units){
  return viewport_units * GRAPHICS._scale;
};

// Scales down from screen down to viewport
GRAPHICS.downScale = function(pixels){
  return pixels / GRAPHICS._scale;
};

// returns point in worldspace where mouse is pointing
GRAPHICS.getWorldCursor = function(){
  let pos = INPUT.getMousePosition();
  if(pos){
    pos.x = GRAPHICS.downScale(pos.x);
    pos.y = GRAPHICS.downScale(pos.y);
    pos = GRAPHICS.getWorldPoint(pos);
  }
  return pos;
};

// Converts from point relative to viewport to point in absolute space
GRAPHICS.getWorldPoint = function(viewPortPoint){
  let pos = GRAPHICS._camera.rect.position;
  return pos.add(viewPortPoint);
};

  x2 = GRAPHICS.scale(x2);

  context.beginPath();
  GRAPHICS._context.imageSmoothingEnabled = false;
};

  // Top
  GRAPHICS.drawLine(x, y, x+width, y);
  // Left
  GRAPHICS.drawLine(x, y, x, y+height); 
  // Bottom
  GRAPHICS.drawLine(x, y+height, x+width, y+height);
  // Right
  GRAPHICS.drawLine(x+width, y, x+width, y+height);
  GRAPHICS._context.imageSmoothingEnabled = false;
};

  x = GRAPHICS.scale(x);
  y = GRAPHICS.scale(y);
  width = GRAPHICS.scale(width);
  height = GRAPHICS.scale(height);

STATS.Resource = {};
STATS.Resource.new = function(name, value, maxAttribute, color, transparentColor){
  let st = {
    name: name,
    value: value,
    maxAttribute: maxAttribute,
    min: 0,
    damageCooldown: null,
    lastChangeTime: null,
    lastChangeDelta: null,
    color: color,
    transparentColor: transparentColor,
    controller: null // The stats controller containing this resource
  };
  st.update = function(){
    if(st.value > st.max()){
      st.value = st.max();
    }
  };
  st.reset = function(){
    st.value = st.max();
  };
  st.clear = function(){
    st.value = st.min;
  };
  st.change = function(delta){
    if(delta > 0 && st.value == st.max()){
      // Already full
      return;
    }
    if(delta < 0 && st.value == st.min){
      // Already empty
      return;
    }
    st.value += delta;
    st.value = UTILITY.clamp(st.value);
    st.lastChangeDelta = delta;
    st.lastChangeTime = Date.now();
  };
  st.changeDelta = function(){
    return st.lastChangeDelta;
  };
  st.changeAgeSeconds = function(){
    if(st.lastChangeTime == null){
      return null;
    }
    return Math.trunc(st.changeAgeMilliseconds()/1000);
  };
  st.changeAgeMilliseconds = function(){
    if(st.lastChangeTime == null){
      return null;
    }
    let last = st.lastChangeTime;
    let now = Date.now();
    let elapsed = now - last;
    return elapsed;
  };
  st.max = function(){
    if(st.controller == null){
      UTILITY.log("STATS.Resource.max","Controller not set",{name: st.name});
      return -1;
    }
    return st.controller.getAttribute(st.maxAttribute);
  };
  st.toString = function(){
    let ret = "Stat[";
    ret += "name: " + st.name;
    ret += ", value: " + st.value;
    ret += ", max: " + st.max();
    ret += ", min: " + st.min;
    ret += ", damageCooldown: " + st.damageCooldown;
    ret += "]";
    return ret;
  };
  return st;
};

// A change over time applied to a status, such as regen or drain.
STATS.Effect.ResourceEffect.new = function(name, source, resource, delta, interval, duration){
  let se = {
    effectType: STATS.Effect.Types.Resource,
    name: name,
    source: source,
    resource: resource,
    delta: delta,
    interval: interval,
    duration: duration,
    expiration: null,
    lastApplied: null,
    blockedByEffect: null
  };
  return se;
};
STATS.StatsController = {};
STATS.StatsController.new = function(){
  let stc = {
    attributes: STATS.getDefaultAttributes(),
    resources: STATS.getDefaultResources(),
    effects: []
  };
  stc.resources[STATS.Resources.health].controller = stc;
  stc.resources[STATS.Resources.energy].controller = stc;
  stc.resources[STATS.Resources.magic].controller = stc;
  stc.getStat = function(name){
    if(stc.attributes[name]){
      return stc.attributes[name];
    }
    if(stc.resources[name]){
      return stc.resources[name];
    }
    return null;
  };
  stc.getResourceValue = function(resource){
    if(stc.resources[resource]){
      return stc.resources[resource].value;
    }
  };
  stc.changeResource = function(resource, delta){
    if(stc.resources[resource]){
      stc.resources[resource].change(delta);
    }    
  };
  stc.getAttribute = function(attribute){
    if(stc.attributes[attribute]){
      let atr = stc.attributes[attribute];
      return atr.value + atr.modifier;
    }
  };
  stc.setAttributeValue = function(attribute, newValue){
    if(stc.attributes[attribute]){
      stc.attributes[attribute].value = newValue;
    }
  };
  stc.changeAttributeModifier = function(attribute, modifier){
    if(stc.attributes[attribute]){
      let prev = stc.attributes[attribute].modifier;
      stc.attributes[attribute].modifier += modifier;      
    }
  };
  stc.getEffect = function(name, source){
    for(let effect of stc.effects){
      if(effect.name === name && effect.source === source){
        return effect;
      }
    }
    return null;
  };
  stc.addEffects = function(effects){
    if(effects == null){
      return;
    }
    for(let _effect of effects){
      stc.addEffect(_effect);
    }
  };
  stc.addEffect = function(_effect){
    if(_effect == null){
      return;
    }
    if(_effect.duration){
      _effect.expiration = _effect.duration + Date.now();
    }
    // Re-adding the same effect just updates it
    let existing = null;
    for(let effect of stc.effects){
      if(effect.name === _effect.name && effect.source === _effect.source){
        existing = effect;
      }
    }
    if(existing){
      existing = _effect;
      return;
    }
    if(_effect.effectType === STATS.Effect.Types.Attribute){
      // Apply the attribute
      stc.changeAttributeModifier(_effect.attribute, _effect.modifier);
    }
    stc.effects.push(_effect);
  };
  stc.removeEffect = function(name, source){
    let effect = stc.getEffect(name, source);
    stc.effects = stc.effects.filter((ef) => !(ef.name === name && ef.source === source));
    if(effect.effectType === STATS.Effect.Types.Attribute){
      let inverseDelta = effect.modifier * -1;
      stc.changeAttributeModifier(effect.attribute, inverseDelta);
    }
    stc.resources[STATS.Resources.health].update();
    stc.resources[STATS.Resources.energy].update();
    stc.resources[STATS.Resources.magic].update();
  };
  stc.update = function(){
    stc.updateEffects();
  };
  stc.updateEffects = function(){
    for(let effect of stc.effects){
      if(effect.effectType === STATS.Effect.Types.Resource){
        stc.updateResourceEffect(effect);
      }
      if(effect.effectType === STATS.Effect.Types.Attribute){
        stc.updateAttributeEffect(effect);
      }
    }
  };
  stc.isBlockerPresent = function(effectName){
    for(let effect of stc.effects){
      if(effectName === effect.name){
        return true;
      }
    }
    return false;
  };
  stc.getActiveFoods = function(){
    let foodEffects = {};
    for(let effect of stc.effects){
      if(effect.source.includes(SETTINGS.foodPrefix)){
        // De-dupes by adding to object this way
        foodEffects[effect.source] = effect;
      }
    }
    let foods = [];
    let now = Date.now();
    for(let source of Object.keys(foodEffects)){
      let effect = foodEffects[source];
      let foodName = source.replace(SETTINGS.foodPrefix, "");
      let foodItem = ITEMS.getByName(foodName);
      let remainingTime = effect.expiration - now;
      let food = STATS.FoodStatus.new(foodName, foodItem.sprite, remainingTime);
      foods.push(food);
    }
    foods.sort((a, b) => {
            if(a.remaining < b.remaining){
                return -1;
            }
            if(a.remaining > b.remaining){
                return 1;
            }
            return 0;
    });
    return foods;
  }
  stc.updateResourceEffect = function(effect){
    // Effects apply their delta only after the interval passes
    if(effect.lastApplied == null){
      effect.lastApplied = Date.now();
      return;
    }
    let now = Date.now();
    if(effect.expiration != null && now > effect.expiration){
      stc.removeEffect(effect.name, effect.source);
    }

    let elapsed = now - effect.lastApplied;
    if(elapsed >= effect.interval){
      effect.lastApplied = Date.now();
      if(effect.blockedByEffect && stc.isBlockerPresent(effect.blockedByEffect)){
        // Effect is blocked. Do not apply changes.
        return;
      }
      stc.changeResource(effect.resource, effect.delta);

      return;
    }
  };
  stc.updateAttributeEffect = function(effect){
    let now = Date.now();
    if(now > effect.expiration){
      stc.removeEffect(effect.name, effect.source);
    }
  };
  stc.fullRestore = function(){
    stc.health.reset();
    stc.energy.reset();
    stc.magic.reset();
  };
  return stc;
};

/*##############################################################################
# Factory for Items
##############################################################################*/
ITEMS.create = function(name, quantity, durability){
    let item = ITEMS.getByName(name);
    if(item == null){
        UTILITY.log("ITEMS.create", "Could not find item: " + name, { name: name, quantity: quantity });
    }
    item = item.clone();
    if(quantity && quantity > 0 && item.stackSize > 0){
        item.quantity = quantity;
    }
    if(durability && durability > 0 && item.durabilityMax > 0){
        item.durability = durability;
    }
    return item;
};

/*##############################################################################
# An inventory with slots, each containing stacks of items
##############################################################################*/
ITEMS.Inventory = {};
ITEMS.Inventory.new = function(size){
    let inv = {
        slots: [],
        size: size,
        activeSlot: 0
    };
    for(let i = 0; i < size; i++){
        inv.slots.push(null);
    };
    inv.removeItem = function(item){
        for(let i = 0; i < inv.slots.length; i++){
            let slotItem = inv.slots[i];
            if(item == slotItem){
                inv.slots[i] = null;
            }
        }
    };
    inv.getActiveItem = function(){
        if(inv.activeSlot == -1){
            return null;
        }
        return inv.slots[inv.activeSlot];
    };
    inv.getItem = function(slot){
        if(slot > -1 && slot < inv.size){
            return inv.slots[slot];
        }
        return null;
    };
    inv.setItem = function(slot, item){
        if(slot > -1 && slot < inv.size){
            inv.slots[slot] = item;
        }
    };
    // Returns overflow quantity
    inv.pickUp = function(_item){
        let item = _item.clone();
        if(item.stackSize > 0){
            item.quantity = inv.stackItem(item);
        }
        if(item.quantity > 0){
            let slot = inv.findEmptySlot();
            if(slot > -1){
                inv.slots[slot] = item.clone();
                return 0;
            }
        }
        return item.quantity;
    };
    // Returns quantity overflow after adding item stacks to existing stacks
    inv.stackItem = function(_item){
        let item = _item.clone();
        let stackingSlot = inv.findStackingSlot(item);
        while(stackingSlot > -1 && item.quantity > 0){
            item.quantity = inv.slots[stackingSlot].stack(item.quantity);
            stackingSlot = inv.findStackingSlot(item);
        }
        return item.quantity;
    };
    inv.findStackingSlot = function(item){
        for(let i = 0; i< inv.slots.length; i++){
            if(inv.slots[i] && inv.slots[i].name === item.name && inv.slots[i].stackSpace() > 0){
                return i;
            }
        }
        return -1;
    };
    inv.findEmptySlot = function(){
        for(let i = 0; i< inv.slots.length; i++){
            if(inv.slots[i] == null){
                return i;
            }
        }
        return -1;
    }
    return inv;
};

// inherits base entity
ACTOR.new = function(){
  let atr = ENTITY.baseEntity.new();
  atr.stateMachine = null;
  atr.prevPosition = VECTOR2.new(0, 0);
  atr.direction = DIRECTIONS.east;
  atr.prevDirection = DIRECTIONS.east;
  atr.moving = false;
  atr.prevMoving = false;
  atr.size = 32;
  atr.lockCamera = false;
  atr.attacks = [];
  atr.activeAttack = null;
  atr.cooldown = true;
  atr.stats = null;
  atr.hotbar = ITEMS.Inventory.new(9);
  atr.inventory = ITEMS.Inventory.new(27);
  atr.damageLabel = null;
  atr.damageLabelFrames = 0;
  atr.update = function(){
    atr.stateMachine.update();
    atr.agent.update();
    if(atr.lockCamera && GRAPHICS.getDisplayMode() == DISPLAY_MODES.camera){
      GRAPHICS.centerCamera(VECTOR2.new(atr.position.x, atr.position.y));
    }
    if(atr.stats){
      atr.stats.update();
    }
  };
  atr.teleport = function(destination){
    atr.position = destination;
    atr.prevPosition = destination;
  };
  atr.move = function(direction){
    // No moving while attacking
    if(!atr.cooldown){
      return;
    }
    atr.moving = true;
    let speed = atr.stats.getAttribute(STATS.Attributes.speed);
    let dest = VECTOR2.new(atr.position.x, atr.position.y);
    
    switch(direction){
      case DIRECTIONS.north:
        dest.y -= speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.south:
        dest.y += speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.east:
        dest.x += speed;
        atr.direction = direction;
      break;
      case DIRECTIONS.west:
        dest.x -= speed;
        atr.direction = direction;
      break;
    }
    if(atr.collider.moveAndCollideShort(dest)){
      return;
    }
  };
  atr.destroyItem = function(item){
    atr.hotbar.removeItem(item);
    atr.inventory.removeItem(item);
  };
  atr.draw = function(){
    if(!GRAPHICS.isOnScreen(atr.getSpriteRect())){
      // Don't render when off screen
      return;
    }
    atr.animator.update(atr.position.x, atr.position.y);
    if(atr.label != ""){
      GRAPHICS.drawTextRelative(atr.label, atr.position.x, atr.position.y + atr.size + SETTINGS.defaultFontSize);
    }
    if(atr.damageLabel && atr.damageLabel != "" && atr.damageLabelFrames > 0){
      GRAPHICS.drawTextRelative(atr.damageLabel, atr.position.x, atr.position.y + SETTINGS.defaultFontSize, "red");
    }
    if(atr.damageLabelFrames > 0){
      atr.damageLabelFrames -= 1;
    }
  };
  atr.attack = function(){
    if(!atr.cooldown){
      return;
    }
    let atk = atr.activeAttack;
    

    // Execute immediately
    atr.cooldown = false;
    atr.stateMachine.startAttack(atk);

    // Execute attack hitscans at specific timing.
    for(let damageFrame of atk.damageFrames){
      if(damageFrame == 0){
        // Deal damage now
        atr.attackHitscan(atk);
      }
      else{
        // Deal damage later
        UTILITY.delayExecute(damageFrame, () => {
          atr.attackHitscan(atk);
        });
      }
    }
    
    // Execute at end of attack
    UTILITY.delayExecute(atk.frames, () => {
      atr.cooldown = true;
    });
    
  };
  atr.canSprint = function(){
    if(atr.stats == null){
      // No stats, no problems!
      return true;
    }
    if(atr.stats.getEffect(STATS.Effect.Names.Sprinting, STATS.Effect.Sources.Body)){
      // You're already sprinting.
      return false;
    }
    let energy = atr.stats.getResourceValue(STATS.Resources.energy);
    if(energy > 0){
      // You can afford to sprint
      return true;
    }
    // You can't afford it
    return false;
  };
  // Call this each frame before moving
  atr.sprint = function(){
    if(!atr.canSprint()){
      return;
    }
    let cost = STATS.Effect.SprintCost();
    let buff = STATS.Effect.SprintBuff();
    atr.stats.addEffect(cost);
    atr.stats.addEffect(buff);
  };
  atr.attackHitscan = function(atk){

    let dest = atr.centeredPosition().move(atr.direction, atr.size);
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(atr.size, atr.size));
    rect.recenter(dest);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    let attackData = ACTOR.AttackData.new(atr.direction, -atk.damage, atr, { knockback: 10 });
    for(let cl of colliders){
      cl.parent.onAttacked(attackData);
    }
  };
  atr.interact = function(){
    let dest = atr.centeredPosition().move(atr.direction, atr.size);
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(atr.size, atr.size));
    rect.recenter(dest);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    for(let cl of colliders){
      cl.parent.onInteract(UTILITY.Interaction.new(atr));
    }
  };
  atr.interactAtPoint = function(point){
    let halfSize = atr.size/2;
    let rect = SHAPES.RECT.new(VECTOR2.new(0,0), VECTOR2.new(halfSize, halfSize));
    rect.recenter(point);

    let colliders = atr.collider.controller.rectHitScan([atr.getEntityId()], rect);
    for(let cl of colliders){
      cl.parent.onInteract(UTILITY.Interaction.new(atr));
    }
  };
  atr.onCollide = function(collision){};
  atr.onAttacked = function(attackData){
    if(atr.stats){
      if(atr.stats.damageCooldown == null || atr.stats.damageCooldown < Date.now()){
        atr.stats.damageCooldown = Date.now() + SETTINGS.damageCooldown;
      }
      else{
        //console.log("Ignoring attack until cooldown finishes");
        return;
      }
      let health = atr.stats.getStat(STATS.Resources.health);
      let prevHealth = health.value;
      health.change(attackData.damage);
      atr.damageLabel = attackData.damage + "";
      atr.damageLabelFrames = 12;
      //console.log(atr.name + " attacked for " + attackData.damage + " and now has " + atr.stats.health.value + " health.");
      if(health.value < 1){
        atr.die();
      }
      if(attackData.knockback > 0){
        //console.log("Being knocked back in direction" + attackData.direction);
        atr.onKnockback(attackData.direction, attackData.knockback);
      }
    }
  };
  atr.onInteract = function(interaction){};
  atr.cursorInRange = function(){
    let pos = GRAPHICS.getWorldCursor();
    let actorPos = atr.centeredPosition();
    let distance = pos.distance(actorPos);
    return distance < SETTINGS.interactionRange;
  };
  atr.pickUp = function(_item){
    let item = _item.clone();
    item.quantity = atr.hotbar.pickUp(item);
    if(item.quantity > 0){
      item.quantity = atr.inventory.pickUp(item);
    }
    return item.quantity;
  };
  atr.useItem = function(){
    let item = atr.hotbar.getActiveItem();
    if(item == null){
      console.log("No item selected");
      return;
    }
    console.log("Using item: " + item.name);
    item.use(atr);
  };
  atr.eat = function(item){
    if(!atr.canEat(item)){
      return;
    }
    atr.stats.addEffects(item.effects);
  }
  atr.canEat = function(item){
    if(item.type != ITEMS.Types.Food){
      return false;
    }
    if(atr.getActiveFoods().length > 2){
      UTILITY.notification("You're full.");
      return false;
    }
    for(let food of atr.getActiveFoods()){
      if(food.name == item.name){
        UTILITY.notification("You can't eat more of that food right now.");
        return false;
      }
    }
    return true;
  };
  atr.getActiveFoods = function(){
    return atr.stats.getActiveFoods();
  };
  atr.getSpriteRect = function(){
    return SHAPES.RECT.new(
      atr.position,
      atr.animator.getSize()
    );
  };
  atr.toString = function(){
    let str = "[";
    str += "ID: " + atr.entityId;
    str += ", pos: " + atr.position.toString();
    str += "]";
    return str;
  }
  return atr;
};

/*##############################################################################
# Determines which animations play for an actor
##############################################################################*/

ACTOR.AnimationStateMachine = {};
ACTOR.AnimationStateMachine.new = function(name, animations, animator){
  let asm = {
    entityId: -1,
    name: name,
    currentAnimation: null,
    animations: animations,
    animator: animator,
    moving: false,
    direction: DIRECTIONS.north,
    attack: null
  };

  asm.linkToActor = function(actor){
    asm.actor = actor;
  };

  asm.getNextAnimationName = function(){
    let nextAnimation = null;
    if(asm.attack){
      let atk = asm.attack;
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = atk.upAnimation;
          break;
        case DIRECTIONS.south:
          nextAnimation = atk.downAnimation;
          break;
        case DIRECTIONS.east:
          nextAnimation = atk.rightAnimation;
          break;
        case DIRECTIONS.west:
          nextAnimation = atk.leftAnimation;
          break;
      }
    }
    else if(asm.actor.moving){
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = ACTOR_ANIMATIONS.walkUp;
          break;
        case DIRECTIONS.south:
          nextAnimation = ACTOR_ANIMATIONS.walkDown;
          break;
        case DIRECTIONS.east:
          nextAnimation = ACTOR_ANIMATIONS.walkRight;
          break;
        case DIRECTIONS.west:
          nextAnimation = ACTOR_ANIMATIONS.walkLeft;
          break;
      }
    }
    else{
      switch(asm.actor.direction){
        case DIRECTIONS.north:
          nextAnimation = ACTOR_ANIMATIONS.idleUp;
          break;
        case DIRECTIONS.south:
          nextAnimation = ACTOR_ANIMATIONS.idleDown;
          break;
        case DIRECTIONS.east:
          nextAnimation = ACTOR_ANIMATIONS.idleRight;
          break;
        case DIRECTIONS.west:
          nextAnimation = ACTOR_ANIMATIONS.idleLeft;
          break;
      }
    }
    return nextAnimation;
  };

  asm.update = function(){
    let nextAnimation = asm.getNextAnimationName();
    if(nextAnimation && asm.animations[nextAnimation]){
      asm.animator.setAnimation(asm.animations[nextAnimation]);
    }
    else{
      let obj = {
        nextAnimation: nextAnimation,
        ref: asm.animations[nextAnimation]
      };
      UTILITY.log("ACTOR" + "nextanimation invalid" + JSON.stringify(obj));
    }
  };

  asm.startAttack = function(attack, frames){
    asm.attack = attack;
    UTILITY.delayExecute(attack.frames, () => { asm.attack = null; });
  };
  return asm;
};

SHAPES.RECT = {};
SHAPES.RECT.new = function(position, size){
    let rect = {
        position: position, // Top left corner
        size: size
    };
    rect.center = function(){
        return VECTOR2.new(
            rect.position.x + rect.size.x/2,
            rect.position.y + rect.size.y/2
        );
    };
    rect.extents = function(){
        return VECTOR2.new(
            rect.position.x+rect.size.x,
            rect.position.y+rect.size.y
        );
    };
    rect.topRight = function(){
        return VECTOR2.new(
            rect.position.x+rect.size.x,
            rect.position.y
        );
    };
    rect.topLeft = function(){
        return rect.position;
    };
    rect.bottomRight = function(){
        return rect.extents();
    };
    rect.bottomLeft = function(){
        return VECTOR2.new(
            rect.position.x,
            rect.position.y+rect.size.y
        );
    };
    rect.rightEdge = function(){
        return SHAPES.Line.new(rect.topRight(), rect.bottomRight());
    };
    rect.leftEdge = function(){
        return SHAPES.Line.new(rect.topLeft(), rect.bottomLeft());
    };
    rect.topEdge = function(){
        return SHAPES.Line.new(rect.topLeft(), rect.topRight());
    };
    rect.bottomEdge = function(){
        return SHAPES.Line.new(rect.bottomLeft(), rect.bottomRight());
    };
    rect.getEdges = function(){
        let edges = [];
        edges.push(rect.rightEdge());
        edges.push(rect.leftEdge());
        edges.push(rect.topEdge());
        edges.push(rect.bottomEdge());
        return edges;
    };
    // Returns polygonal points
    rect.getPoints = function(){
        let points = [
            rect.topLeft(),
            rect.topRight(),
            rect.bottomLeft(),
            rect.bottomRight()
        ];
        return points;
    };
    rect.contains = function(point){
        let tl = rect.topLeft();
        let br = rect.bottomRight();
        if(point.x >= tl.x && point.x <= br.x){
            if(point.y >= tl.y  && point.y <= br.y){
                return true;
            }
        }
        return false;
    };
    rect.isInside = function(otherRect){
        return otherRect.contains(rect.topLeft()) &&
            otherRect.contains(rect.topRight()) &&
            otherRect.contains(rect.bottomLeft()) &&
            otherRect.contains(rect.bottomRight());
    };
    rect.overlaps = function(otherRect){
        let tl1 = rect.topLeft();
        let br1 = rect.bottomRight();
        let tl2 = otherRect.topLeft();
        let br2 = otherRect.bottomRight();

        let above = tl1.y > br2.y;
        let below = tl2.y > br1.y;
        let toRight = tl1.x > br2.x;
        let toLeft = tl2.x > br1.x;
        if(above || below || toRight || toLeft){
            return false;
        }
        return true;
    };
    rect.recenter = function(point){
        let halfSize = VECTOR2.new(rect.size.x/2, rect.size.y/2);
        rect.position = VECTOR2.new(point.x-halfSize.x, point.y-halfSize.y);
    };
    rect.toString = function(){
        let ret = "Rect[";
        ret += rect.position.toString();
        ret += ", " + rect.size.toString();
        ret += "]";
        return ret;
    };
    rect.clone = function(){
        return SHAPES.RECT.new(rect.position.clone(), rect.size.clone());
    };

    return rect;
};
// Assuming only box colliders will exist.
PHYSICS.BoxCollider = {};
PHYSICS.BoxCollider.new = function(){
    let bc = {
        parent: null,
        rigid: true,
        // rect is relative to parent entity
        rect: SHAPES.RECT.new(VECTOR2.new(0, 0), VECTOR2.new(0, 0)),
        controller: null
    };
    // Account for parent position
    bc.absoluteRect = function(){
        let pos = bc.rect.position;
        if(bc.parent){
            let ppos = bc.parent.getPosition();
            pos = VECTOR2.new(ppos.x+pos.x, ppos.y+pos.y);
        }
        let size = bc.rect.size;
        let rect = SHAPES.RECT.new(pos, size);
        return rect;
    };
    bc.contains = function(point){
        let rect = bc.absoluteRect();
        return rect.contains(point);
    };
    bc.isInside = function(otherRect){
        let rect = bc.absoluteRect();
        return rect.isInside(otherRect);
    };
    // Assumes another box collider
    bc.overlaps = function(otherCollider){
        let rect = bc.absoluteRect();
        let otherRect = otherCollider.absoluteRect();
        return otherRect.overlaps(rect);    
    };
    // Check if collider would remain within the level if moved
    bc.boundsCheck = function(destination){
        let levelRect = SCENE.getLevelRect();
        if(levelRect == null){
            return true;
        }
        let rect = bc.absoluteRect();
        rect.position = destination;
        return rect.isInside(levelRect);
    };
    // Makes one check, assuming distance is less than scale
    bc.moveAndCollideShort = function(destination, suppressCollisionEvents){
        if(bc.controller == null || bc.parent == null){
            UTILITY.log("BoxCollider.moveAndCollide()", "BoxCollider not assigned to physics controller.", { controller: bc.controller == null, parent: bc.parent == null});
            return null;
        }
        if(!bc.boundsCheck(destination)){
            // Don't move out of bounds.
            return null;
        }
        let previous = bc.parent.getPosition();
        bc.parent.setPosition(VECTOR2.new(destination.x, destination.y));
        let excludeList = [];
        excludeList.push(bc.parent.getEntityId());
        let ret = bc.controller.checkForCollision(excludeList, bc);
        if(suppressCollisionEvents){
            return ret;
        }
        if(ret){
            if(ret.second.rigid){
                //revert upon collision with rigid collider
                bc.parent.setPosition(previous);
                
            }
            // Emit collision events
            bc.parent.onCollide(ret);
            if(ret.second && ret.second.parent){
                ret.second.parent.onCollide(ret);
            }
            return ret;
        }
        return null;
    };
    bc.resize = function(updatedSize){
        bc.rect.size = updatedSize.clone();
    };
    bc.reposition = function(updatedPosition){
        bc.rect.position = updatedPosition.clone();
    };
    bc.toString = function(){
        let parent = "null";
        if(bc.parent){
            parent = bc.parent.getName();
        }
        let ret = "BoxCollider[Parent: " + parent;
        ret += ", " + bc.absoluteRect().toString() + "]";
        return ret;
    };
    return bc;
};
PHYSICS.Collision = {};
PHYSICS.Collision.new = function(first, second){
    let col = {
        first: first, // Collider initiating collision
        second: second // Collider
    };
    col.toString = function(){
        let ret = "Collision[";
        ret += col.first.toString();
        ret += ", " + col.second.toString();
        ret += "]";
        return ret;

};
PHYSICS.Controller = {};
PHYSICS.Controller.new = function(){
    let ctl = {
        colliders: [],
        rigidColliders: [],
        collisionGrid: null
    };
    ctl.registerCollider = function(collider){
        ctl.colliders.push(collider);
        collider.controller = ctl;
    };
    ctl.unregisterCollider = function(collider){
        ctl.colliders = ctl.colliders.filter((cl) => cl !== collider);
    };
    ctl.checkForCollision = function(excludeList, collider){
        // Used by BoxCollider.moveAndCollideShort()
        let colliders = ctl.getLocalColliders(collider.absoluteRect().position);
        for(let cl of colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                if(cl.parent.getEntityId() == 1){
                    let str = cl.toString() + ", " + collider.toString() + ", " + collider.overlaps(cl);
                };
                if(collider.overlaps(cl)){
                    let col = PHYSICS.Collision.new(collider, cl);
                    return col;
                }
            }         
        }
        return null;
    };
    ctl.getLocalColliders = function(point){
        if(ctl.collisionGrid){
            return ctl.collisionGrid.getLocalColliders(point);
        }
        return ctl.rigidColliders;
    };
    ctl.getCollidersByPoint = function(excludeList, point){
        let cols = [];
        for(let cl of ctl.colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                if(cl.contains(point)){
                    cols.push(cl);
                }
            }
        }
        return cols;
    };
    ctl.rectHitScan = function(excludeList, rect){
        let cols = [];
        for(let cl of ctl.colliders){
            if(cl.parent && !excludeList.includes(cl.parent.getEntityId())){
                let otherRect = cl.absoluteRect();
                if(otherRect.overlaps(rect)){
                    cols.push(cl);
                }
            }
        }
        return cols;
    };
    // Call this each frame before collision checks are made
    ctl.update = function(){
        ctl.refreshRigidCollidersList();
        ctl.refreshCollisionGrid();
    };
    ctl.refreshRigidCollidersList = function(){
        ctl.rigidColliders = [];
        for(let collider of ctl.colliders){
            if(collider.rigid){
                ctl.rigidColliders.push(collider);
            }
        }
    };
    ctl.refreshCollisionGrid = function(){
        let size = Math.ceil((SETTINGS.DefaultLevelTileSize * SETTINGS.DefaultLevelSize) / PHYSICS.CollisionCellSize);
        ctl.collisionGrid = PHYSICS.CellGrid.new(ctl.rigidColliders, size);
    };
    return ctl;
};
var VECTOR2 = {};
VECTOR2.new = function(x, y){
    let v2 = {
        x: x,
        y: y
    };
    v2.equals = function(other){
        return v2.x == other.x && v2.y == other.y;
    };
    v2.distance = function(point){
        var a = v2.x - point.x;
        var b = v2.y - point.y;

        return Math.sqrt( a*a + b*b );
    }
    v2.add = function(otherVector){
        return VECTOR2.new(v2.x + otherVector.x, v2.y + otherVector.y);
    };
    v2.multiply = function(otherVector){
        return VECTOR2.new(v2.x * otherVector.x, v2.y * otherVector.y);
    }
    v2.toString = function(){
        return "{" + v2.x + ", " + v2.y + "}";
    };
    v2.move = function(direction, magnitude){
        let ret = VECTOR2.new(v2.x, v2.y);
        switch(direction){
          case DIRECTIONS.north:
            ret.y -= magnitude;
          break;
          case DIRECTIONS.south:
            ret.y += magnitude;
          break;
          case DIRECTIONS.east:
            ret.x += magnitude;
          break;
          case DIRECTIONS.west:
            ret.x -= magnitude;
          break;
        }
        return ret;
    };
    v2.clone = function(){
        return VECTOR2.new(v2.x, v2.y);
    };
    return v2;
};
VECTOR2.vectorFromDirection = function(direction){
    switch(direction){
        case DIRECTIONS.none:
            return VECTOR2.new(0, 0);
        break;
        case DIRECTIONS.north:
            return VECTOR2.north();
        break;
        case DIRECTIONS.south:
            return VECTOR2.south();
        break;
        case DIRECTIONS.east:
            return VECTOR2.east();
        break;
        case DIRECTIONS.west:
            return VECTOR2.west();
        break;
    }
};
VECTOR2.north = function(){ return VECTOR2.new(0, 1); };
VECTOR2.south = function(){ return VECTOR2.new(0, -1); };
VECTOR2.east = function(){ return VECTOR2.new(1, 0); };
VECTOR2.west = function(){ return VECTOR2.new(-1, 0); };
VECTOR2.northWest = function(){ return VECTOR2.new(-1, 1); };
VECTOR2.northEast = function(){ return VECTOR2.new(1, 1); };
VECTOR2.southWest = function(){ return VECTOR2.new(-1, -1); };
VECTOR2.southEast = function(){ return VECTOR2.new(1, -1); };


UTILITY.isInsideBox = function(topLeft, bottomRight, point){
  var inX = point.x < bottomRight.x && point.x > topLeft.x;
  var inY = point.y < bottomRight.y && point.y > topLeft.y;
  return inX && inY;
};
SHAPES.Line = {};
SHAPES.Line.new = function(origin, terminus){
    let line = {
        origin: origin,
        terminus: terminus
    };
    line.intersection = function(other){
        let x1 = line.origin.x;
        let y1 = line.origin.y;
        let x2 = line.terminus.x;
        let y2 = line.terminus.y;
        let x3 = other.origin.x;
        let y3 = other.origin.y;
        let x4 = other.terminus.x;
        let y4 = other.terminus.y;

        let denominator = ((y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1));

        // If denominator is 0, the lines are parallel or collinear
    if (denominator === 0) {
        return null;
    }

    let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denominator;
    let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denominator;

    // Is the intersection point along both segments?
    if (ua < 0 || ua > 1 || ub < 0 || ub > 1) {
        return null;
    }

    // Calculate the absolute x and y coordinates of the intersection
    let x = x1 + ua * (x2 - x1);
    let y = y1 + ua * (y2 - y1);

    return VECTOR2.new(x, y);
    };
    return line;
};
// Divide the map up into cells for faster collision scans
PHYSICS.CellGrid = {};
PHYSICS.CollisionCellSize = 400;
PHYSICS.CellGrid.new = function(colliders, size){
    let grid = {
        size: size,
        cells: []
    };

    grid.init = function(){
        for(let i = 0; i< size*size; i++){
            grid.cells.push([]);
        }
        for(let collider of colliders){
            let cellIndex = grid.posToCellIndex(collider.absoluteRect().position);
            grid.cells[cellIndex].push(collider);
        }
    };
    grid.posToCellIndex = function(position){
        let cellSize = PHYSICS.CollisionCellSize;
        let gridX = Math.floor(position.x / cellSize);
        let gridY = Math.floor(position.y / cellSize);
        return gridX + (grid.size * gridY)
    };
    grid.getLocalColliders = function(point){
        let index = grid.posToCellIndex(point);
        return grid.cells[index];
    };
    grid.init();
    return grid;
};

AGENT.PLAYER_ONE.new = function(actor){
    var pone = {
        actor: actor,
        keyPresses: {}
    };
    for(let i in KEY_PRESSES_USED){
        let key = KEY_PRESSES_USED[i];
        pone.keyPresses[key] = false;
    }

    pone.update = function (){
        // TODO: move code currently in GAME.mouseDown here to break tight coupling
        let atr = pone.actor;
        let aId = atr.entityId;
        if(INPUT.key(INPUT.KEYS.K_LEFT_SHIFT)){
            atr.sprint();
        }
        let x_movement = 0;
        let y_movement = 0;
        let k_w = INPUT.key(INPUT.KEYS.K_W) ? 1 : 0;
        let k_s = INPUT.key(INPUT.KEYS.K_S) ? 1 : 0;
        let k_a = INPUT.key(INPUT.KEYS.K_A) ? 1 : 0;
        let k_d = INPUT.key(INPUT.KEYS.K_D) ? 1 : 0;

        // Net inputs
        let x = k_d - k_a;
        let z = k_w - k_s; // Invert

        if(x == 0 && z == 0){
            if(atr.moving){
                atr.moving = false; 
            }
        }
        else{
            if(x < 0){
                atr.move(DIRECTIONS.west);
            }
            else if(x > 0){
                atr.move(DIRECTIONS.east);
            }
            if(z < 0){
                atr.move(DIRECTIONS.south);
            }
            else if(z > 0){
                atr.move(DIRECTIONS.north);
            }
        }
        let inRange = atr.cursorInRange();
        if(INPUT.keyPress(INPUT.KEYS.K_M)){
            SCENE.setActiveScene(SCENE.SCENES.WorldMap());
        }
        if(INPUT.keyPress(INPUT.KEYS.K_SPACE) || (inRange && INPUT.mouseClick(INPUT.LEFT_CLICK))){
            atr.attack();           
        }
        if(INPUT.keyPress(INPUT.KEYS.K_E)){
            atr.interact();         
        }
        if(INPUT.keyPress(INPUT.KEYS.K_F)){
            atr.useItem();
        }
        if(inRange && INPUT.mouseClick(INPUT.RIGHT_CLICK)){
            let point = INPUT.getMousePosition();
            point.x = GRAPHICS.downScale(point.x);
            point.y = GRAPHICS.downScale(point.y);
            let worldPoint = GRAPHICS.getWorldPoint(point);
            atr.interactAtPoint(worldPoint);
        }
    };
    return pone;
};

ITEMS.BaseItem = {};
ITEMS.BaseItem.new = function(){
    let item = {
        type: ITEMS.Types.Base,
        name: "",
        description: "",
        sprite: null,
        quantity: 0,
        stackSize: 0, // Leave 0 to disable stacking
        durability: 0,
        durabilityMax: 0, // Leave 0 for infinite durability
        inventory: null // The inventory this item is inside
    };
    // quantity left in this stack
    item.stackSpace = function(){
        if(item.stackSize == 0 || item.quantity == item.stackSize){
            return 0;
        }
        else{
            return item.stackSize - item.quantity;
        }
    };
    item.stack = function(quantity){
        item.quantity += quantity;
        let overflow = item.quantity - item.stackSize;
        if(overflow > 0){
            item.quantity = item.stackSize;
        }
        if(overflow < 0){
            return 0;
        }
        return overflow;
    };
    item.use = function(){};
    item.clone = function(){
        let clone = ITEMS.BaseItem.new();
        clone.name = item.name;
        clone.description = item.description;
        clone.sprite = item.sprite;
        clone.quantity = item.quantity;
        clone.stackSize = item.stackSize;
        clone.durability = item.durability;
        clone.durabilityMax = item.durabilityMax;
        return clone;
    };
    return item;
};

ITEMS.Food.new = function(){
    let f = ITEMS.BaseItem.new();
    f.type = ITEMS.Types.Food;
    f.effects = [];
    f.use = function(actor){
        if(!actor.canEat(f)){
            return;
        }
        actor.eat(f);
        f.quantity--;
        if(f.quantity < 1){
            actor.destroyItem(f);
        }
    };
    f.clone = function(){
        let clone = ITEMS.Food.new();
        clone.name = f.name;
        clone.description = f.description;
        clone.sprite = f.sprite;
        clone.quantity = f.quantity;
        clone.stackSize = f.stackSize;
        clone.durability = f.durability;
        clone.durabilityMax = f.durabilityMax;
        clone.effects = f.effects;
        return clone;
    };
    return f;
};

SCENE.SCENES.Start = function(){
    let st = SCENE.SCENES.BaseScene();
    st.name = "Start";
    st.setup = false;

    st.drawStartButton = function(){
        GRAPHICS.drawBox(100, 100, 100, 100);
        GRAPHICS.drawText("Start", 100, 150);
        if(this.isStartButtonSelected()){
            GRAPHICS.drawLine(0, 0, 100, 100);
            GRAPHICS.drawLine(0, 500, 100, 200);
            GRAPHICS.drawLine(500, 0, 200, 100);
            GRAPHICS.drawLine(500, 500, 200, 200);
        }
    };

    st.update = function(){
        if(st.setup == false){
            GRAPHICS.setDisplayMode(DISPLAY_MODES.static);
            st.setup = true;
        }
        GRAPHICS.clearCanvas();
        this.drawStartButton();
        if(INPUT.mouseClick(INPUT.LEFT_CLICK) && this.isStartButtonSelected()){
            SCENE.setActiveScene(SCENE.SCENES.Game());
        }
    };

    st.isStartButtonSelected = function(){
        var boxTopLeft = { x: GRAPHICS.scale(100), y: GRAPHICS.scale(100) };
        var boxBottomRight = { x: GRAPHICS.scale(200), y: GRAPHICS.scale(200)};
        var point = INPUT.getMousePosition();
        if(!point){
          return false;
        }
        if(typeof point === "undefined"){
            return false;
        }
        return UTILITY.isInsideBox(boxTopLeft, boxBottomRight, point);
    };
    return st;
};

/*##############################################################################
# Shows the health, energy, and magic of the player
##############################################################################*/
UI.COMPONENTS.StatusBar = {};
UI.COMPONENTS.StatusBar.new = function(){
    let sbRect = SHAPES.RECT.new(
        VECTOR2.new(320, 320),
        VECTOR2.new(80, 80)
    );
    let sprite = SPRITES.static.statusbar.statusbar;    
    let sb = UI.COMPONENTS.BaseComponent.new(sbRect, sprite);
    sb.stats = null;
    sb.recentThreshold = 3;
    sb.blinkDuration = 250;
    sb.healthRect = SHAPES.RECT.new(
        VECTOR2.new(6, 6),
        VECTOR2.new(20, 50)
    );
    sb.energyRect = SHAPES.RECT.new(
        VECTOR2.new(30, 6),
        VECTOR2.new(20, 50)
    );
    sb.magicRect = SHAPES.RECT.new(
        VECTOR2.new(53, 6),
        VECTOR2.new(21, 50)
    );
    sb.linkActor = function(actor){
        sb.stats = actor.stats;
    };
    sb.draw = function(){
        if(sb.stats == null){
            return;
        }
        if(!sb.isChangedRecently() && SCENE.getGameState() == GAMESTATES.play){
            // Hide unless the inventory menu's already up
            // or something's changing during play
            return;
        }
        let health = sb.stats.getStat(STATS.Resources.health);
        let energy = sb.stats.getStat(STATS.Resources.energy);
        let magic = sb.stats.getStat(STATS.Resources.magic);
        let pos = sb.rect.position;
        SPRITES.renderSprite(pos.x, pos.y, sb.sprite.index, sb.sprite.sheet, DISPLAY_MODES.static);
        sb.shroudStat(health, sb.healthRect);
        sb.shroudStat(energy, sb.energyRect);
        sb.shroudStat(magic, sb.magicRect);
        sb.renderStatText(sb.healthRect, health);
        sb.renderStatText(sb.energyRect, energy);
        sb.renderStatText(sb.magicRect, magic);
        sb.highlightDelta(sb.healthRect, health);
        sb.highlightDelta(sb.energyRect, energy);
        sb.highlightDelta(sb.magicRect, magic);
    };
    sb.highlightDelta = function(barRect, stat){
        if(stat.changeDelta() == null || stat.changeDelta() == 0 || stat.changeAgeSeconds() > sb.recentThreshold){
            return;
        }
        // Blink the highlight
        let blinks = Math.trunc(stat.changeAgeMilliseconds() / sb.blinkDuration);
        let blinkOff = blinks % 2 == 0; 
        if(blinkOff){
            // Highlighting blinks on and off.
            return;
        }
        if(stat.changeDelta() > 0){
            sb.highlightGain(barRect, stat);
        }
        else if(stat.changeDelta() < 0){
            sb.highlightLoss(barRect, stat);
        }
    };
    sb.highlightGain = function(barRect, stat){
        // TODO
    };
    sb.highlightLoss = function(barRect, stat){
        let delta = stat.changeDelta() * -1;
        let deltaPercentage = delta / stat.max();
        let deltaHeight = deltaPercentage * barRect.size.y;
        let shroudHeight = sb.getShroudHeight(stat.value, stat.max(), barRect.size.y);

        let x = barRect.position.x + sb.rect.position.x;
        let y = barRect.position.y + sb.rect.position.y + shroudHeight - deltaHeight ;
        let width = barRect.size.x;
        let height = deltaHeight;
        GRAPHICS.fillBox(x, y, width, height, stat.transparentColor);
    };
    sb.shroudStat = function(stat, rect){
        let barHeight = rect.size.y;
        let shroudHeight = sb.getShroudHeight(stat.value, stat.max(), barHeight);
        let shroudPos = rect.position.add(sb.rect.position);
        let x = shroudPos.x;
        let y = shroudPos.y;
        let width = rect.size.x;
        let height = shroudHeight;
        let color = GRAPHICS.Colors.Black;
        if(stat.max() == 0){
            color = GRAPHICS.Colors.Beige;
        }
        GRAPHICS.fillBox(shroudPos.x, shroudPos.y, rect.size.x, shroudHeight, color);
    };
    sb.getShroudHeight = function(value, max, barHeight){
        if(max == 0){
            return barHeight;
        }
        let barPercentage = value / max; // how full is the bar
        let shroudPercentage = 1 - barPercentage;
        let shroudHeight = barHeight * shroudPercentage;
        return shroudHeight;
    };
    sb.renderStatText = function(barRect, stat){
        if(stat.max() == 0){
            return;
        }
        let color = stat.color;
        let textSize = SETTINGS.defaultFontSize;
        let x = sb.rect.position.x + barRect.position.x;
        let y = sb.rect.position.y + barRect.position.y + barRect.size.y + textSize;
        let text = stat.name;
        GRAPHICS.drawText(text, x, y, textSize, color);
        y += textSize;
        text = stat.value + "/" + stat.max();
        GRAPHICS.drawText(text, x, y, textSize, color);
    };
    sb.isChangedRecently = function(){
        let health = sb.stats.getStat(STATS.Resources.health);
        if(health.changeAgeSeconds() != null && health.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        let energy = sb.stats.getStat(STATS.Resources.energy);
        if(energy.changeAgeSeconds() != null && energy.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        let magic = sb.stats.getStat(STATS.Resources.magic);
        if(magic.changeAgeSeconds() != null && magic.changeAgeSeconds() <= sb.recentThreshold){
            return true;
        }
        return false;
    };
    return sb;
};

    let sprite = SPRITES.static.paperdoll.paperdoll;
    let pd = UI.COMPONENTS.BaseComponent.new(rect, sprite);

    pd.linkedInv = null;
    pd.slotPositions = {};
    pd.slotPositions[GEAR.slots.head] = VECTOR2.new(21,2);
    pd.slotPositions[GEAR.slots.hand] = VECTOR2.new(2,21);
    pd.slotPositions[GEAR.slots.offHand] = VECTOR2.new(40,21);
    pd.slotPositions[GEAR.slots.torso] = VECTOR2.new(21,21);
    pd.slotPositions[GEAR.slots.legs] = VECTOR2.new(21,40);
    pd.slotPositions[GEAR.slots.feet] = VECTOR2.new(21,59);
    pd.slotPositions[GEAR.slots.special1] = VECTOR2.new(67,13);
    pd.slotPositions[GEAR.slots.special2] = VECTOR2.new(67,32);
    pd.slotPositions[GEAR.slots.special3] = VECTOR2.new(67,51);

    pd.update = function(){
        if(INPUT.keyPress(INPUT.KEYS.K_TAB)){
            pd.toggleActive();
        }

    };
    pd.draw = function(){
        if(!pd.active){
            return;
        }
        let pos = pd.rect.position;
        SPRITES.renderSprite(pos.x, pos.y, pd.sprite.index, pd.sprite.sheet, DISPLAY_MODES.static);
        for(let slot of Object.keys(pd.slotPositions)){
            let slotRect = pd.getSlotRect(slot);
            let item = pd.getItem(slot);
            if(item != null){
                SPRITES.renderSprite(slotRect.position.x, slotRect.position.y, item.sprite.index, item.sprite.sheet, DISPLAY_MODES.static);
            }
        }
        let hoveredSlot = pd.getHoveredSlot();
        if(hoveredSlot){
            let rect = pd.getSlotRect(hoveredSlot);
            GRAPHICS.drawBox(rect.position.x, rect.position.y, rect.size.x, rect.size.y);
            let hoveredItem = pd.getItem(hoveredSlot);
            if(hoveredItem){
                GRAPHICS.drawTooltip(hoveredItem.name);
            }
        }
    };
    pd.toggleActive = function(){
        if(pd.active){
            SCENE.setGameState(GAMESTATES.play);
            pd.active = false;
        }
        else{
            SCENE.setGameState(GAMESTATES.inventory);
            pd.active = true;
        }
    };
    pd.getItem = function(slot){
        if(pd.linkedInv == null){
            return null;
        }
        let slotIndex = GEAR.slotIndices[slot];
        return pd.linkedInv.getItem(slotIndex);
    };
    pd.setItem = function(slot, item){
        if(pd.linkedInv){
            pd.linkedInv.setItem(slot, item);
        }
        let slotIndex = GEAR.slotIndices[slot];
        pd.linkedInv.setItem(slotIndex, item);
    };
    pd.getHoveredSlot = function(){
        let mousePos = INPUT.getDownScaledMousePosition();
        for(let slot of Object.keys(pd.slotPositions)){
            let rect = pd.getSlotRect(slot);
            if(rect && rect.contains(mousePos)){
                return slot;
            }
        }
        return null;
    };
    pd.getSlotRect = function(slot){
        if(pd.slotPositions[slot] == null){
            return null;
        }
        let slotOffset = pd.slotPositions[slot];
        let pos = pd.rect.position.add(slotOffset);
        let size = VECTOR2.new(16,16);
        return SHAPES.RECT.new(pos, size)
    };
    pd.getHoveredItem = function(){
        let slot = pd.getHoveredSlot();
        if(slot == null){
            return null;
        }
        return pd.getItem(slot);
    };
    return pd;
};
