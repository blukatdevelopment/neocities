  <body>
    <div id="Header"></div>

    <h2>Walker</h2>
      <canvas id="mainCanvas" oncontextmenu="return false" width="500" height="500" style="border:1px solid grey; background-color: grey; cursor: none;"></canvas>
    <div>
      Instructions:
      <br>Make a torch, explore the cave, kill the slimes.
      <br>Controls:
      <br>Mouse - Punch / Interact / use equipped item
      <br>WASD - Move
      <br>E - Interact
      <br>F - Use item in hotbar
      <br>Tab - Bring up inventory
      <br>Space - Unarmed attack
      <br>Shift - Sprint
    </div>

    </div>
